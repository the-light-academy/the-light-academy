/* =====================================================================
   ОБЩИЯТ ЛИСТ ЗА ДОМАШНИТЕ ПО АНГЛИЙСКИ
   ---------------------------------------------------------------------
   Един шаблон за всички листове по английски — 4. и 5. клас. Какво има
   на него се решава от данните, не от разметката: заглавието, подзаглавието
   и упражненията се вграждат при сглобяването.

   Видовете работа са седем, за да не е десет пъти едно и също:
     tap       щракане върху вярната дума
     type      писане в празно място
     dvoiki    свързване на двойки
     red       подреждане на разбъркани думи
     razkaz    цял разказ с празни места вътре в текста
     greshka   щракане върху сгрешената дума в изречението
     svoboden  свободен отговор, който преподавателят чете и оценява

   Листът е като другите домашни: иска вход и записва резултата в профила
   на ученика.

   Сглобява се от scripts/english/build.py. Задачите стоят в
   scripts/english4/ и scripts/english5/, а проверките ги сверяват наново
   с правилата, вместо да вярват на написаното.
   ===================================================================== */

<style>:root{
  --ink:#16233F;
  --ink-soft:#55658A;
  --paper:#FFFDF7;
  --paper-raised:#FFFFFF;
  --grid:#EFE3CC;
  --accent:#F7AD19;
  --accent-ink:#925A08;
  --accent-soft:#FFF4DC;
  --pencil:#1B2E52;
  --pencil-soft:#E7EDFA;
  --success:#16603A;
  --success-soft:#E9F7EF;
  --error:#93231F;
  --error-soft:#FBEAE9;
  --shadow: 220 45% 20%;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 42px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/42px 100%,
    var(--paper);
  color:var(--ink);
  font-family:'Nunito', ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* The platform's bar, hand-written here: this sheet is self-contained and
   loading portal.css would fight it over body, fonts and the ground. Same
   shape as portal.html — who this is, where they are, the way out. */
.tlp-bar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; height:64px; padding:0 clamp(14px,4vw,28px);
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,0.6);
  box-shadow:0 8px 32px hsl(var(--shadow) / 0.07);
}
.tlp-bar__left{ display:flex; align-items:center; gap:12px; min-width:0; }
.tlp-bar__logo{
  display:flex; align-items:center; gap:10px; flex:none;
  font-family:'Pacifico', cursive; font-size:1.3rem; line-height:1;
  color:#8C641B; text-decoration:none; white-space:nowrap;
}
.tlp-bar__logo img{ width:34px; height:34px; border-radius:50%; object-fit:cover; display:block; }
.tlp-bar__sep{ width:1px; height:24px; background:rgba(13,27,54,0.14); flex:none; }
.tlp-bar__where{
  font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent-ink); background:var(--accent-soft);
  border:1px solid rgba(146,90,8,0.16);
  padding:5px 12px; border-radius:999px; white-space:nowrap;
}
.tlp-bar__out{
  font-family:'Nunito', sans-serif; font-weight:800; font-size:14px;
  min-height:36px; padding:6px 16px; border-radius:999px; cursor:pointer;
  color:var(--ink-soft); background:transparent; border:1px solid rgba(13,27,54,0.18);
}
.tlp-bar__out:hover{ background:var(--accent-soft); color:var(--accent-ink); }
.tlp-bar__short{ display:none; }
/* Three widths of the same bar. Between roughly 430 and 480 the wordmark and
   the full label together were wider than the screen, so the label shortens
   first and the wordmark goes next -- the round mark never does. */
@media (max-width:700px){
  .tlp-bar__long{ display:none; }
  .tlp-bar__short{ display:inline; }
}
@media (max-width:560px){
  .tlp-bar{ height:58px; }
}
/* "LightSpace" is half the width the old wordmark was, so it now survives
   down to the narrowest phone; below that the round mark carries alone. */
@media (max-width:380px){
  .tlp-bar__name, .tlp-bar__sep{ display:none; }
}

/* Said once the attempt has reached the profile, or explains why it has not. */
.saved-note{
  margin:18px 0 0; padding:10px 14px; border-radius:11px;
  background:var(--accent-soft); color:var(--accent-ink);
  font-size:14px; font-weight:700; text-align:center;
}
.saved-note[hidden]{ display:none; }
.saved-note a{ color:var(--accent-ink); }
.result-back{
  display:inline-flex; align-items:center; justify-content:center;
  margin-top:16px; padding:11px 22px; border-radius:11px;
  font-family:'Fredoka', sans-serif; font-weight:600; font-size:15.5px;
  background:var(--accent); color:#2D1F0E; text-decoration:none;
  position:relative;
}

/* Shown instead of the sheet when the platform cannot be reached. */
.gate{
  max-width:520px; margin:80px auto; padding:22px 24px;
  background:var(--paper-raised); border:1px solid var(--grid);
  border-radius:16px; text-align:center; color:var(--ink-soft);
  font-size:15px; line-height:1.6;
}
.gate[hidden]{ display:none; }</style>
<style>
/* ── листът ───────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif; font-size:17px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px; margin:0 auto; padding:18px clamp(12px,4vw,24px) 120px}
h1,h2,h3{font-family:'Fredoka',system-ui,sans-serif; margin:0}
button{font:inherit; cursor:pointer}
input{font:inherit}
[hidden]{display:none !important}

/* шапката на домашното */
.hw{margin:18px 0 10px}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:12px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink);
  background:var(--accent-soft); border-radius:999px; padding:6px 12px}
.eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--accent)}
.hw h1{font-size:clamp(28px,6vw,42px); line-height:1.05; margin:10px 0 6px}
.hw h1 em{font-style:normal; color:var(--accent-ink)}
.subhead{color:var(--ink-soft); max-width:60ch}
.kotki{display:flex; gap:10px; align-items:flex-end; margin:14px 0 2px}
.progress-row{display:flex; align-items:center; gap:12px; margin-top:16px}
.progress-track{flex:1; height:10px; border-radius:999px; background:var(--pencil-soft); overflow:hidden}
.progress-fill{height:100%; width:0; border-radius:999px;
  background:linear-gradient(90deg,var(--accent),#7ED3B2); transition:width .4s}
.progress-label{font-weight:700; font-size:14px; color:var(--ink-soft); white-space:nowrap}

/* картата на упражнението */
.ex{background:var(--paper-raised); border:1px solid var(--grid); border-radius:20px;
  padding:18px clamp(14px,3vw,22px); margin:16px 0; box-shadow:0 10px 30px hsl(var(--shadow) / .06)}
.ex__top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.ex__num{width:42px; height:42px; border-radius:14px; display:grid; place-items:center;
  font-family:'Fredoka',sans-serif; font-size:20px; font-weight:700; color:#fff; flex:none}
.ex__ime{font-family:'Fredoka',sans-serif; font-size:20px; line-height:1.1}
.ex__bg{font-size:13px; color:var(--ink-soft)}
.ex__ukazanie{margin:10px 0 14px; color:var(--ink-soft); font-size:15px}
.redove{display:grid; gap:10px}

/* ред с изречение */
.red{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 12px; border-radius:14px; background:#FBF8F1; border:1px solid transparent}
.red.shirok{flex-direction:column; align-items:stretch; gap:8px}
.red.ok{background:var(--success-soft); border-color:#BBE3CC}
.red.ne{background:var(--error-soft); border-color:#F2C9C6}
.red .txt{font-size:18px}
.red .nom{width:22px; font-weight:800; color:var(--ink-soft); font-size:14px; flex:none}
.taps{display:flex; gap:6px; flex-wrap:wrap}
.tap{border:2px solid var(--pencil-soft); background:#fff; border-radius:12px;
  padding:6px 14px; font-weight:800; font-size:17px; color:var(--pencil); transition:.12s}
.tap:hover{border-color:var(--accent); transform:translateY(-1px)}
.tap.izbran{background:var(--pencil); border-color:var(--pencil); color:#fff}
.tap.verni{background:var(--success-soft); border-color:#5FB98A; color:var(--success)}
.tap.greshni{background:var(--error-soft); border-color:#D98B86; color:var(--error)}
.dupka{width:96px; padding:6px 10px; border:2px solid var(--pencil-soft); border-radius:12px;
  background:#fff; font-weight:800; font-size:17px; text-align:center; color:var(--pencil)}
.dupka.dalga{width:min(100%,460px); text-align:left}
.dupka:focus{outline:none; border-color:var(--accent)}
.red.ok .dupka{border-color:#5FB98A; background:#fff}
.red.ne .dupka{border-color:#D98B86}
.vqrno-e{font-size:14px; font-weight:700; color:var(--success)}
.greshka-e{font-size:14px; font-weight:700; color:var(--error)}

/* свързване на двойки */
.dvoiki{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dvoiki .kol{display:grid; gap:8px}
.dvoiki button{border:2px solid var(--pencil-soft); background:#fff; border-radius:14px;
  padding:11px; font-weight:700; font-size:16px; transition:.12s}
.dvoiki button:hover{border-color:var(--accent)}
.dvoiki button.izbran{border-color:var(--pencil); background:var(--pencil-soft)}
.dvoiki button.svurzan{border-color:#5FB98A; background:var(--success-soft);
  color:var(--success); pointer-events:none}
.dvoiki button.greshni{border-color:#D98B86; background:var(--error-soft)}
.dvoiki button[data-d].svurzan{opacity:.4}
.dvoiki button .strelka{color:var(--accent-ink)}

/* подреждане на думи */
.red-stroi{display:grid; gap:8px}
.stroi-liniq{min-height:52px; border:2px dashed var(--pencil-soft); border-radius:14px;
  padding:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; background:#fff}
.stroi-liniq:empty::before{content:'тук се подрежда изречението'; color:#B9B2A2; font-size:14px}
.duma{border:2px solid var(--pencil-soft); background:#fff; border-radius:11px;
  padding:5px 12px; font-weight:800; font-size:17px; color:var(--pencil)}
.duma:hover{border-color:var(--accent)}
.duma.vzeta{opacity:.25; pointer-events:none}
.stroi-liniq .duma{border-color:var(--accent); background:var(--accent-soft)}

/* кутията с думи над упражнението */
.kutiq{margin:0 0 14px; padding:12px 14px; border-radius:16px;
  background:var(--accent-soft); border:1px dashed var(--accent)}
.kutiq b{display:block; font-family:'Fredoka',sans-serif; font-size:13px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:8px}
.kutiq span{display:flex; flex-wrap:wrap; gap:6px}
.kutiq i{font-style:normal; background:#fff; border:1px solid var(--grid);
  border-radius:999px; padding:3px 11px; font-weight:700; font-size:15px; color:var(--pencil)}

/* разказът с празни места вътре в текста */
.razkaz{font-size:17.5px; line-height:2.1}
.razkaz p{margin:0 0 6px}
.razkaz p:empty{height:8px}
.dupka-red{display:inline-flex; align-items:center; gap:4px}
.dupka.dupka-v-tekst{width:118px; padding:2px 8px; font-size:16px; text-align:center}
.dupka-red.ok .dupka{border-color:#5FB98A; background:var(--success-soft)}
.dupka-red.ne .dupka{border-color:#D98B86; background:var(--error-soft)}
.dupka-red .vqrno-e,.dupka-red .greshka-e{font-size:13px}

/* хвани грешката: изречението е от бутони */
.greshka-red .izrechenie{display:flex; flex-wrap:wrap; align-items:center; gap:4px;
  font-size:17px}
.duma-g{border:1.5px solid transparent; background:transparent; border-radius:9px;
  padding:3px 7px; font-size:17px; color:var(--ink); transition:.12s}
.duma-g:hover{border-color:var(--accent); background:#fff}
.duma-g.posochena{background:var(--pencil); border-color:var(--pencil); color:#fff; font-weight:700}
.duma-g.tochno{background:var(--success-soft); border-color:#5FB98A; color:var(--success);
  font-weight:800}
.duma-g.ne-tam{background:var(--error-soft); border-color:#D98B86; color:var(--error)}
.greshka-red .krai{font-size:17px; margin-left:-4px}

/* свободен отговор — чете го преподавателят */
.svob-v{margin:0 0 8px; font-size:17px}
.svob-v .nom{display:inline-block; margin-right:7px}
.svob{width:100%; border:2px solid var(--pencil-soft); border-radius:12px; padding:9px 12px;
  font:inherit; font-size:16px; color:var(--pencil); background:#fff; resize:vertical}
.svob:focus{outline:none; border-color:var(--accent)}
.svob[readonly]{background:#FBF8F1}
.obrazec{margin:8px 0 0; padding:9px 12px; border-radius:12px; background:var(--success-soft);
  font-size:15px; color:var(--success)}
.obrazec b{font-family:'Fredoka',sans-serif}

/* подсказката с първата буква */
.podskazka{font-family:'JetBrains Mono',ui-monospace,monospace; font-size:15px;
  letter-spacing:.14em; color:var(--ink-soft)}

/* обяснението */
.zashto{margin-top:12px; padding:10px 14px; border-radius:14px; background:var(--pencil-soft);
  font-size:15px; color:var(--pencil)}
.zashto b{font-family:'Fredoka',sans-serif}

/* долната лента */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:40; padding:10px 12px;
  background:rgba(255,253,247,.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--grid)}
.dock-inner{max-width:860px; margin:0 auto; display:flex; align-items:center; gap:12px}
.dock-score{font-weight:800}
.dock-fill{flex:1}
.dock button{border:none; border-radius:999px; padding:11px 22px; font-weight:800;
  background:var(--accent); color:#4A2E02}
.dock button.secondary{background:var(--pencil-soft); color:var(--pencil)}
.dock button:hover{filter:brightness(1.05)}

/* резултатът */
.result{margin-top:22px; padding:22px; border-radius:22px; text-align:center;
  background:var(--paper-raised); border:1px solid var(--grid)}
.result h2{font-size:30px; margin-bottom:6px}
.result .ocenka{font-size:46px; font-family:'Fredoka',sans-serif; color:var(--accent-ink)}
.result-back{display:inline-block; margin-top:14px; font-weight:800; color:var(--pencil)}
.saved-note{font-size:14px; color:var(--ink-soft); margin-top:8px}

@media (max-width:560px){
  .razkaz{font-size:16px; line-height:2}
  .dupka.dupka-v-tekst{width:96px}
  .dvoiki{grid-template-columns:1fr}
  .dupka{width:84px}
  .dock-score{white-space:nowrap; font-size:14px}
  .dock button{padding:11px 16px}
  .dock-inner{gap:8px}
}
@media print{
  .tlp-bar,.dock,.zashto{display:none !important}
  .ex{break-inside:avoid; box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

const $ = (s, p) => (p || document).querySelector(s);

function ekraniraj(t){
  return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
/* Отговорите се сравняват меко: главни букви, двойни интервали, кривият
   апостроф и точката накрая не са грешка в четвърти клас. */
function norm(t){
  return String(t == null ? '' : t).toLowerCase()
    .replace(/[’ʼ`]/g, "'")
    .replace(/,/g, '')
    .replace(/\s+/g, ' ')
    .replace(/\s+([?!.])/g, '$1')
    .replace(/[.!?]+$/, '')
    .trim();
}
function razburkai(masiv, seme){
  const a = masiv.slice();
  let h = 0;
  for(let i = 0; i < seme.length; i++) h = (h * 31 + seme.charCodeAt(i)) >>> 0;
  for(let i = a.length - 1; i > 0; i--){
    h = (h * 1103515245 + 12345) >>> 0;
    const j = h % (i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

  else if(DANNI.shapka === 'praznik')
    shapka.innerHTML = [0,1,2,3,4].map(i => praznik(BOI[i], i)).join('');
  else shapka.hidden = true;

  $('#uprajneniq').innerHTML = DANNI.upr.map(function(u, ui){
    const boia = BOI[ui % BOI.length];
    return '<section class="ex" id="ex-' + ui + '">'
      + '<div class="ex__top">'
      +   '<div class="ex__num" style="background:' + boia + '">' + u.kod + '</div>'
      +   '<div><div class="ex__ime">' + ekraniraj(u.ime) + '</div>'
      +   '<div class="ex__bg">' + ekraniraj(u.bg) + '</div></div></div>'
      + '<p class="ex__ukazanie">' + ekraniraj(u.ukazanie) + '</p>'
      + (u.kutiq ? '<div class="kutiq"><b>Word Box</b><span>'
          + u.kutiq.map(d => '<i>' + ekraniraj(d) + '</i>').join('') + '</span></div>' : '')
      + tqlo(u, ui)
      + '<div class="zashto" id="z-' + ui + '" hidden></div>'
      + '</section>';
  }).join('');

  DANNI.upr.forEach(function(u, ui){
    if(u.vid === 'tap') vurjiTap(u, ui);
    else if(u.vid === 'type' || u.vid === 'razkaz') vurjiType(u, ui);
    else if(u.vid === 'dvoiki') vurjiDvoiki(u, ui);
    else if(u.vid === 'red') vurjiRed(u, ui);
    else if(u.vid === 'greshka') vurjiGreshka(u, ui);
    else if(u.vid === 'svoboden') vurjiSvoboden(u, ui);
  });
  osveji();
}

function tqlo(u, ui){
  if(u.vid === 'tap'){
    return '<div class="redove">' + u.redove.map(function(r, ri){
      const izbori = r.izbori || u.izbori;
      return '<div class="red' + (u.shirok ? ' shirok' : '') + '" id="r-' + ui + '-' + ri + '">'
        + '<span class="nom">' + (ri + 1) + '</span>'
        + '<span class="txt">' + ekraniraj(r.predi) + (u.shirok ? '' : ' ___ ')
        +   ekraniraj(r.sled) + '</span>'
        + '<span class="taps">' + izbori.map(function(iz){
            return '<button class="tap" data-u="' + ui + '" data-r="' + ri + '" '
                 + 'data-v="' + ekraniraj(iz) + '">' + ekraniraj(iz) + '</button>';
          }).join('') + '</span>'
        + '<span class="vqrno-e" id="ve-' + ui + '-' + ri + '" hidden></span></div>';
    }).join('') + '</div>';
  }
  if(u.vid === 'type'){
    return '<div class="redove">' + u.redove.map(function(r, ri){
      const dalgo = !!u.dalgo;
      return '<div class="red' + (dalgo ? ' shirok' : '') + '" id="r-' + ui + '-' + ri + '">'
        + '<span class="txt"><span class="nom">' + (ri + 1) + '</span>'
        +   ekraniraj(r.predi) + (dalgo ? '' : ' ') + '</span>'
        + (dalgo ? '' : '')
        + '<input class="dupka' + (dalgo ? ' dalga' : '') + '" id="i-' + ui + '-' + ri + '" '
        +   'type="text" autocomplete="off" autocapitalize="off" spellcheck="false" '
        +   'data-u="' + ui + '" data-r="' + ri + '" placeholder="' + (dalgo ? '…' : '?') + '" />'
        + (r.sled ? '<span class="txt">' + ekraniraj(r.sled) + '</span>' : '')
        + (r.podskazka ? '<span class="podskazka">' + ekraniraj(r.podskazka) + '</span>' : '')
        + '<span class="vqrno-e" id="ve-' + ui + '-' + ri + '" hidden></span></div>';
    }).join('') + '</div>';
  }
  if(u.vid === 'razkaz'){
    /* Разказът се изписва цял, а празните места са вътре в текста: така
       се чете като история, а не като списък от редове. */
    let n = -1;
    const tqlo_ = ekraniraj(u.tekst).replace(/[{](\d+)[}]/g, function(_, nomer){
      n++;
      const ri = n;
      return '<span class="dupka-red" id="r-' + ui + '-' + ri + '">'
           + '<input class="dupka dupka-v-tekst" id="i-' + ui + '-' + ri + '" type="text" '
           + 'autocomplete="off" autocapitalize="off" spellcheck="false" '
           + 'data-u="' + ui + '" data-r="' + ri + '" placeholder="' + nomer + '" />'
           + '<span class="vqrno-e" id="ve-' + ui + '-' + ri + '" hidden></span></span>';
    });
    return '<div class="razkaz">'
      + tqlo_.split('\n').map(red => '<p>' + red + '</p>').join('')
      + '</div>';
  }
  if(u.vid === 'greshka'){
    return '<div class="redove">' + u.redove.map(function(r, ri){
      return '<div class="red shirok greshka-red" id="r-' + ui + '-' + ri + '">'
        + '<div class="izrechenie">'
        +   '<span class="nom">' + (ri + 1) + '</span>'
        +   r.dumi.map(function(d, di){
              return '<button class="duma-g" data-u="' + ui + '" data-r="' + ri + '" '
                   + 'data-i="' + di + '">' + ekraniraj(d) + '</button>';
            }).join('')
        +   '<span class="krai">' + ekraniraj(r.krai || '') + '</span>'
        + '</div>'
        + '<span class="vqrno-e" id="ve-' + ui + '-' + ri + '" hidden></span></div>';
    }).join('') + '</div>';
  }
  if(u.vid === 'svoboden'){
    return '<div class="redove">' + u.redove.map(function(r, ri){
      return '<div class="red shirok" id="r-' + ui + '-' + ri + '">'
        + '<p class="svob-v"><span class="nom">' + (ri + 1) + '</span>'
        +   ekraniraj(r.vupros) + '</p>'
        + '<textarea class="svob" id="t-' + ui + '-' + ri + '" rows="2" '
        +   'data-u="' + ui + '" data-r="' + ri + '" '
        +   'placeholder="Write a full sentence\u2026"></textarea>'
        + '<p class="obrazec" id="o-' + ui + '-' + ri + '" hidden></p></div>';
    }).join('') + '</div>';
  }
  if(u.vid === 'dvoiki'){
    const levi = u.dvojki.map(p => p[0]);
    const desni = razburkai(u.dvojki.map(p => p[1]), 'd' + ui);
    return '<div class="dvoiki" id="dv-' + ui + '">'
      + '<div class="kol">' + levi.map(function(t){
          return '<button data-l="' + ekraniraj(t) + '">' + ekraniraj(t) + '</button>'; }).join('')
      + '</div><div class="kol">' + desni.map(function(t){
          return '<button data-d="' + ekraniraj(t) + '">' + ekraniraj(t) + '</button>'; }).join('')
      + '</div></div>';
  }
  /* подреждане */
  return '<div class="redove">' + u.redove.map(function(r, ri){
    /* Ако листът носи своето разбъркване (както е на хартия), то се
       ползва; иначе се разбърква тук, но винаги по един и същи начин. */
    const dumi = r.razburkano ? r.razburkano.slice()
                              : razburkai(r.otgovor.split(' '), 'r' + ui + ri);
    return '<div class="red shirok" id="r-' + ui + '-' + ri + '">'
      + '<div class="red-stroi">'
      +   '<div class="stroi-liniq" id="l-' + ui + '-' + ri + '"></div>'
      +   '<div class="taps" id="d-' + ui + '-' + ri + '">' + dumi.map(function(d, di){
            return '<button class="duma" data-u="' + ui + '" data-r="' + ri + '" '
                 + 'data-i="' + di + '">' + ekraniraj(d) + '</button>'; }).join('')
      +   '</div></div>'
      + '<span class="vqrno-e" id="ve-' + ui + '-' + ri + '" hidden></span></div>';
  }).join('') + '</div>';
}

/* ── закачане ────────────────────────────────────────────────────── */
function vurjiTap(u, ui){
  $$('#ex-' + ui + ' .tap').forEach(function(b){
    b.addEventListener('click', function(){
      if(S.proveren) return;
      const ri = +b.dataset.r;
      $$('#r-' + ui + '-' + ri + ' .tap').forEach(x => x.classList.remove('izbran'));
      b.classList.add('izbran');
      S.otg[kluch(ui, ri)] = b.dataset.v;
      osveji();
    });
  });
}
function vurjiType(u, ui){
  $$('#ex-' + ui + ' .dupka').forEach(function(inp){
    inp.addEventListener('input', function(){
      S.otg[kluch(ui, +inp.dataset.r)] = inp.value;
      osveji();
    });
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') proveri(); });
  });
}
/* Щракането върху сгрешената дума: включва се и се изключва, защото
   едно от изреченията има две грешки и детето трябва да може да си
   поправи избора. */
function vurjiGreshka(u, ui){
  $$('#ex-' + ui + ' .duma-g').forEach(function(b){
    b.addEventListener('click', function(){
      if(S.proveren) return;
      const ri = +b.dataset.r, di = +b.dataset.i, k = kluch(ui, ri);
      const vzeti = S.greshki[k] || (S.greshki[k] = []);
      const mqsto = vzeti.indexOf(di);
      if(mqsto === -1){ vzeti.push(di); b.classList.add('posochena'); }
      else { vzeti.splice(mqsto, 1); b.classList.remove('posochena'); }
      osveji();
    });
  });
}
function vurjiSvoboden(u, ui){
  $$('#ex-' + ui + ' .svob').forEach(function(t){
    t.addEventListener('input', function(){
      S.otg[kluch(ui, +t.dataset.r)] = t.value;
      osveji();
    });
  });
}
function vurjiDvoiki(u, ui){
  let izbran = null;
  const karta = {};
  u.dvojki.forEach(p => { karta[p[0]] = p[1]; });
  S.dvoiki[ui] = S.dvoiki[ui] || {};
  $$('#dv-' + ui + ' [data-l]').forEach(function(b){
    b.addEventListener('click', function(){
      if(S.proveren) return;
      $$('#dv-' + ui + ' [data-l]').forEach(x => x.classList.remove('izbran'));
      b.classList.add('izbran');
      izbran = b.dataset.l;
    });
  });
  $$('#dv-' + ui + ' [data-d]').forEach(function(b){
    b.addEventListener('click', function(){
      if(S.proveren || !izbran) return;
      S.dvoiki[ui][izbran] = b.dataset.d;
      if(karta[izbran] === b.dataset.d){
        b.classList.add('svurzan');
        const l = $('#dv-' + ui + ' [data-l="' + CSS.escape(izbran) + '"]');
        l.classList.add('svurzan'); l.classList.remove('izbran');
        /* Двойката се изписва цяла, за да не се чуди после кое с кое е. */
        l.innerHTML = ekraniraj(izbran) + ' <span class="strelka">→</span> '
                    + ekraniraj(b.dataset.d);
      }else{
        b.classList.add('greshni');
        setTimeout(function(){ b.classList.remove('greshni'); }, 500);
      }
      izbran = null;
      osveji();
    });
  });
}
function vurjiRed(u, ui){
  u.redove.forEach(function(r, ri){
    const liniq = $('#l-' + ui + '-' + ri);
    S.red[kluch(ui, ri)] = [];
    $$('#d-' + ui + '-' + ri + ' .duma').forEach(function(b){
      b.addEventListener('click', function(){
        if(S.proveren || b.classList.contains('vzeta')) return;
        b.classList.add('vzeta');
        S.red[kluch(ui, ri)].push({ duma: b.textContent, i: +b.dataset.i });
        prerisuvaiRed(ui, ri);
        osveji();
      });
    });
    liniq.addEventListener('click', function(e){
      if(S.proveren) return;
      const d = e.target.closest('.duma');
      if(!d) return;
      const k = +d.dataset.vzeta;
      const vzeti = S.red[kluch(ui, ri)];
      const mqsto = vzeti.findIndex(x => x.i === k);
      if(mqsto !== -1){
        vzeti.splice(mqsto, 1);
        $('#d-' + ui + '-' + ri + ' .duma[data-i="' + k + '"]').classList.remove('vzeta');
        prerisuvaiRed(ui, ri);
        osveji();
      }
    });
  });
}
function prerisuvaiRed(ui, ri){
  $('#l-' + ui + '-' + ri).innerHTML = S.red[kluch(ui, ri)].map(function(x){
    return '<button class="duma" data-vzeta="' + x.i + '">' + ekraniraj(x.duma) + '</button>';
  }).join('');
}

/* ── проверка ────────────────────────────────────────────────────── */
/* Вярното на един ред, както се показва при грешка. */
function vqrnoto(u, ri){
  if(u.vid === 'razkaz') return u.dupki[ri].otgovor;
  if(u.vid === 'greshka') return u.redove[ri].vqrno;
  return u.redove[ri].otgovor;
}
/* Свободните отговори ги чете преподавателят: те не носят точки тук и
   не влизат в броя верни. Затова се питат отделно. */
function rucheno(u){ return u.vid === 'svoboden'; }

function verenLi(u, ui, ri){
  const r = (u.redove || [])[ri];
  if(u.vid === 'dvoiki'){
    const p = u.dvojki[ri];
    return (S.dvoiki[ui] || {})[p[0]] === p[1];
  }
  if(u.vid === 'razkaz'){
    const dadeno = S.otg[kluch(ui, ri)];
    if(dadeno == null || String(dadeno).trim() === '') return false;
    const o = u.dupki[ri];
    return [o.otgovor].concat(o.oshte || []).some(v => norm(v) === norm(dadeno));
  }
  if(u.vid === 'greshka'){
    /* Вярно е, когато посочените думи са точно тези, които трябва:
       нито по-малко, нито една в повече. */
    const dadeni = (S.greshki[kluch(ui, ri)] || []).slice().sort((a, b) => a - b);
    const trqbva = r.greshni.slice().sort((a, b) => a - b);
    return dadeni.length === trqbva.length
        && dadeni.every((x, i) => x === trqbva[i]);
  }
  if(u.vid === 'red'){
    const dadeno = (S.red[kluch(ui, ri)] || []).map(x => x.duma).join(' ');
    return norm(dadeno) === norm(r.otgovor);
  }
  const dadeno = S.otg[kluch(ui, ri)];
  if(dadeno == null || String(dadeno).trim() === '') return false;
  const verni = [r.otgovor].concat(r.oshte || []);
  return verni.some(v => norm(v) === norm(dadeno));
}
function broiRedove(u){
  if(u.vid === 'dvoiki') return u.dvojki.length;
  if(u.vid === 'razkaz') return u.dupki.length;
  return u.redove.length;
}
/* Колко от тях се броят за оценка — свободните отговори не се броят. */
function broiZaOcenka(u){ return rucheno(u) ? 0 : broiRedove(u); }
function otgovoreni(){
  let n = 0;
  DANNI.upr.forEach(function(u, ui){
    for(let ri = 0; ri < broiZaOcenka(u); ri++){
      if(u.vid === 'dvoiki'){ if((S.dvoiki[ui] || {})[u.dvojki[ri][0]]) n++; }
      else if(u.vid === 'red'){ if((S.red[kluch(ui, ri)] || []).length) n++; }
      else if(u.vid === 'greshka'){ if((S.greshki[kluch(ui, ri)] || []).length) n++; }
      else if(S.otg[kluch(ui, ri)] != null && String(S.otg[kluch(ui, ri)]).trim() !== '') n++;
    }
  });
  return n;
}
function osveji(){
  const n = otgovoreni();
  $('#progressFill').style.width = (OBSHTO ? Math.round(100 * n / OBSHTO) : 0) + '%';
  $('#progressLabel').textContent = n + ' / ' + OBSHTO + ' отговорени';
}

function proveri(){
  S.proveren = true;
  let verni = 0;
  DANNI.upr.forEach(function(u, ui){
    if(rucheno(u)){
      /* Тук няма вярно и грешно: отговорът отива при преподавателя, а
         детето вижда един възможен образец, за да се сравни. */
      u.redove.forEach(function(r, ri){
        const o = $('#o-' + ui + '-' + ri);
        o.hidden = false;
        o.innerHTML = '<b>One possible answer:</b> ' + ekraniraj(r.obrazec);
        $('#t-' + ui + '-' + ri).readOnly = true;
      });
      const z0 = $('#z-' + ui);
      z0.hidden = false;
      z0.innerHTML = '<b>Защо:</b> ' + ekraniraj(u.zashto);
      return;
    }
    for(let ri = 0; ri < broiRedove(u); ri++){
      const red = $('#r-' + ui + '-' + ri);
      const ok = verenLi(u, ui, ri);
      if(ok) verni++;
      if(u.vid === 'dvoiki'){
        const p = u.dvojki[ri];
        const l = $('#dv-' + ui + ' [data-l="' + CSS.escape(p[0]) + '"]');
        const d = $('#dv-' + ui + ' [data-d="' + CSS.escape(p[1]) + '"]');
        if(ok){ l.classList.add('svurzan'); d.classList.add('svurzan'); }
        else {
          l.classList.add('greshni'); d.classList.add('greshni');
          l.innerHTML = ekraniraj(p[0]) + ' <span class="strelka">→</span> '
                      + ekraniraj(p[1]);
        }
        continue;
      }
      red.classList.add(ok ? 'ok' : 'ne');
      const bel = $('#ve-' + ui + '-' + ri);
      bel.hidden = false;
      if(ok){ bel.className = 'vqrno-e'; bel.textContent = '✓'; }
      else {
        bel.className = 'greshka-e';
        const kaztova = (u.vid === 'razkaz' ? u.dupki[ri] : u.redove[ri]).zashto;
        bel.textContent = '✗ вярно е: ' + vqrnoto(u, ri) + (kaztova ? ' — ' + kaztova : '');
      }
      if(u.vid === 'greshka'){
        /* Показва се кои думи са били сгрешени и как звучи поправено. */
        const r2 = u.redove[ri];
        $$('#r-' + ui + '-' + ri + ' .duma-g').forEach(function(b){
          const di = +b.dataset.i;
          if(r2.greshni.indexOf(di) !== -1) b.classList.add('tochno');
          else if(b.classList.contains('posochena')) b.classList.add('ne-tam');
        });
      }
      if(u.vid === 'tap'){
        $$('#r-' + ui + '-' + ri + ' .tap').forEach(function(b){
          if(b.dataset.v === u.redove[ri].otgovor) b.classList.add('verni');
          else if(b.classList.contains('izbran')) b.classList.add('greshni');
        });
      }
    }
    const z = $('#z-' + ui);
    z.hidden = false;
    z.innerHTML = '<b>Защо:</b> ' + ekraniraj(u.zashto);
  });

  $('#scoreNow').textContent = verni;
  const proc = Math.round(100 * verni / OBSHTO);
  const r = $('#result');
  r.hidden = false;
  $('#resultScore').textContent = verni + ' / ' + OBSHTO;
  const titli = DANNI.titli || ['Purrfect!', 'Well done!', 'Good try!'];
  $('#resultTitle').textContent = proc >= 90 ? titli[0]
                                : proc >= 70 ? titli[1] : titli[2];
  $('#resultSub').textContent = proc >= 90 ? DANNI.pohvali[0]
                              : proc >= 70 ? DANNI.pohvali[1] : DANNI.pohvali[2];
  r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  $('#checkBtn').disabled = true;
  zapishi(verni);
}

function nulirai(){
  S.otg = {}; S.dvoiki = {}; S.red = {}; S.greshki = {}; S.proveren = false;
  $('#result').hidden = true;
  $('#checkBtn').disabled = false;
  $('#scoreNow').textContent = '0';
  risuvai();
}

/* ── записване в профила ─────────────────────────────────────────── */
let zapisano = false;
async function zapishi(verni){
  const note = $('#savedNote');
  if(typeof TLA === 'undefined' || !TLA.isConfigured() || zapisano) return;
  zapisano = true;
  const records = [], svobodni = [];
  DANNI.upr.forEach(function(u, ui){
    if(rucheno(u)){
      /* Свободните отговори отиват в part2 — точно във формата, която
         таблото чете, за да ги покаже за ръчна оценка. */
      u.redove.forEach(function(r, ri){
        const dadeno = String(S.otg[kluch(ui, ri)] || '').trim();
        svobodni.push({
          id: u.kod + '.' + (ri + 1),
          taskId: u.kod,
          points: 1,
          prompt: r.vupros,
          studentAnswer: dadeno || '(няма отговор)',
          solution: r.obrazec
        });
      });
      return;
    }
    for(let ri = 0; ri < broiRedove(u); ri++){
      const ok = verenLi(u, ui, ri);
      const uslovie = u.vid === 'dvoiki' ? u.dvojki[ri][0]
                    : u.vid === 'red' ? '(подреди) ' + u.redove[ri].otgovor
                    : u.vid === 'greshka' ? '(хвани грешката) ' + u.redove[ri].izr
                    : u.vid === 'razkaz' ? '(празно място ' + (ri + 1) + ')'
                    : (u.redove[ri].predi + ' ___ ' + (u.redove[ri].sled || '')).trim();
      const dadeno = u.vid === 'dvoiki' ? ((S.dvoiki[ui] || {})[u.dvojki[ri][0]] || '')
                   : u.vid === 'red' ? (S.red[kluch(ui, ri)] || []).map(x => x.duma).join(' ')
                   : u.vid === 'greshka'
                       ? (S.greshki[kluch(ui, ri)] || []).slice().sort((a, b) => a - b)
                           .map(i => u.redove[ri].dumi[i]).join(' ')
                   : (S.otg[kluch(ui, ri)] || '');
      records.push({
        id: u.kod + '.' + (ri + 1),
        points: 1,
        text: u.ime + ' · ' + uslovie,
        kind: 'free',
        chosenAnswer: String(dadeno).trim() === '' ? '(без отговор)' : String(dadeno),
        correctAnswer: u.vid === 'dvoiki' ? u.dvojki[ri][1] : vqrnoto(u, ri),
        earned: ok ? 1 : 0,
        correct: ok,
        explanation: u.zashto
      });
    }
  });
  try{
    await TLA.saveAttempt(DANNI.slug, {
      autoScore: verni, autoMax: OBSHTO,
      manualMax: svobodni.length ? svobodni.length : null,
      records: records, part2: svobodni.length ? svobodni : null
    });
    note.textContent = svobodni.length
      ? '\u2713 Записано. Свободните отговори ги проверява преподавателят.'
      : '\u2713 Резултатът е записан в профила ти.';
    note.hidden = false;
  }catch(err){
    note.textContent = 'Резултатът не беше записан: ' + (err.message || err);
    note.hidden = false;
  }
}

/* ── палим ───────────────────────────────────────────────────────── */
document.getElementById('signOutBtn').addEventListener('click', () => TLA.signOut());
$('#checkBtn').addEventListener('click', proveri);
$('#resetBtn').addEventListener('click', nulirai);

(async function(){
  const gate = $('#gate'), sheet = $('#sheet');
  OBSHTO = DANNI.upr.reduce((n, u) => n + broiZaOcenka(u), 0);
  $('#scoreMax').textContent = OBSHTO;
  if(typeof TLA === 'undefined' || !TLA.isConfigured()){
    gate.textContent = 'Няма връзка с платформата. Отвори домашното отново от профила си.';
    gate.hidden = false;
    return;
  }
  const auth = await TLA.requireAuth();
  if(!auth) return;
  sheet.hidden = false;
  risuvai();
})();
</script>
