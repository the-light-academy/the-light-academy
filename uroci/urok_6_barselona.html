<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Барселона: двубой с рационални числа · 6. клас</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Интерактивен урок за 6. клас: умножение и деление на рационални числа в три етапа — надбягване един срещу един, мисия в метрото и творческа мозайка на Гауди." />
<link rel="icon" href="../favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

/* =====================================================================
   УРОК ЗА ДЪСКАТА — „Барселона: двубой с рационални числа“, 6. клас
   ---------------------------------------------------------------------
   Умножение и деление на рационални числа за двама ученици на по-високо
   ниво. Три етапа: надбягване един срещу един, мисия в метрото в екип и
   творческа мозайка.

   КАК Е НАПРАВЕНА ДВИЖЕНИЕТО

   · Един-единствен rAF цикъл (LOOP) движи всичко: фона, надбягването,
     влаковете, частиците. Вместо десет таймера, които се разминават,
     всеки „актьор“ се записва в LOOP.add(fn) и получава делта време.
   · Анимациите на стойности минават през tween() с easing — нищо не
     скача рязко.
   · Частиците (конфети, искри, прах изпод маратонките) са един общ
     слой върху <canvas id="fx">.
   · При prefers-reduced-motion всичко се изчислява мигновено: децата с
     чувствителност към движение виждат същата информация, но на място.

   Както и другите уроци за дъската: НИКЪДЕ НЯМА ПОЛЕ ЗА ВЪВЕЖДАНЕ НА
   ОТГОВОР. Отговорът се показва с обръщане на картата.

   Отговорите са пресметнати НАНОВО с точна дробна аритметика, докато
   урокът се пишеше: scratchpad/barselona.js чете данните оттук.
   ===================================================================== */

:root{
  --ink:#141B2E;
  --ink-soft:#5A6E88;
  --paper:#FFFBF4;
  --glass:rgba(255,255,255,0.72);
  --line:#E7DFD2;
  --sea:#0E6BA8;   --sea-2:#7EC8F0;
  --sun:#F2A541;   --sun-2:#FFD48A;
  --terra:#D1495B; --terra-2:#F58B7C;
  --mint:#06A77D;
  --violet:#6B4FA8;
  --ok:#1F7A4C;  --ok-soft:#E4F2EA;
  --bad:#C0392B; --bad-soft:#FBE9E7;
  --shadow:0 18px 40px rgba(20,27,46,.14);
}
*{ box-sizing:border-box; }
html{ background:#FFFBF4; scroll-behavior:smooth; }
html,body{ margin:0; color:var(--ink); }
body{ font-family:'Nunito',system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.55;
  overflow-x:hidden; }

/* ── двата слоя отзад ─────────────────────────────────────────── */
#bg,#fx{ position:fixed; inset:0; width:100%; height:100%; display:block; }
#bg{ z-index:-2; }
#fx{ z-index:60; pointer-events:none; }

/* ── лентата горе ─────────────────────────────────────────────── */
.bar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;
  padding:0.5rem clamp(0.8rem,3vw,1.4rem);
  background:var(--glass); backdrop-filter:blur(14px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.6);
}
.bar b{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:1.05rem; }
.bar b em{ font-style:normal; color:var(--terra); }
.bar small{ color:var(--ink-soft); font-size:0.82rem; }
.bar .sp{ flex:1 1 auto; }
.logo{ width:42px; height:36px; flex:none; }
.logo .t1,.logo .t2,.logo .t3{ transform-origin:50% 100%; animation:breathe 4s ease-in-out infinite; }
.logo .t2{ animation-delay:.5s; } .logo .t3{ animation-delay:1s; }
@keyframes breathe{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(1.06); } }

.scorebox{ display:flex; align-items:center; gap:0.3rem; font-family:'JetBrains Mono',monospace;
  font-weight:700; font-size:1rem; }
.scorebox i{ font-style:normal; border-radius:10px; padding:0.15rem 0.6rem; color:#fff;
  transition:transform .25s cubic-bezier(.3,1.6,.5,1); }
.scorebox i.p1{ background:var(--sea); } .scorebox i.p2{ background:var(--terra); }
.scorebox i.pop{ transform:scale(1.4); }

/* тънката лента на напредъка */
.prog{ position:absolute; left:0; right:0; bottom:-1px; height:3px; background:rgba(20,27,46,.08); }
.prog i{ display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--sun),var(--terra),var(--sea));
  transition:width .7s cubic-bezier(.3,1,.4,1); }

.wrap{ max-width:1040px; margin:0 auto; padding:1rem 1rem 5rem; position:relative; z-index:1; }

/* ── етапите: ленти вместо табове ─────────────────────────────── */
.tabs{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.1rem; }
.tab{
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:0.55rem; text-align:left;
  padding:0.5rem 0.9rem; border:1.5px solid rgba(255,255,255,.7); border-radius:16px;
  background:var(--glass); backdrop-filter:blur(8px); cursor:pointer; font:inherit; min-height:54px;
  transition:transform .25s cubic-bezier(.3,1.5,.5,1), box-shadow .25s, border-color .25s;
}
.tab:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
.tab b{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:0.96rem; display:block; }
.tab small{ display:block; color:var(--ink-soft); font-size:0.78rem; }
.tab .dot{ width:28px; height:28px; flex:none; border-radius:50%;
  display:grid; place-items:center; font-size:0.8rem; font-weight:800; color:#fff;
  transition:transform .3s cubic-bezier(.3,1.7,.5,1); }
.tab:nth-child(1) .dot{ background:var(--sun); color:var(--ink); }
.tab:nth-child(2) .dot{ background:var(--sea); }
.tab:nth-child(3) .dot{ background:var(--mint); }
.tab:nth-child(4) .dot{ background:var(--terra); }
.tab[aria-selected="true"]{ border-color:var(--terra); box-shadow:var(--shadow); }
.tab[aria-selected="true"] .dot{ transform:scale(1.18) rotate(-8deg); }
.tab.done .dot::after{ content:'✓'; position:absolute; }
/* вълничка при щракване */
.ripple{ position:absolute; border-radius:50%; background:rgba(209,73,91,.25);
  transform:translate(-50%,-50%) scale(0); animation:rip .6s ease-out forwards; pointer-events:none; }
@keyframes rip{ to{ transform:translate(-50%,-50%) scale(14); opacity:0; } }

/* ── картите: влизат на вълна ─────────────────────────────────── */
.card{
  background:var(--glass); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.75); border-radius:22px;
  padding:1.1rem 1.2rem; margin-bottom:1.1rem; box-shadow:var(--shadow);
  opacity:0; transform:translateY(26px) scale(.985);
}
.card.in{ animation:cardIn .55s cubic-bezier(.22,1.2,.36,1) forwards; }
@keyframes cardIn{ to{ opacity:1; transform:none; } }

h1{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(27px,5vw,40px);
  margin:0 0 0.35rem; line-height:1.08; }
h1 em{ font-style:normal; color:var(--terra); }
h2{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.2rem;
  margin:1.2rem 0 0.6rem; display:flex; align-items:center; gap:0.5rem; }
h2:first-child{ margin-top:0; }
h2 .ic{ display:inline-grid; place-items:center; width:30px; height:30px; border-radius:10px;
  background:var(--sun); font-size:1rem; animation:wig 5s ease-in-out infinite; }
@keyframes wig{ 0%,92%,100%{ transform:rotate(0); } 95%{ transform:rotate(-12deg); } 98%{ transform:rotate(12deg); } }
h3{ font-size:1rem; font-weight:800; margin:0 0 0.3rem; }
p{ margin:0 0 0.7rem; }
.muted{ color:var(--ink-soft); }
.small{ font-size:0.9rem; }
.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; }

.goal{ border-left:5px solid var(--terra); background:rgba(209,73,91,.08);
  border-radius:0 16px 16px 0; padding:0.75rem 0.95rem; margin-bottom:1rem; }
.goal .mins{ display:inline-block; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:0.05rem 0.6rem; font-weight:800; font-size:0.82rem; margin-left:0.3rem; }
.hero{ display:flex; gap:1.2rem; align-items:center; flex-wrap:wrap; }
.hero .t{ flex:1 1 300px; min-width:0; }
.hero .art{ flex:0 0 250px; max-width:250px; }

.btn{ position:relative; overflow:hidden; font:inherit; font-weight:800; cursor:pointer;
  border:1px solid transparent; border-radius:999px; padding:0.5rem 1.1rem; min-height:42px;
  background:var(--sun); color:var(--ink); box-shadow:0 8px 18px rgba(242,165,65,.3);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1), box-shadow .18s, filter .18s; }
.btn:hover{ transform:translateY(-2px) scale(1.03); }
.btn:active{ transform:translateY(0) scale(.97); }
.btn.ghost{ background:rgba(255,255,255,.7); border-color:var(--line); box-shadow:none; }
.btn.sea{ background:var(--sea); color:#fff; box-shadow:0 8px 18px rgba(14,107,168,.3); }
.btn.terra{ background:var(--terra); color:#fff; box-shadow:0 8px 18px rgba(209,73,91,.3); }
.btn[disabled]{ opacity:.4; cursor:not-allowed; transform:none; }
.row{ display:flex; gap:0.55rem; flex-wrap:wrap; align-items:center; }
kbd{ font-family:'JetBrains Mono',monospace; font-size:.78rem; font-weight:700;
  border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:.05rem .35rem;
  background:#fff; }

.rule{ background:rgba(14,107,168,.08); border:1px solid rgba(14,107,168,.18);
  border-radius:16px; padding:0.85rem 0.95rem; }
.rule .mono{ font-size:1.05rem; font-weight:700; }
.rule.mint{ background:rgba(6,167,125,.09); border-color:rgba(6,167,125,.22); }
.rule.violet{ background:rgba(107,79,168,.09); border-color:rgba(107,79,168,.22); }

/* ── примерът: стъпките се плъзгат ───────────────────────────── */
.steps{ list-style:none; margin:0.6rem 0 0; padding:0; }
/* Скритата стъпка не заема и празно място: padding и рамка идват чак
   с .on, иначе под израза зее дупка колкото стъпките. */
.steps li{ display:flex; gap:0.6rem; align-items:flex-start; padding:0;
  border-top:0 dashed var(--line); font-family:'JetBrains Mono',monospace; font-size:1rem;
  opacity:0; transform:translateX(-14px); max-height:0; overflow:hidden;
  transition:opacity .35s, transform .35s cubic-bezier(.3,1.3,.4,1), max-height .35s, padding .35s; }
.steps li.on{ opacity:1; transform:none; max-height:160px; padding:0.45rem 0; border-top-width:1px; }
.steps li:first-child{ border-top:0; }
.steps .n{ width:25px; height:25px; flex:none; border-radius:8px; background:var(--sun);
  display:grid; place-items:center; font-size:0.78rem; font-weight:700; font-family:'Nunito',sans-serif; }
.steps li.fin{ font-weight:700; color:var(--ok); }
.steps li.fin .n{ background:var(--ok); color:#fff; }

/* ── задачите: карти, които се обръщат ───────────────────────── */
.tasks{ display:grid; gap:0.7rem; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); }
.task{ perspective:900px; min-height:150px; }
.task .inner{ position:relative; width:100%; height:100%; min-height:150px;
  transform-style:preserve-3d; transition:transform .6s cubic-bezier(.3,1.1,.4,1); }
.task.flip .inner{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
  border:1px solid var(--line); background:#fff; padding:0.75rem 0.85rem;
  display:flex; flex-direction:column; }
.face.back{ transform:rotateY(180deg); background:var(--ok-soft); border-color:#BFE0CE; }
.task .top{ display:flex; align-items:center; gap:0.5rem; margin-bottom:0.25rem; }
.task .n{ font-size:0.72rem; font-weight:800; color:var(--ink-soft); letter-spacing:.05em; text-transform:uppercase; }
.lvl{ font-size:0.68rem; font-weight:800; border-radius:999px; padding:0.1rem 0.5rem; }
.lvl.l2{ background:#FFF2DC; color:#8A5505; }
.lvl.l3{ background:#FBE9E7; color:#C0392B; }
.lvl.l4{ background:#EDE6FB; color:#6B4FA8; }
.lvl.l5{ background:#141B2E; color:#FFD48A; }
.task .q{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.05rem;
  margin:0.15rem 0 0.4rem; white-space:pre-line; flex:1 1 auto; }
.task .a{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.2rem; color:var(--ok); }
.task .why{ font-size:0.86rem; font-weight:600; color:var(--ink-soft); white-space:pre-line;
  margin-top:0.25rem; flex:1 1 auto; overflow:auto; }
.task .flipbtn{ align-self:flex-start; margin-top:auto; font:inherit; font-weight:800; font-size:.85rem;
  cursor:pointer; border:1px solid var(--line); background:rgba(255,255,255,.8);
  border-radius:999px; padding:.25rem .8rem; }

/* ── игрите ───────────────────────────────────────────────────── */
.game{ border:1px solid rgba(255,255,255,.8); border-radius:20px; padding:1rem;
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,244,230,.85)); }
.fb{ font-weight:800; min-height:1.6rem; margin-top:0.5rem; }
.fb.ok{ color:var(--ok); } .fb.bad{ color:var(--bad); }

/* машината за знаци */
.signs{ display:flex; gap:0.45rem; flex-wrap:wrap; justify-content:center; margin:0.7rem 0; min-height:64px; }
.sgn{ width:54px; height:54px; border-radius:16px; display:grid; place-items:center;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.25rem;
  border:2px solid var(--line); background:#fff; box-shadow:0 6px 14px rgba(20,27,46,.08);
  will-change:transform; }
.sgn.neg{ border-color:var(--terra); color:var(--terra); background:#FBE4E7; }
.sgn.op{ border:0; background:none; box-shadow:none; width:18px; }

/* надбягването */
.race{ border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,.7); }
.race canvas{ display:block; width:100%; height:auto; }
.ringwrap{ position:relative; width:150px; height:150px; margin:0 auto; }
.ring{ display:block; transform:rotate(-90deg); }
.ring .bgc{ fill:none; stroke:rgba(20,27,46,.10); stroke-width:10; }
.ring .fgc{ fill:none; stroke:var(--mint); stroke-width:10; stroke-linecap:round; }
.ring .fgc.warn{ stroke:var(--terra); }
.ringwrap .t{ position:absolute; inset:0; display:grid; place-items:center;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:2rem; }
.ringwrap.pulse .t{ animation:pulse .6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); color:var(--terra); } }
/* Надписът „3 поред!“ лети нагоре над бутоните — без pointer-events:none
   застава върху тях и следващото щракване не стига до бутона. */
.combo{ position:absolute; left:50%; top:-8px; transform:translateX(-50%); pointer-events:none;
  font-family:'Fredoka',sans-serif; font-weight:700; color:var(--terra); opacity:0; z-index:2; }
.combo.go{ animation:comboUp .9s ease-out forwards; }
@keyframes comboUp{ 0%{ opacity:0; transform:translate(-50%,10px) scale(.6); }
  25%{ opacity:1; transform:translate(-50%,-14px) scale(1.15); }
  100%{ opacity:0; transform:translate(-50%,-44px) scale(1); } }

/* метрото */
.metro svg{ display:block; width:100%; height:auto; }
.st{ transition:r .35s cubic-bezier(.3,1.8,.5,1), fill .35s; }
.stlab{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; fill:var(--ink);
  opacity:0; transition:opacity .4s; }
.stlab.on{ opacity:1; }
.gate{ margin-top:0.9rem; border:2px dashed var(--line); border-radius:18px; padding:0.9rem;
  text-align:center; font-family:'Fredoka',sans-serif; font-weight:700; position:relative; overflow:hidden; }
.gate.open{ border-style:solid; border-color:var(--mint); background:rgba(6,167,125,.1); color:var(--ok); }
.doors{ position:absolute; inset:0; display:flex; pointer-events:none; }
.doors i{ flex:1; background:linear-gradient(180deg,#DCE6F0,#B9CBDD); transition:transform .9s cubic-bezier(.4,0,.2,1); }
.doors i:first-child{ border-right:2px solid #9fb3c8; }
.gate.open .doors i:first-child{ transform:translateX(-101%); }
.gate.open .doors i:last-child{ transform:translateX(101%); }
.code{ font-family:'JetBrains Mono',monospace; font-size:2rem; font-weight:700; }

/* мозайката */
.mos{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; max-width:430px; margin:0.7rem auto; }
.tile{ perspective:700px; background:none; border:0; padding:0; cursor:pointer; aspect-ratio:1/1; }
.tile .in{ position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .65s cubic-bezier(.3,1.3,.4,1); }
.tile.open .in{ transform:rotateY(180deg); }
.tile .f{ position:absolute; inset:0; backface-visibility:hidden; border-radius:14px;
  display:grid; place-items:center; font-family:'JetBrains Mono',monospace; font-weight:700;
  font-size:.86rem; padding:3px; text-align:center; border:2px solid var(--line); background:#fff; }
.tile .f.b{ transform:rotateY(180deg); font-size:1rem; color:#fff; }
.tile.neg .f.b{ background:var(--sea); border-color:#0A5684; }
.tile.pos .f.b{ background:var(--sun); border-color:#D08A1E; color:var(--ink); }
.mosfig{ position:absolute; inset:0; pointer-events:none; }
.mosfig path{ fill:none; stroke:var(--terra); stroke-width:4; stroke-linejoin:round;
  stroke-dasharray:1200; stroke-dashoffset:1200; }
.mosfig.draw path{ animation:draw 1.6s ease forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* творческите карти */
.makes{ display:grid; gap:0.7rem; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
.make{ border:1px dashed var(--terra); border-radius:16px; padding:0.8rem 0.9rem;
  background:rgba(209,73,91,.07); transition:transform .25s, box-shadow .25s; }
.make:hover{ transform:translateY(-3px) rotate(-.6deg); box-shadow:var(--shadow); }
.make b{ display:block; margin-bottom:0.2rem; }

.notes{ background:rgba(242,165,65,.12); border:1px solid rgba(242,165,65,.3);
  border-radius:16px; padding:0.85rem 0.95rem; }
.notes ul{ margin:0.3rem 0 0; padding-left:1.1rem; }
.notes li{ margin-bottom:0.35rem; }
.page-legal{ text-align:center; color:var(--ink-soft); font-size:0.8rem; margin:2rem 0 1rem; }

/* който не иска движение, не го получава */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; transition-duration:.001s !important; }
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="bar">
  <svg class="logo" viewBox="0 0 52 44" aria-hidden="true">
    <g fill="none" stroke="#D1495B" stroke-width="2.6" stroke-linejoin="round">
      <path class="t1" d="M6 40 V22 l5-10 5 10 V40" fill="#FBE4E7"/>
      <path class="t2" d="M20 40 V14 l6-12 6 12 V40" fill="#FFF2DC"/>
      <path class="t3" d="M36 40 V22 l5-10 5 10 V40" fill="#FBE4E7"/>
    </g>
    <rect x="2" y="39" width="48" height="3" rx="1.5" fill="#0E6BA8"/>
  </svg>
  <b>Барселона <em>· двубой</em></b>
  <small>6. клас · умножение и деление на рационални числа</small>
  <span class="sp"></span>
  <span class="scorebox"><i class="p1" id="mini1">0</i><span>:</span><i class="p2" id="mini2">0</i></span>
  <small class="mono" id="barTab"></small>
  <span class="prog"><i id="progBar"></i></span>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="panels"></main>
  <p class="page-legal">© 2026 The Light Academy</p>
</div>

<script>
var STAGES = [
{
  id:'zagriavka',
  dot:'0',
  mins:8,
  tab:{ b:'Загрявка', s:'знаците и обратното число' },
  goal:'Три правила, с които се решава всичко останало: знакът при умножение и деление, '
      +'обратното число и какво прави нулата. Бързо, на дъската, без писане.',

        var a = rnd(0, Math.PI * 2), s = rnd(opt.min || 90, opt.max || 420);
        parts.push({
          x:x, y:y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - (opt.up || 120),
          g:opt.g || 900, r:rnd(3, 7), rot:rnd(0, 6), vr:rnd(-7, 7),
          life:rnd(.7, 1.5), max:1.5, sq:opt.sq !== false,
          c:opt.c || PAL[(Math.random() * PAL.length) | 0]
        });
      }
    }
    function at(node, n, opt){
      var r = node.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, n, opt);
    }
    function rain(n){
      if(CALM) return;
      for(var i = 0; i < n; i++){
        parts.push({
          x:rnd(0, innerWidth), y:rnd(-200, -10), vx:rnd(-40, 40), vy:rnd(120, 300),
          g:160, r:rnd(3, 8), rot:rnd(0, 6), vr:rnd(-6, 6), life:rnd(2.2, 4), max:4, sq:true,
          c:PAL[(Math.random() * PAL.length) | 0]
        });
      }
    }
    return { burst:burst, at:at, rain:rain, count:function(){ return parts.length; } };
  })();

  /* =================================================================
     3. ФОНЪТ — небе, слънце, силует на града, летящи знаци
     ================================================================= */
  (function background(){
    var cv = document.getElementById('bg'), ctx = cv.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0;
    function size(){
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    addEventListener('resize', size);

    /* три слоя силует: далечен, среден, близък */
    function layer(seed, n){
      var a = [], x = 0, i;
      for(i = 0; i < n; i++){
        var w = 30 + ((seed * (i + 3) * 37) % 60);
        var h = 40 + ((seed * (i + 7) * 53) % 150);
        a.push({ x:x, w:w, h:h, spire:((seed + i) % 3 === 0) });
        x += w + 8 + ((seed * i * 13) % 20);
      }
      return { items:a, width:x };
    }
    var L = [layer(3, 26), layer(7, 22), layer(11, 18)];
    var SYM = ['−', '·', ':', '½', '¾', '+', '−', '·'];
    var floats = [];
    for(var i = 0; i < 16; i++){
      floats.push({ x:Math.random(), y:Math.random(), s:rnd(14, 34), v:rnd(.01, .035),
        r:rnd(0, 6), vr:rnd(-.3, .3), t:SYM[(Math.random() * SYM.length) | 0] });
    }
    /* небето се сменя с етапа: сутрин → обед → следобед → залез */
    var SKY = [
      [[255,251,244], [255,236,210]],
      [[240,249,255], [255,243,222]],
      [[232,246,255], [255,236,214]],
      [[255,238,214], [255,214,186]]
    ];
    var sky = { from:SKY[0][0].slice(), to:SKY[0][1].slice() };
    window.__setSky = function(i){
      var a = SKY[i % SKY.length];
      [0, 1, 2].forEach(function(k){
        tween(sky.from[k], a[0][k], 900, function(v){ sky.from[k] = v; });
        tween(sky.to[k], a[1][k], 900, function(v){ sky.to[k] = v; });
      });
    };
    var scroll = 0;
    addEventListener('scroll', function(){ scroll = scrollY; }, { passive:true });

    LOOP.add(function(dt, t){
      ctx.clearRect(0, 0, W, H);
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, 'rgb(' + sky.from.map(Math.round).join(',') + ')');
      g.addColorStop(1, 'rgb(' + sky.to.map(Math.round).join(',') + ')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      /* слънцето пулсира бавно */
      var sx = W * .84, sy = H * .18 - scroll * .03, R = 54 + Math.sin(t * .8) * 4;
      var sg = ctx.createRadialGradient(sx, sy, 8, sx, sy, R * 3);
      sg.addColorStop(0, 'rgba(255,206,120,.55)');
      sg.addColorStop(1, 'rgba(255,206,120,0)');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, R * 3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,196,92,.75)';
      ctx.beginPath(); ctx.arc(sx, sy, R * .55, 0, 7); ctx.fill();

      /* летящите знаци */
      ctx.font = '600 20px JetBrains Mono, monospace';
      floats.forEach(function(f){
        f.y -= f.v * dt * 6;
        if(f.y < -.1){ f.y = 1.1; f.x = Math.random(); }
        f.r += f.vr * dt;
        ctx.save();
        ctx.translate(f.x * W, f.y * H);
        ctx.rotate(f.r);
        ctx.globalAlpha = .18;
        ctx.fillStyle = '#0E6BA8';
        ctx.font = '700 ' + f.s + 'px JetBrains Mono, monospace';
        ctx.fillText(f.t, 0, 0);
        ctx.restore();
      });

      /* силуетът — три слоя с различна скорост (паралакс) */
      var cols = ['rgba(14,107,168,.08)', 'rgba(209,73,91,.10)', 'rgba(20,27,46,.13)'];
      L.forEach(function(lay, k){
        var speed = 6 + k * 10, off = -((t * speed) % lay.width);
        var base = H - 10 + scroll * (.04 + k * .03);
        ctx.fillStyle = cols[k];
        for(var rep = 0; rep < 3; rep++){
          lay.items.forEach(function(b){
            var x = off + b.x + rep * lay.width;
            if(x > W + 80 || x < -120) return;
            var h = b.h * (1 + k * .25);
            ctx.beginPath();
            ctx.rect(x, base - h, b.w, h);
            ctx.fill();
            if(b.spire){
              ctx.beginPath();
              ctx.moveTo(x, base - h);
              ctx.lineTo(x + b.w / 2, base - h - b.w * .9);
              ctx.lineTo(x + b.w, base - h);
              ctx.closePath(); ctx.fill();
            }
          });
        }
      });
    });
  })();

  /* =================================================================
     4. ДРЕБНИТЕ ДВИЖЕНИЯ: брояч, вълничка, карти на вълна
     ================================================================= */
  function countTo(node, to, ms){
    var from = Number(String(node.textContent).replace('−', '-')) || 0;
    tween(from, to, ms || 420, function(v){ node.textContent = Math.round(v); });
  }
  function ripple(e, host){
    if(CALM) return;
    var r = host.getBoundingClientRect();
    var s = el('span', 'ripple');
    s.style.left = (e.clientX - r.left) + 'px';
    s.style.top = (e.clientY - r.top) + 'px';
    s.style.width = s.style.height = Math.max(r.width, r.height) + 'px';
    host.appendChild(s);
    setTimeout(function(){ s.remove(); }, 620);
  }
  function waveIn(root){
    var cards = root.querySelectorAll('.card');
    for(var i = 0; i < cards.length; i++){
      cards[i].classList.remove('in');
      cards[i].style.animationDelay = (i * 70) + 'ms';

      }

    });
    bOff.addEventListener('click', function(){
      for(var i = 0; i < items.length; i++) items[i].classList.remove('on');

  /* =================================================================
     6. ИГРА: машината за знаци — минусите се сблъскват по двойки
     ================================================================= */
  function signsGame(){
    var SETS = [
      [-2, -5, 3, -1],
      [-0.5, -4, -2, 3],
      [-1, -1, -1, -1, -1],
      [2, -3, -0.5, -4],
      [-1.5, -2, -2, -1]
    ];
    var g = el('div', 'game');
    g.innerHTML =
      '<h3>Машината за знаци</h3>'
      + '<p class="small muted">И двамата казват знака ПРЕДИ да натиснете. Минусите се засичат по '
      + 'двойки — всяка двойка се удря и изчезва, защото дава плюс.</p>'
      + '<div class="signs" data-row></div>'
      + '<div class="row"><button class="btn terra" data-go>Съкрати минусите</button>'
      + '<button class="btn ghost" data-next>Друг израз</button></div>'
      + '<p class="fb" data-fb></p>';
    var row = g.querySelector('[data-row]'), fb = g.querySelector('[data-fb]');
    var i = -1, cur = [], busy = false;

    function draw(){
      row.innerHTML = '';
      cur.forEach(function(v, k){
        var c = el('div', 'sgn' + (v < 0 ? ' neg' : ''), num(v));
        c.dataset.k = k;
        row.appendChild(c);
        if(k < cur.length - 1) row.appendChild(el('div', 'sgn op mono', '·'));
      });
      fb.className = 'fb'; fb.textContent = '';
      busy = false;
    }
    function next(){ i = (i + 1) % SETS.length; cur = SETS[i]; draw(); }

    function collide(a, b, after){
      var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      var mx = (ra.left + rb.left) / 2, my = (ra.top + rb.top) / 2;
      var da = mx - ra.left, db = mx - rb.left;
      tween(0, 1, 420, function(k){
        a.style.transform = 'translateX(' + (da * k) + 'px) scale(' + (1 - .35 * k) + ') rotate(' + (k * 180) + 'deg)';
        b.style.transform = 'translateX(' + (db * k) + 'px) scale(' + (1 - .35 * k) + ') rotate(' + (-k * 180) + 'deg)';
      }, function(){
        FX.burst(mx + ra.width / 2, my + ra.height / 2, 18, { c:'#D1495B', up:60, min:60, max:260 });
        a.style.opacity = b.style.opacity = '0';
        if(after) after();
      }, EASE.inOut);
    }

    g.querySelector('[data-go]').addEventListener('click', function(){
      if(busy) return;
      busy = true;
      var negs = [], prod = 1, k;
      for(k = 0; k < cur.length; k++){ prod *= cur[k]; if(cur[k] < 0) negs.push(k); }
      var pairs = Math.floor(negs.length / 2), done = 0;
      (function step(){
        if(done >= pairs){
          fb.className = 'fb ' + (prod < 0 ? 'bad' : 'ok');
          fb.textContent = negs.length + ' минуса → ' + (negs.length % 2
            ? 'нечетен брой, остава МИНУС' : 'четен брой, всички се съкращават')
            + '. Резултат: ' + num(prod) + '.';
          var left = row.querySelector('.sgn:not(.op)');
          if(prod >= 0 && left) FX.at(fb, 26, { up:200 });
          return;
        }
        var a = row.querySelector('[data-k="' + negs[done * 2] + '"]');
        var b = row.querySelector('[data-k="' + negs[done * 2 + 1] + '"]');
        done++;
        if(a && b) collide(a, b, step); else step();
      })();
    });
    g.querySelector('[data-next]').addEventListener('click', next);
    next();
    return g;
  }

  /* =================================================================
     7. ИГРА: надбягването по Ла Рамбла (canvas)
     ================================================================= */
  var SCORE = [0, 0], scoreHooks = [];
  function paintMini(who){
    [0, 1].forEach(function(k){
      var n = document.getElementById('mini' + (k + 1));
      countTo(n, SCORE[k], 350);
      if(who === k){
        n.classList.add('pop');
        setTimeout(function(){ n.classList.remove('pop'); }, 260);
      }
    });
    scoreHooks.forEach(function(f){ f(who); });
  }

  function raceGame(){
    var TARGET = 10;
    var g = el('div', 'game');
    g.innerHTML =
      '<h3>Надбягването по Ла Рамбла</h3>'
      + '<p class="small muted">Всяка точка мести бегача напред. Пръв до Саграда Фамилия печели. '
      + 'С клавишите е по-бързо: <kbd>1</kbd> точка за първия, <kbd>2</kbd> за втория, '
      + '<kbd>интервал</kbd> пуска и спира хронометъра, <kbd>0</kbd> нулира.</p>'
      + '<div class="race"><canvas data-cv width="900" height="230"></canvas></div>'
      + '<div class="row" style="justify-content:center;margin-top:.7rem">'
      + '  <button class="btn sea" data-add="0">+1 за Играч 1</button>'
      + '  <button class="btn ghost" data-sub="0">−1</button>'
      + '  <button class="btn terra" data-add="1">+1 за Играч 2</button>'
      + '  <button class="btn ghost" data-sub="1">−1</button>'
      + '  <button class="btn ghost" data-zero>Нулирай</button></div>'
      + '<div class="ringwrap" style="margin-top:.8rem"><span class="combo" data-combo></span>'
      + '  <svg class="ring" width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">'
      + '    <circle class="bgc" cx="75" cy="75" r="64"></circle>'
      + '    <circle class="fgc" cx="75" cy="75" r="64" data-arc></circle></svg>'
      + '  <span class="t" data-t>45</span></div>'
      + '<div class="row" style="justify-content:center">'
      + '  <button class="btn" data-start>Старт</button>'
      + '  <button class="btn ghost" data-secs="30">30 с</button>'
      + '  <button class="btn ghost" data-secs="45">45 с</button>'
      + '  <button class="btn ghost" data-secs="60">60 с</button></div>'
      + '<p class="fb" data-fb></p>';

    var cv = g.querySelector('[data-cv]'), ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    var fb = g.querySelector('[data-fb]');
    var pos = [0, 0], vis = [0, 0], dust = [], won = -1;

    function moveTo(k){
      pos[k] = clamp(SCORE[k] / TARGET, 0, 1);
      tween(vis[k], pos[k], 650, function(v){
        if(v > vis[k]) for(var d = 0; d < 2; d++) dust.push({ x:40 + vis[k] * (W - 150), y:k ? 185 : 105, vx:rnd(-40, -10), vy:rnd(-20, 10), life:rnd(.3, .7) });
        vis[k] = v;
      }, function(){
        if(SCORE[k] >= TARGET && won < 0){
          won = k;
          fb.className = 'fb ok';
          fb.textContent = 'Играч ' + (k + 1) + ' стига пръв до Саграда Фамилия!';
          FX.rain(120);
        }
      }, EASE.inOut);
    }
    scoreHooks.push(function(who){ if(who != null) moveTo(who); else { moveTo(0); moveTo(1); } });

    function runner(x, y, col, t, moving, lead){
      var ph = t * (moving ? 13 : 3);
      ctx.save();
      ctx.translate(x, y + (moving ? Math.abs(Math.sin(ph)) * -4 : Math.sin(ph) * 1.5));
      if(lead){
        ctx.beginPath(); ctx.arc(0, -16, 26, 0, 7);
        ctx.fillStyle = 'rgba(255,206,120,.35)'; ctx.fill();
      }
      ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
      /* крака */
      ctx.beginPath();
      ctx.moveTo(0, -8); ctx.lineTo(Math.sin(ph) * 9, 8);
      ctx.moveTo(0, -8); ctx.lineTo(-Math.sin(ph) * 9, 8);
      ctx.stroke();
      /* тяло и ръце */
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.lineTo(0, -8);
      ctx.moveTo(0, -22); ctx.lineTo(-Math.sin(ph) * 10, -12);
      ctx.moveTo(0, -22); ctx.lineTo(Math.sin(ph) * 10, -14);
      ctx.stroke();
      /* глава */
      ctx.beginPath(); ctx.arc(0, -33, 7, 0, 7);
      ctx.fillStyle = col; ctx.fill();
      ctx.restore();
    }

    function sagrada(x, y, t){
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#E8D7BE'; ctx.strokeStyle = '#C9A96A'; ctx.lineWidth = 2;
      [[-26, 46], [0, 70], [26, 46]].forEach(function(p, i){
        var h = p[1] + Math.sin(t * 1.4 + i) * 2;
        ctx.beginPath();
        ctx.moveTo(p[0] - 9, 0); ctx.lineTo(p[0] - 9, -h + 14);
        ctx.lineTo(p[0], -h); ctx.lineTo(p[0] + 9, -h + 14); ctx.lineTo(p[0] + 9, 0);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      });
      ctx.restore();
    }

    LOOP.add(function(dt, t){
      if(!g.isConnected) return false;
      ctx.clearRect(0, 0, W, H);
      /* платното на Ла Рамбла */
      ctx.fillStyle = '#F6EEE0'; ctx.fillRect(0, 60, W, H - 60);
      ctx.fillStyle = 'rgba(20,27,46,.05)';
      for(var i = 0; i < 40; i++){
        var off = ((t * 24) % 46);
        ctx.fillRect(((i * 46 - off) % (W + 46)) - 46, 64, 22, H - 70);
      }
      /* ленти */
      [[70, '#E1EEF7'], [150, '#FBE4E7']].forEach(function(l){
        ctx.fillStyle = l[1]; ctx.fillRect(0, l[0], W - 110, 62);
      });
      /* финал */
      ctx.save();
      for(var r = 0; r < 12; r++) for(var c = 0; c < 2; c++){
        ctx.fillStyle = ((r + c) % 2) ? '#141B2E' : '#fff';
        ctx.fillRect(W - 112 + c * 10, 66 + r * 13, 10, 13);
      }
      ctx.restore();
      sagrada(W - 55, 212, t);

      /* праха изпод маратонките */
      for(var d = dust.length - 1; d >= 0; d--){
        var p = dust[d];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if(p.life <= 0){ dust.splice(d, 1); continue; }
        ctx.globalAlpha = clamp(p.life * 1.6, 0, .5);
        ctx.fillStyle = '#BBA98C';
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.4, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }

      var lead = vis[0] === vis[1] ? -1 : (vis[0] > vis[1] ? 0 : 1);
      runner(40 + vis[0] * (W - 150), 105, '#0E6BA8', t, Math.abs(pos[0] - vis[0]) > .001, lead === 0);
      runner(40 + vis[1] * (W - 150), 185, '#D1495B', t, Math.abs(pos[1] - vis[1]) > .001, lead === 1);

      /* табелките с точките */
      ctx.font = '700 20px Fredoka, sans-serif';
      ctx.fillStyle = '#0E6BA8'; ctx.fillText('Играч 1 · ' + SCORE[0], 14, 40);
      ctx.fillStyle = '#D1495B'; ctx.fillText('Играч 2 · ' + SCORE[1], 230, 40);
      ctx.font = '600 13px Nunito, sans-serif'; ctx.fillStyle = '#5A6E88';
      ctx.fillText('до ' + TARGET + ' точки', 450, 40);
    });

    /* ── точките ── */
    function add(k, n){
      var before = SCORE[k];
      SCORE[k] = clamp(SCORE[k] + n, 0, 99);
      if(SCORE[k] !== before){
        if(n > 0){
          combo(k);
          FX.at(g.querySelector('[data-add="' + k + '"]'), 14, { up:180 });
        }
        paintMini(k);
      }
    }
    var lastHit = 0, streak = 0;
    function combo(k){
      var now = performance.now();
      streak = (now - lastHit < 9000) ? streak + 1 : 1;
      lastHit = now;
      if(streak >= 2){
        var c = g.querySelector('[data-combo]');
        c.textContent = streak + ' поред!';
        c.classList.remove('go'); void c.offsetWidth; c.classList.add('go');
      }
    }
    g.addEventListener('click', function(e){
      var a = e.target.closest('[data-add]'), s = e.target.closest('[data-sub]');
      if(a){ ripple(e, a); add(Number(a.dataset.add), 1); }
      if(s){ add(Number(s.dataset.sub), -1); }
    });
    g.querySelector('[data-zero]').addEventListener('click', function(){
      SCORE[0] = SCORE[1] = 0; won = -1; streak = 0;
      fb.className = 'fb'; fb.textContent = '';
      paintMini(null);
    });

    /* ── хронометърът ── */
    var arc = g.querySelector('[data-arc]'), tEl = g.querySelector('[data-t]');
    var wrap = g.querySelector('.ringwrap');
    var C = 2 * Math.PI * 64;
    arc.style.strokeDasharray = C;
    var secs = 45, left = 45, ticking = false, acc = 0;
    function show(){
      tEl.textContent = Math.ceil(left);
      arc.style.strokeDashoffset = C * (1 - left / secs);
      arc.classList.toggle('warn', left <= 10);
      wrap.classList.toggle('pulse', ticking && left <= 10);
    }
    LOOP.add(function(dt){
      if(!g.isConnected) return false;
      if(!ticking) return;
      left -= dt;
      if(left <= 0){
        left = 0; ticking = false;
        g.querySelector('[data-start]').textContent = 'Старт';
        fb.className = 'fb bad';
        fb.textContent = 'Времето свърши. Верен отговор сега носи половин точка.';
        FX.at(wrap, 24, { c:'#D1495B', up:150 });
      }
      show();
    });
    function toggle(){
      if(left <= 0) left = secs;
      ticking = !ticking;
      g.querySelector('[data-start]').textContent = ticking ? 'Стоп' : 'Старт';
      if(ticking){ fb.className = 'fb'; fb.textContent = ''; }
      show();
    }
    g.querySelector('[data-start]').addEventListener('click', toggle);
    g.addEventListener('click', function(e){
      var b = e.target.closest('[data-secs]');
      if(!b) return;
      ticking = false; secs = Number(b.dataset.secs); left = secs;
      g.querySelector('[data-start]').textContent = 'Старт';
      show();
    });
    show();

    /* клавишите — двама души на един лаптоп не се бутат за мишката */
    g.__keys = function(e){
      if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if(e.key === '1'){ add(0, 1); }
      else if(e.key === '2'){ add(1, 1); }
      else if(e.key === '0'){ g.querySelector('[data-zero]').click(); }
      else if(e.code === 'Space'){ e.preventDefault(); toggle(); }
      else return;
    };
    document.addEventListener('keydown', g.__keys);
    return g;
  }

  /* =================================================================
     8. ИГРА: метрото — влакът тръгва чак след решена брънка
     ================================================================= */
  function metroGame(){
    var CH = [
      { who:'Играч 1', col:'#0E6BA8', start:'−7,2',
        steps:[{ op:': 0,9', val:'−8' }, { op:'· (−2,5)', val:'20' }, { op:': (−4)', val:'−5' }], key:-5 },
      { who:'Играч 2', col:'#D1495B', start:'(−3/4)',
        steps:[{ op:'· (−16/9)', val:'4/3' }, { op:': (−2/3)', val:'−2' }, { op:'· (−6)', val:'12' }], key:12 }
    ];
    var X = [60, 230, 400, 570], Y = [56, 150];
    var g = el('div', 'game');
    g.innerHTML =
      '<h3>Метрото: две линии, един код</h3>'
      + '<p class="small muted">Всеки решава своята брънка наум и чак тогава праща влака до '
      + 'следващата станция. Портата се отваря само когато и двата влака са на последната.</p>'
      + '<div class="metro"><svg viewBox="0 0 660 210" aria-label="Две метро линии с по четири станции">'
      + CH.map(function(c, i){
          var y = Y[i];
          var line = '<line x1="' + X[0] + '" y1="' + y + '" x2="' + X[3] + '" y2="' + y
            + '" stroke="' + c.col + '" stroke-width="7" stroke-linecap="round" opacity=".25"/>'
            + '<line data-fill="' + i + '" x1="' + X[0] + '" y1="' + y + '" x2="' + X[0] + '" y2="' + y
            + '" stroke="' + c.col + '" stroke-width="7" stroke-linecap="round"/>';
          var st = X.map(function(x, k){
            return '<circle class="st" data-st="' + i + '-' + k + '" cx="' + x + '" cy="' + y
              + '" r="9" fill="#fff" stroke="' + c.col + '" stroke-width="4"/>'
              + '<text class="stlab' + (k === 0 ? ' on' : '') + '" data-lab="' + i + '-' + k
              + '" x="' + x + '" y="' + (y - 20) + '" text-anchor="middle">'
              + (k === 0 ? esc(c.start) : '?') + '</text>'
              + (k > 0 ? '<text class="stlab on" x="' + ((X[k] + X[k - 1]) / 2) + '" y="' + (y + 26)
                  + '" text-anchor="middle" font-size="12" fill="#5A6E88">' + esc(c.steps[k - 1].op) + '</text>' : '');
          }).join('');
          return '<g>' + line + st
            + '<g data-train="' + i + '" transform="translate(' + X[0] + ',' + y + ')">'
            + '<rect x="-19" y="-13" width="38" height="26" rx="9" fill="' + c.col + '"/>'
            + '<rect x="-12" y="-8" width="10" height="9" rx="2" fill="#fff" opacity=".9"/>'
            + '<rect x="2" y="-8" width="10" height="9" rx="2" fill="#fff" opacity=".9"/>'
            + '<circle cx="-9" cy="13" r="3.5" fill="#141B2E"/><circle cx="9" cy="13" r="3.5" fill="#141B2E"/>'
            + '</g>'
            + '<text x="' + X[0] + '" y="' + (y + 46) + '" font-size="12" font-weight="700" fill="'
            + c.col + '" text-anchor="middle">' + esc(c.who) + '</text></g>';
        }).join('')
      + '</svg></div>'
      + '<div class="row" style="justify-content:center;margin-top:.6rem">'
      + '  <button class="btn sea" data-step="0">Играч 1 → напред</button>'
      + '  <button class="btn ghost" data-back="0">Отначало</button>'
      + '  <button class="btn terra" data-step="1">Играч 2 → напред</button>'
      + '  <button class="btn ghost" data-back="1">Отначало</button></div>'
      + '<div class="gate" data-gate><span data-gtext>Портата чака и двата ключа</span>'
      + '  <div class="doors"><i></i><i></i></div></div>'
      + '<p class="fb" data-fb></p>';

    var at = [0, 0], moving = [false, false];
    var gate = g.querySelector('[data-gate]'), gtext = g.querySelector('[data-gtext]');
    var fb = g.querySelector('[data-fb]');

    function train(i){ return g.querySelector('[data-train="' + i + '"]'); }
    function go(i, to){
      if(moving[i] || to > 3 || to < 0) return;
      moving[i] = true;
      var from = X[at[i]], dest = X[to], y = Y[i];
      var fill = g.querySelector('[data-fill="' + i + '"]');
      tween(from, dest, 900, function(x){
        train(i).setAttribute('transform', 'translate(' + x + ',' + (y + (CALM ? 0 : Math.sin((x - from) / 24) * 2)) + ')');
        fill.setAttribute('x2', x);
      }, function(){
        at[i] = to;
        moving[i] = false;
        var lab = g.querySelector('[data-lab="' + i + '-' + to + '"]');
        var dot = g.querySelector('[data-st="' + i + '-' + to + '"]');
        if(to > 0){
          lab.textContent = CH[i].steps[to - 1].val;
          lab.classList.add('on');
          dot.setAttribute('r', '13');
          dot.setAttribute('fill', CH[i].col);
          setTimeout(function(){ dot.setAttribute('r', '10'); }, 320);
          FX.at(dot, 14, { c:CH[i].col, up:140 });
        }
        check();
      }, EASE.inOut);
    }
    function reset(i){
      at[i] = 0;
      moving[i] = false;
      train(i).setAttribute('transform', 'translate(' + X[0] + ',' + Y[i] + ')');
      g.querySelector('[data-fill="' + i + '"]').setAttribute('x2', X[0]);
      [1, 2, 3].forEach(function(k){
        var lab = g.querySelector('[data-lab="' + i + '-' + k + '"]');
        lab.textContent = '?'; lab.classList.remove('on');
        var dot = g.querySelector('[data-st="' + i + '-' + k + '"]');
        dot.setAttribute('fill', '#fff'); dot.setAttribute('r', '9');
      });
      check();
    }
    function check(){
      var done = at[0] === 3 && at[1] === 3;
      gate.classList.toggle('open', done);
      if(done){
        var code = Math.abs(CH[0].key * CH[1].key);
        gtext.innerHTML = 'Портата се отвори · код <span class="code" data-code>0</span>';
        countTo(g.querySelector('[data-code]'), code, 900);
        fb.className = 'fb ok';
        fb.textContent = 'ключ 1 = ' + num(CH[0].key) + ' · ключ 2 = ' + num(CH[1].key)
          + ' → |' + num(CH[0].key * CH[1].key) + '| = ' + code;
        setTimeout(function(){ FX.at(gate, 60, { up:260 }); }, 500);
      } else {
        gtext.textContent = 'Портата чака и двата ключа';
        fb.className = 'fb'; fb.textContent = '';
      }
    }
    g.addEventListener('click', function(e){
      var s = e.target.closest('[data-step]'), b = e.target.closest('[data-back]');
      if(s){ ripple(e, s); go(Number(s.dataset.step), at[Number(s.dataset.step)] + 1); }
      if(b){ reset(Number(b.dataset.back)); }
    });
    return g;
  }

  /* =================================================================
     9. ИГРА: мозайката на Гауди — плочките се обръщат на вълна
     ================================================================= */
  function mosaicGame(){
    var TILES = [
      { e:'(−3/4) · (2/3)', v:-0.5 },   { e:'(−2,5) · (−0,4)', v:1 },
      { e:'(−1/2)²',        v:0.25 },   { e:'(−6) : 1,5',      v:-4 },
      { e:'(−8) : (−0,5)',  v:16 },     { e:'(−1/3) · 9',      v:-3 },
      { e:'2,5 · (−0,8)',   v:-2 },     { e:'(−4/5) · (−5/4)', v:1 },
      { e:'(−2) · (−3)',    v:6 },      { e:'(−5/6) : (5/3)',  v:-0.5 },
      { e:'(−0,3) · 10',    v:-3 },     { e:'(−9) : (−3)',     v:3 },
      { e:'(−1/4) : (1/2)', v:-0.5 },   { e:'(−1,5)²',         v:2.25 },
      { e:'(−2/7) · (−7/2)', v:1 },     { e:'(−3) · (2/3)',    v:-2 }
    ];
    var g = el('div', 'game');
    g.innerHTML =
      '<h3>Мозайката на Гауди</h3>'
      + '<p class="small muted">Преди да щракнете — казвате знака на глас. Отрицателните стават сини, '
      + 'положителните оранжеви. Като се обърне всичко, оранжевите чертаят фигура.</p>'
      + '<div style="position:relative;max-width:430px;margin:0 auto">'
      + '  <div class="mos" data-mos></div>'
      + '  <svg class="mosfig" data-fig viewBox="0 0 100 100" preserveAspectRatio="none">'
      + '    <path d="M50 4 L96 50 L50 96 L4 50 Z"/></svg>'
      + '</div>'
      + '<div class="row" style="justify-content:center"><button class="btn ghost" data-all>Обърни всички</button>'
      + '<button class="btn ghost" data-reset>Отначало</button></div>'
      + '<p class="fb" data-fb></p>';
    var box = g.querySelector('[data-mos]'), fb = g.querySelector('[data-fb]');
    var fig = g.querySelector('[data-fig]');
    var open = [];

    TILES.forEach(function(t, k){
      var b = el('button', 'tile');
      b.type = 'button';
      b.dataset.k = k;
      b.innerHTML = '<span class="in"><span class="f a">' + esc(t.e) + '</span>'
        + '<span class="f b">' + num(t.v) + '</span></span>';
      box.appendChild(b);
    });
    function flip(k, on){
      var b = box.querySelector('[data-k="' + k + '"]');
      var t = TILES[k];
      b.classList.toggle('open', on);
      b.classList.toggle(t.v < 0 ? 'neg' : 'pos', on);
      if(on && open.indexOf(k) < 0) open.push(k);
      if(!on){ var i = open.indexOf(k); if(i >= 0) open.splice(i, 1); }
    }
    function sync(){
      if(open.length === TILES.length){
        fb.className = 'fb ok';
        fb.textContent = 'Готово: оранжевото чертае ромб, а синьото остава в ъглите и в средата. '
          + 'Синя плочка = нечетен брой минуси, оранжева = четен.';
        fig.classList.add('draw');
        FX.at(box, 70, { up:240 });
      } else {
        fb.className = 'fb';
        fb.textContent = 'Обърнати: ' + open.length + ' от ' + TILES.length;
        fig.classList.remove('draw');
      }
    }
    box.addEventListener('click', function(e){
      var b = e.target.closest('.tile');
      if(!b) return;
      var k = Number(b.dataset.k);
      if(open.indexOf(k) >= 0) return;
      flip(k, true);
      FX.at(b, 12, { c:TILES[k].v < 0 ? '#0E6BA8' : '#F2A541', up:140 });
      sync();
    });
    g.querySelector('[data-all]').addEventListener('click', function(){
      TILES.forEach(function(t, k){
        var r = Math.floor(k / 4), c = k % 4;
        var d = Math.abs(r - 1.5) + Math.abs(c - 1.5);     /* вълна от центъра */
        setTimeout(function(){ flip(k, true); sync(); }, CALM ? 0 : d * 150);
      });
    });
    g.querySelector('[data-reset]').addEventListener('click', function(){
      TILES.forEach(function(_, k){ flip(k, false); });
      open = [];
      sync();
    });
    sync();
    return g;
  }

  var GAMES = { signs:signsGame, duel:raceGame, keys:metroGame, mosaic:mosaicGame };

  /* =================================================================
     10. ЕТАПИТЕ: сглобяване, превключване, напредък
     ================================================================= */
  function heroArt(){
    return '<svg viewBox="0 0 220 180" class="art" aria-hidden="true">'
      + '<defs><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="#FFD48A"/><stop offset="1" stop-color="#D1495B"/></linearGradient></defs>'
      + '<g fill="url(#gt)" stroke="#B83B4C" stroke-width="2">'
      + '<path class="t1" d="M30 170 V86 l16-30 16 30 V170Z"/>'
      + '<path class="t2" d="M78 170 V58 l20-38 20 38 V170Z"/>'
      + '<path class="t3" d="M134 170 V86 l16-30 16 30 V170Z"/></g>'
      + '<g fill="#0E6BA8" opacity=".75">'
      + '<circle cx="46" cy="100" r="4"><animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/></circle>'
      + '<circle cx="98" cy="74" r="4"><animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/></circle>'
      + '<circle cx="150" cy="100" r="4"><animate attributeName="r" values="4;6;4" dur="3.2s" repeatCount="indefinite"/></circle></g>'
      + '<rect x="10" y="170" width="200" height="6" rx="3" fill="#0E6BA8"/></svg>';
  }

  function buildPanel(st, idx){
    var p = el('section', null, '');
    p.id = 'p-' + st.id;
    p.setAttribute('role', 'tabpanel');

    var head = el('div', 'card'), k;
    if(st.hero){
      head.innerHTML = '<div class="hero"><div class="t"><h1>Барселона: <em>двубой</em> '
        + 'с рационални числа</h1><p class="muted">Три етапа за двама: надбягване по Ла Рамбла '
        + 'с хронометър, мисия в метрото с два ключа и творческа мозайка на Гауди. Умножение и '
        + 'деление — дроби, десетични, степени и капани.</p></div>' + heroArt() + '</div>';
    } else {
      head.innerHTML = '<h1>' + esc(st.tab.b) + ' <em>· ' + esc(st.tab.s) + '</em></h1>';
    }
    head.appendChild(el('div', 'goal', '<b>Целта на етапа:</b> ' + esc(st.goal)
      + '<span class="mins">≈ ' + st.mins + ' мин</span>'));
    head.appendChild(el('div', 'rule' + (st.id === 'ekip' ? ' mint' : (st.id === 'barselona' ? ' violet' : '')), st.rule));
    p.appendChild(head);

    var ex = el('div', 'card');
    ex.appendChild(el('h2', null, '<span class="ic">🧭</span> На дъската, стъпка по стъпка'));
    for(k = 0; k < st.examples.length; k++) ex.appendChild(exampleBlock(st.examples[k]));
    p.appendChild(ex);

    var tk = el('div', 'card');
    tk.appendChild(el('h2', null, '<span class="ic">⚡</span> Задачи — от трудни към по-трудни'));
    var bar = el('div', 'row');
    var bAll = el('button', 'btn ghost', 'Обърни всички');
    var bNone = el('button', 'btn ghost', 'Върни ги');
    bar.appendChild(bAll); bar.appendChild(bNone);
    tk.appendChild(bar);
    var list = el('div', 'tasks'), cards = [];
    for(k = 0; k < st.tasks.length; k++){
      var c = taskBlock(st.tasks[k], k);
      cards.push(c); list.appendChild(c);
    }
    tk.appendChild(list);
    bAll.addEventListener('click', function(){
      cards.forEach(function(c, i){ setTimeout(function(){ c.__show(true); }, CALM ? 0 : i * 60); });
    });
    bNone.addEventListener('click', function(){
      cards.forEach(function(c, i){ setTimeout(function(){ c.__show(false); }, CALM ? 0 : i * 40); });
    });
    p.appendChild(tk);

    var gm = el('div', 'card');
    gm.appendChild(el('h2', null, '<span class="ic">🎮</span> Играта на етапа'));
    if(GAMES[st.game]) gm.appendChild(GAMES[st.game]());
    p.appendChild(gm);

    if(st.make){
      var mk = el('div', 'card');
      mk.appendChild(el('h2', null, '<span class="ic">🎨</span> Творческа работилница'));
      mk.appendChild(el('p', 'small muted', 'Тези нямат един верен отговор. Всеки измисля своето, '
        + 'после го защитава пред другия — и другият проверява сметките.'));
      var box = el('div', 'makes');
      st.make.forEach(function(m){
        box.appendChild(el('div', 'make', '<b>' + esc(m.b) + '</b>' + esc(m.t)));
      });
      mk.appendChild(box);
      p.appendChild(mk);
    }

    var nt = el('div', 'card'), li = '';
    for(k = 0; k < st.notes.length; k++) li += '<li>' + esc(st.notes[k]) + '</li>';
    nt.appendChild(el('h2', null, '<span class="ic">📝</span> За учителя'));
    nt.appendChild(el('div', 'notes', '<ul>' + li + '</ul>'));
    p.appendChild(nt);
    return p;
  }

  var tabs = document.getElementById('tabs');
  var panels = document.getElementById('panels');
  var barTab = document.getElementById('barTab');
  var progBar = document.getElementById('progBar');
  var btns = [], secs = [], seen = {}, cur = 0;

  STAGES.forEach(function(st, i){
    var b = el('button', 'tab', '<span class="dot">' + esc(st.dot) + '</span><span><b>' +
      esc(st.tab.b) + '</b><small>' + esc(st.tab.s) + '</small></span>');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    b.setAttribute('aria-controls', 'p-' + st.id);
    b.addEventListener('click', function(e){ ripple(e, b); open(i, true); });
    tabs.appendChild(b);
    btns.push(b);

    var s = buildPanel(st, i);
    s.hidden = (i !== 0);
    panels.appendChild(s);
    secs.push(s);
  });

  /* превключването: старият панел излиза, новият влиза на вълна */
  function open(i, push){
    if(i === cur && seen[i]) return;
    var old = secs[cur];
    var swap = function(){
      for(var k = 0; k < btns.length; k++){
        btns[k].setAttribute('aria-selected', k === i ? 'true' : 'false');
        secs[k].hidden = (k !== i);
      }
      cur = i;
      seen[i] = true;
      barTab.textContent = STAGES[i].tab.b;
      progBar.style.width = (Object.keys(seen).length / STAGES.length * 100) + '%';
      if(window.__setSky) window.__setSky(i);
      waveIn(secs[i]);
      if(push && history.replaceState) history.replaceState(null, '', '#' + STAGES[i].id);
      window.scrollTo({ top:0, behavior:CALM ? 'auto' : 'smooth' });
    };
    if(old && old !== secs[i] && !CALM){
      old.style.transition = 'opacity .18s, transform .18s';
      old.style.opacity = '0';
      old.style.transform = 'translateY(-10px)';
      setTimeout(function(){
        old.style.opacity = ''; old.style.transform = ''; old.style.transition = '';
        swap();
      }, 170);
    } else swap();
  }

  /* стрелките местят етапите — ръцете остават на клавиатурата */
  document.addEventListener('keydown', function(e){
    if(e.target && /INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
    if(e.key === 'ArrowRight') open(Math.min(cur + 1, STAGES.length - 1), true);
    if(e.key === 'ArrowLeft') open(Math.max(cur - 1, 0), true);
  });

  var want = (location.hash || '').replace('#', ''), start = 0;
  for(var i = 0; i < STAGES.length; i++){ if(STAGES[i].id === want) start = i; }
  cur = start;
  seen[start] = true;
  for(var k = 0; k < btns.length; k++){
    btns[k].setAttribute('aria-selected', k === start ? 'true' : 'false');
    secs[k].hidden = (k !== start);
  }
  barTab.textContent = STAGES[start].tab.b;
  progBar.style.width = (1 / STAGES.length * 100) + '%';
  if(window.__setSky) window.__setSky(start);
  waveIn(secs[start]);
  paintMini(null);
})();
</script>
