<!-- =====================================================================
     ИЗХОД ОТ МАТРИЦАТА — 7. клас, умножение на многочлен с многочлен
     ---------------------------------------------------------------------
     Стая за бягство за двама ученици и един преподавател. Пет сектора,
     35 задачи (436–448 от учебника плюс пет за загрявка), а между тях —
     ГЛИТЧ: бърза игра „вярно или грешно“ на два чифта клавиша, в която
     двамата играят като отбор срещу машината.

     Трите начина да се отговори:
       РЕШЕТКА   всяко квадратче е едно произведение, после се привежда;
       ЧИПОВЕ    отговорът се сглобява от членове, а сред тях стоят и
                 членовете ОТПРЕДИ привеждането — най-честата грешка;
       ЧИСЛО     уравненията: въвежда се коренът (пет от тях са дробни).

     Всеки отворен сектор дава фрагмент от кода. Пет фрагмента отварят
     вратата — и вечерята.

     НИЩО ТУК НЕ Е ПРЕСМЕТНАТО НА РЪКА. Условията стоят в
     scripts/urok7/misia.py така, както се четат; отговорите, решетките,
     примамките, обясненията и верността на твърденията в ГЛИТЧ ги смята
     scripts/build_urok7.py със sympy и ги записва по-долу между
     „ДАННИ:НАЧАЛО“ и „ДАННИ:КРАЙ“. Проверява ги scripts/check_urok7.py —
     втори път и по друг път (числено, в случайни точки).

     Страницата не иска вход и нищо не предава към платформата: урокът не
     се оценява. Работи и без интернет — шрифтът е единственото, което
     се тегли отвън. Докъде са стигнали двамата се пази в localStorage.
     ===================================================================== -->
<style>
/* ── основи ───────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --fon:#04070a; --fon2:#070d12;
  --ton:#00ff9c;            /* цветът на текущия сектор — сменя се от JS */
  --tekst:#cfe9df; --blqd:#6e8c82;
  --cherven:#ff4d6d; --zlat:#ffd24a;
  --ram:rgba(0,255,156,.22);
  --sqnka:0 0 24px rgba(0,255,156,.10);
}
html,body{height:100%}
body{
  margin:0; background:var(--fon); color:var(--tekst);
  font:16px/1.5 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  overflow-x:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
#rain{position:fixed;inset:0;z-index:0;display:block}
.crt{position:fixed;inset:0;z-index:1;pointer-events:none;

  mix-blend-mode:multiply}
body.glitch #kljuchove{display:block}
.vinetka{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(0,0,0,.72) 100%)}
.obvivka{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 18px 64px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
[hidden]{display:none !important}

/* ── таблото отгоре ───────────────────────────────────────────────── */
#hud{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  padding:10px 0 10px;margin-bottom:18px;
  background:linear-gradient(to bottom,var(--fon) 72%,transparent);
  border-bottom:1px solid var(--ram)}
.hud-mark{font-weight:800;letter-spacing:.14em;color:var(--ton);text-shadow:var(--sqnka)}
.hud-mark small{display:block;font-weight:400;font-size:10px;letter-spacing:.3em;color:var(--blqd)}
.hud-el{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--blqd)}
.hud-el b{font-size:17px;color:var(--tekst);font-variant-numeric:tabular-nums}
.hud-push{margin-left:auto;display:flex;gap:8px}
.ikona{width:36px;height:32px;border:1px solid var(--ram);border-radius:7px;color:var(--blqd);
  display:grid;place-items:center;font-size:14px;transition:.15s}
.ikona:hover{color:var(--ton);border-color:var(--ton)}
#fragLenta{display:flex;gap:5px}
.frag{width:26px;height:30px;border:1px dashed var(--ram);border-radius:5px;display:grid;place-items:center;
  font-size:13px;color:#24402f}
.frag.ima{border-style:solid;border-color:var(--zlat);color:var(--zlat);
  text-shadow:0 0 10px rgba(255,210,74,.6);animation:popfrag .5s ease}
@keyframes popfrag{from{transform:scale(.4) rotate(-12deg);opacity:0}}

/* ── общи парчета ─────────────────────────────────────────────────── */
.panel{border:1px solid var(--ram);border-radius:12px;background:rgba(4,10,8,.78);
  backdrop-filter:blur(2px);padding:20px;box-shadow:var(--sqnka)}
.etiket{font-size:11px;letter-spacing:.32em;color:var(--ton);text-transform:uppercase}
h1,h2,h3{font-weight:800;letter-spacing:.04em;margin:.2em 0 .4em;line-height:1.15}

h2{font-size:clamp(20px,4vw,30px)}
.but{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border-radius:9px;
  border:1px solid var(--ton);color:var(--ton);font-weight:700;letter-spacing:.08em;
  background:rgba(0,255,156,.06);transition:.15s}
.but:hover{background:var(--ton);color:#04120c;box-shadow:0 0 22px rgba(0,255,156,.35)}
.but.tih{border-color:var(--ram);color:var(--blqd);background:none}
.but.tih:hover{color:var(--tekst);background:rgba(255,255,255,.05);box-shadow:none}
.but[disabled]{opacity:.35;pointer-events:none}
.mig{animation:mig 1s steps(2) infinite}
@keyframes mig{50%{opacity:0}}
.muten{color:var(--blqd)}
.kurs{display:inline-block;width:10px;height:1.05em;background:var(--ton);vertical-align:-2px}

/* ── буквите на математиката ──────────────────────────────────────── */

/* ── вход ─────────────────────────────────────────────────────────── */
#boot .term{min-height:210px;font-size:15px;white-space:pre-wrap}
#boot .term .z{color:var(--ton)}
.imena{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}
.ime-kutiq{flex:1 1 200px;border:1px solid var(--ram);border-radius:10px;padding:12px 14px}
.ime-kutiq label{display:block;font-size:11px;letter-spacing:.2em;color:var(--blqd);margin-bottom:6px}

.klav{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 7px;border-radius:6px;
  border:1px solid var(--ram);border-bottom-width:3px;font-size:13px;font-weight:700;color:var(--tekst)}

/* ── карта на сектора ─────────────────────────────────────────────── */
.sektor-glava{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.sektor-nomer{font-size:clamp(44px,11vw,88px);font-weight:800;line-height:.85;color:var(--ton);
  text-shadow:0 0 30px rgba(0,255,156,.35)}
.spisuk{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));margin-top:18px}
.karta{border:1px solid var(--ram);border-radius:10px;padding:13px 15px;text-align:left;
  display:flex;flex-direction:column;gap:7px;transition:.15s;background:rgba(255,255,255,.015)}
.karta:hover{border-color:var(--ton);transform:translateY(-2px)}
.karta .gl{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.18em;color:var(--blqd)}
.karta .mat{font-size:15px;color:#dff6ec}
.karta.gotova{border-color:rgba(0,255,156,.5);background:rgba(0,255,156,.07)}
.karta.gotova .gl{color:var(--ton)}
.lenta{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin:14px 0 4px}
.lenta i{display:block;height:100%;background:linear-gradient(90deg,var(--ton),var(--zlat));
  width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ── задача ───────────────────────────────────────────────────────── */
.zad-glava{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mreja-obvivka{overflow-x:auto;padding-bottom:6px}
table.mreja{border-collapse:separate;border-spacing:6px;margin:6px auto 2px}
table.mreja th,table.mreja td{padding:0}
table.mreja th{font-size:15px;color:var(--ton);font-weight:700;min-width:70px;height:40px;vertical-align:middle}
table.mreja th.ugul{color:var(--blqd);font-size:12px;letter-spacing:.1em}
.kletka{width:100%;min-width:76px;height:50px;border:1px solid var(--ram);border-radius:8px;
  display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--blqd);
  background:rgba(255,255,255,.02);transition:.15s}
.kletka:hover{border-color:var(--ton);color:var(--ton)}
.kletka.otvorena{border-color:var(--zlat);color:var(--zlat);box-shadow:0 0 0 2px rgba(255,210,74,.18)}
.kletka.puln{border-color:rgba(0,255,156,.55);color:#eafff6;background:rgba(0,255,156,.09);cursor:default}
.kletka.gresh{animation:tres .35s}
@keyframes tres{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.izbor{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 2px}
.izbor .chip{font-size:17px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;
  border:1px solid var(--ram);font-weight:700;font-size:17px;background:rgba(255,255,255,.025);transition:.12s}
.chip:hover{border-color:var(--ton);color:var(--ton);transform:translateY(-2px)}
.chip .nom{font-size:10px;color:var(--blqd);border:1px solid var(--ram);border-radius:4px;padding:0 4px}
.chip.vzet{opacity:.22;pointer-events:none}
.chip.gresh{border-color:var(--cherven);color:var(--cherven);animation:tres .35s}
.redica{min-height:62px;border:1px dashed var(--ram);border-radius:10px;padding:10px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.redica:empty::before{content:"тук се сглобява отговорът";color:#2b4a3c;font-size:13px}
.redica .chip{border-color:var(--ton);color:#eafff6;background:rgba(0,255,156,.08)}
.chislo-red{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.chislo-red input{width:190px;background:rgba(255,255,255,.03);border:1px solid var(--ram);border-radius:9px;
  padding:11px 14px;color:var(--ton);font-size:22px;font-weight:700;outline:none;text-align:center}
.chislo-red input:focus{border-color:var(--ton);box-shadow:0 0 0 3px rgba(0,255,156,.12)}
.zashto{border-left:3px solid var(--ton);padding:10px 0 10px 14px;margin-top:16px;background:rgba(0,255,156,.04)}
.zashto div{font-weight:700;color:#eafff6}
.zashto .nd{font-weight:400;color:var(--blqd);font-size:13px;letter-spacing:.14em;margin-bottom:6px}

/* ── глитч ────────────────────────────────────────────────────────── */
.glitch-stena{display:grid;grid-template-columns:1fr minmax(260px,2fr) 1fr;gap:14px;align-items:stretch}
@media (max-width:860px){.glitch-stena{grid-template-columns:1fr;}}
.igrach{border:1px solid var(--ram);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;
  text-align:center;transition:.15s}
.igrach b{font-size:19px;color:var(--tekst)}
.igrach .toch{font-size:34px;font-weight:800;color:var(--ton);font-variant-numeric:tabular-nums}
.igrach.gori{border-color:var(--ton);box-shadow:0 0 26px rgba(0,255,156,.22)}
.igrach.vun{opacity:.3}
.butoni2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  letter-spacing:.08em}
.butoni2 .da{color:var(--ton)} .butoni2 .ne{color:var(--cherven)}
.butoni2 button:hover{background:rgba(255,255,255,.06)}
.tvurdenie{display:grid;place-items:center;text-align:center;gap:16px;min-height:220px;
  border:1px solid var(--ram);border-radius:12px;padding:20px;background:rgba(4,12,9,.7)}
.tvurdenie .mat{font-size:clamp(20px,4.4vw,34px)}
.chasovnik{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;width:100%}
.chasovnik i{display:block;height:100%;background:var(--ton);width:100%}
.presuda{font-size:clamp(22px,5vw,38px);font-weight:800;letter-spacing:.1em}
.presuda.ok{color:var(--ton)} .presuda.ne{color:var(--cherven)}
.smut{animation:smut .25s steps(2) 2}
@keyframes smut{
  0%{transform:translate(0,0);text-shadow:2px 0 var(--cherven),-2px 0 #22d3ee}
  50%{transform:translate(-3px,1px);text-shadow:-3px 0 var(--cherven),3px 0 #22d3ee}
  100%{transform:translate(0,0);text-shadow:none}}

/* ── изход ────────────────────────────────────────────────────────── */
.vrati{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:18px}
.vrata{border:1px solid var(--ram);border-radius:12px;padding:22px 16px;text-align:center;transition:.15s;

.vrata .mat{font-size:17px}
.vrata.gresh{border-color:var(--cherven);opacity:.45}
.kluch{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}
.kluch input{width:58px;height:74px;text-align:center;font-size:34px;font-weight:800;color:var(--zlat);
  background:rgba(255,210,74,.05);border:1px solid rgba(255,210,74,.35);border-radius:10px;outline:none}
.kluch input:focus{box-shadow:0 0 0 3px rgba(255,210,74,.18)}
.kluch.gresh{animation:tres .4s}
.spisuk-frag{display:grid;gap:8px;margin-top:14px}
.spisuk-frag div{display:flex;gap:12px;align-items:baseline;font-size:14px}

.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:16px 0}
.qdene{border:1px solid rgba(255,210,74,.3);border-radius:11px;padding:14px;text-align:left;transition:.15s}

.qdene.izbrano{border-color:var(--zlat);background:rgba(255,210,74,.13)}

.qdene span{font-size:12px;color:var(--blqd)}
.vaucher{border:1px dashed var(--zlat);border-radius:12px;padding:20px;margin-top:16px}
.vaucher table{width:100%;border-collapse:collapse;font-size:14px}
.vaucher td{padding:5px 0;border-bottom:1px dotted rgba(255,210,74,.2)}
.vaucher td:last-child{text-align:right;color:var(--zlat);font-weight:700}

/* ── дребно ───────────────────────────────────────────────────────── */
#kljuchove{display:none;position:fixed;left:0;right:0;bottom:0;z-index:4;text-align:center;font-size:11px;
  color:#2f5345;letter-spacing:.14em;padding:6px;background:linear-gradient(to top,var(--fon),transparent);
  pointer-events:none}
@media (max-width:700px){
  #hud{gap:8px 12px} .hud-el b{font-size:15px} .obvivka{padding:0 12px 70px}

}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  #rain{opacity:.25}
}

<div class="obvivka">

<div id="kljuchove">ИГРАЧ 1 · A = ВЯРНО · Z = ГРЕШНО &nbsp;&nbsp;|&nbsp;&nbsp; ИГРАЧ 2 · K = ВЯРНО · M = ГРЕШНО &nbsp;&nbsp;|&nbsp;&nbsp; ИНТЕРВАЛ = СЪВЕТ</div>

<script>
/* ДАННИ:НАЧАЛО — пише ги scripts/build_urok7.py; задачите са в scripts/urok7/misia.py */
const MISIA = {
 "sektori": [
  {
   "kod": "01",

    {

  /* Еднакво разбъркване при еднакво семе — за да не скача подредбата

  const a = masiv.slice();

}

  const m = hex.replace('#','');

const zvOk    = () => { ton(680,.07,'triangle',.05); setTimeout(()=>ton(1020,.12,'triangle',.05),70); };
const zvNe    = () => ton(120,.22,'sawtooth',.045);
const zvTik   = () => ton(380,.025,'square',.025);
const zvFrag  = () => { ton(520,.08,'sine',.05); setTimeout(()=>ton(780,.09,'sine',.05),90);
                        setTimeout(()=>ton(1180,.22,'sine',.05),190); };
const zvVrata = () => { for(let i=0;i<7;i++) setTimeout(()=>ton(220+i*160,.18,'triangle',.05), i*90); };

/* =====================================================================
   3. ДЪЖДЪТ ОТЗАД
   ===================================================================== */
const dujd = {
  boia:'#00ff9c', koloni:0, y:[], hod:0, spri:false,
  znaci:'01ABCХΨΔΣΩ∑∏√∞xyab+−·²³⁴⁵'.split('')
};
(function dujdNachalo(){
  const c = document.getElementById('rain'), g = c.getContext('2d');
  let w=0, h=0, stupka=16;
  function razmer(){
    w = c.width = Math.floor(window.innerWidth * Math.min(devicePixelRatio||1, 2));
    h = c.height = Math.floor(window.innerHeight * Math.min(devicePixelRatio||1, 2));
    c.style.width = window.innerWidth+'px'; c.style.height = window.innerHeight+'px';
    stupka = Math.max(14, Math.round(16 * Math.min(devicePixelRatio||1, 2)));
    dujd.koloni = Math.ceil(w/stupka);
    dujd.y = new Array(dujd.koloni).fill(0).map(()=> Math.random()*-60);
  }
  window.addEventListener('resize', razmer);
  razmer();
  const tiho = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function kadur(){
    dujd.hod++;
    if(!tiho && dujd.hod % 2 === 0){
      g.fillStyle = 'rgba(4,7,10,.12)';
      g.fillRect(0,0,w,h);
      g.font = (stupka-2)+'px "JetBrains Mono",monospace';
      for(let i=0;i<dujd.koloni;i++){
        const z = dujd.znaci[(Math.random()*dujd.znaci.length)|0];
        const x = i*stupka, y = dujd.y[i]*stupka;
        g.fillStyle = boiaAlfa(dujd.boia, .85); g.fillText(z, x, y);
        g.fillStyle = boiaAlfa(dujd.boia, .22); g.fillText(z, x, y - stupka);
        if(y > h && Math.random() > 0.975) dujd.y[i] = 0;
        dujd.y[i] += 1;
      }
    }
    requestAnimationFrame(kadur);
  }
  if(tiho){ g.fillStyle = 'rgba(4,7,10,1)'; g.fillRect(0,0,w,h); }
  requestAnimationFrame(kadur);
})();

/* =====================================================================
   4. ТАБЛОТО
   ===================================================================== */
function osveji(){
  $('#hChas').textContent = chasovnik(minaloto());
  $('#hBiti').textContent = S.biti;
  $('#hZad').textContent  = vsichkiReshene() + '/' + MISIA.sektori.reduce((n,s)=>n+s.zadachi.length,0);
  const l = $('#fragLenta');
  l.innerHTML = MISIA.sektori.map((s,i)=>
    '<span class="frag'+(sektorOtvoren(i)?' ima':'')+'" title="'+ekraniraj(s.fragment.vupros)+'">'
    + (sektorOtvoren(i) ? '?' : '·') + '</span>').join('');
}
setInterval(()=>{ $('#hChas').textContent = chasovnik(minaloto()); }, 1000);
$('#bZvuk').addEventListener('click', function(){
  S.zvuk = !S.zvuk; this.style.color = S.zvuk ? '' : '#3a4a44';
  this.textContent = S.zvuk ? '♪' : '✕'; zvTik(); zapazi();
});
$('#bNulirai').addEventListener('click', function(){
  if(!confirm('Да започнем ли отначало? Всичко събрано се губи.')) return;
  try{ localStorage.removeItem(KLJUCH); }catch(e){}
  location.reload();

$('#bKarta').addEventListener('click', function(){ ekranKarta(); });
</script>

<script>
/* =====================================================================
   5. ВХОДЪТ
   ===================================================================== */
const REDOVE_BOOT = [
 'СВЪРЗВАНЕ ... ок',
 'ПРОВЕРКА НА СТАЯТА ... заключена',
 'ОБЕКТИ ВЪТРЕ: 2',
 'ИЗХОД: един. КОД: пет цифри. ФРАГМЕНТИ: разпръснати в пет сектора.',
 '',
 'Матрицата държи всичко в скоби. Докато скобите стоят затворени,',
 'вратата стои затворена. Отваряш скобите — отваряш вратата.',
 '',
 'Двама сте. Пресмята един, проверява другият. Така се излиза.'
];

function ekranBoot(){
  document.body.classList.remove('glitch');
  tonSektor(0);
  scena.innerHTML =
   '<div class="panel">'
   + '<div class="etiket">защитен канал · 7. клас · НВО</div>'
   + '<h1>ИЗХОД ОТ МАТРИЦАТА</h1>'
   + '<div class="term muten" id="term"></div>'
   + '<div id="vhod" hidden>'
   +   '<div class="imena">'
   +     '<div class="ime-kutiq"><label>ИГРАЧ 1 · клавиши A / Z</label>'
   +       '<input id="ime1" maxlength="14" value="'+ekraniraj(S.imena[0])+'" /></div>'
   +     '<div class="ime-kutiq"><label>ИГРАЧ 2 · клавиши K / M</label>'
   +       '<input id="ime2" maxlength="14" value="'+ekraniraj(S.imena[1])+'" /></div>'
   +   '</div>'
   +   '<p class="muten" style="font-size:13px">Пет сектора със задачи. След всеки — ГЛИТЧ: '
   +     'машината показва равенство, вие казвате вярно или грешно, преди лентата да е свършила. '
   +     'Всеки отворен сектор дава по един фрагмент от кода за изхода.</p>'
   +   '<button class="but" id="bZapochni">ВЛЕЗ В МАТРИЦАТА →</button> '
   +   (vsichkiReshene() ? '<button class="but tih" id="bProdulji">ПРОДЪЛЖИ ОТТАМ, ДОКЪДЕТО СТИГНАХМЕ</button>' : '')
   + '</div>';
  const t = $('#term');
  let r = 0, k = 0, tekst = '';
  const tiho = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pishi(){
    if(r >= REDOVE_BOOT.length){
      t.innerHTML = tekst + '<span class="kurs mig"></span>';
      $('#vhod').hidden = false;
      return;
    }
    const red = REDOVE_BOOT[r];
    if(k <= red.length){
      const chast = red.slice(0,k);
      t.innerHTML = tekst + '<span class="z">'+ekraniraj(chast)+'</span><span class="kurs"></span>';
      k++;
      setTimeout(pishi, tiho ? 0 : 12);
    }else{
      tekst += ekraniraj(red) + '\n'; r++; k = 0;
      if(!tiho && red) zvTik();
      setTimeout(pishi, tiho ? 0 : 90);
    }
  }
  pishi();
  scena.addEventListener('click', function startvane(e){
    const b = e.target.closest('#bZapochni, #bProdulji');
    if(!b) return;
    S.imena = [($('#ime1').value || 'ИГРАЧ 1').toUpperCase().slice(0,14),
               ($('#ime2').value || 'ИГРАЧ 2').toUpperCase().slice(0,14)];
    zapazi(); zvOk();
    ekranSektor(parvNezavursen());
  });
}
function parvNezavursen(){
  for(let i=0;i<MISIA.sektori.length;i++) if(!sektorOtvoren(i)) return i;
  return MISIA.sektori.length;
}

/* =====================================================================
   6. СЕКТОР
   ===================================================================== */
function ekranSektor(i){
  document.body.classList.remove('glitch');
  if(i >= MISIA.sektori.length) return ekranIzhod();
  const s = MISIA.sektori[i];
  tonSektor(i);
  const got = broiReshene(s), procent = Math.min(100, Math.round(100*got/s.nujni));
  const otvoren = sektorOtvoren(i);
  scena.innerHTML =
   '<div class="panel">'
   + '<div class="sektor-glava"><div class="sektor-nomer">'+s.kod+'</div>'
   +   '<div><div class="etiket">сектор</div><h2>'+ekraniraj(s.ime)+'</h2>'
   +   '<div class="muten">'+ekraniraj(s.podnaslov)+'</div></div></div>'
   + '<p style="max-width:62ch">'+ekraniraj(s.briefing)+'</p>'
   + '<div class="lenta"><i style="width:'+procent+'%"></i></div>'
   + '<div class="muten" style="font-size:13px">решени '+got+' от '+s.zadachi.length
   +   ' · за отваряне на шлюза трябват '+s.nujni
   +   (got>=s.nujni ? ' · <b style="color:var(--ton)">ШЛЮЗЪТ Е ГОТОВ</b>' : '')+'</div>'
   + '<div class="spisuk">'
   + s.zadachi.map((z,j)=>
       '<button class="karta'+(S.reshene[z.id]?' gotova':'')+'" data-z="'+j+'">'
       + '<span class="gl"><span>'+(z.knige ? 'задача '+z.knige : 'задача '+(j+1))+'</span>'
       + '<span>'+(S.reshene[z.id]?'✓ решена':vidIme(z.vid))+'</span></span>'
       + '<span class="mat">'+ekraniraj(z.izraz)+'</span></button>').join('')
   + '</div>'
   + '<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">'
   +   (got >= s.nujni
        ? '<button class="but" id="bOtvori">'+(otvoren ? 'НАПРЕД →' : 'ОТВОРИ ШЛЮЗ '+s.kod+' →')+'</button>'
        : '<button class="but" disabled>ШЛЮЗЪТ Е ЗАКЛЮЧЕН · остават '+(s.nujni-got)+'</button>')
   +   (i>0 ? ' <button class="but tih" id="bNazad">← предишен сектор</button>' : '')
   + '</div></div>';

  $$('.karta', scena).forEach(b => b.addEventListener('click', ()=> ekranZadacha(i, +b.dataset.z)));
  const bo = $('#bOtvori');
  if(bo) bo.addEventListener('click', ()=>{
    if(!otvoren){ S.otvoreni.push(i); zapazi(); osveji(); zvFrag(); return ekranFragment(i); }
    return S.glitchGotovi.indexOf(i) === -1 ? ekranGlitch(i) : ekranSektor(i+1);
  });
  const bn = $('#bNazad');
  if(bn) bn.addEventListener('click', ()=> ekranSektor(i-1));
  osveji();
}
function vidIme(v){
  return v === 'mreja' ? 'решетка' : v === 'chislo' ? 'уравнение'
       : v === 'zamiana' ? 'маски' : 'чипове';
}

/* =====================================================================
   7. ФРАГМЕНТ — това, което шлюзът дава, когато се отвори
   ===================================================================== */
function ekranFragment(i){
  document.body.classList.remove('glitch');
  const s = MISIA.sektori[i];
  scena.innerHTML =
   '<div class="panel" style="text-align:center">'
   + '<div class="etiket">шлюз '+s.kod+' · отворен</div>'
   + '<h2 style="color:var(--zlat)">ФРАГМЕНТ '+s.kod+'</h2>'
   + '<p class="muten">Машината не дава цифрата наготово. Дава въпрос. '
   +   'Отговорът е една цифра — тя е вашият фрагмент. Запишете го някъде: '
   +   'на вратата ще трябват и петте.</p>'
   + '<div class="panel" style="border-color:var(--zlat);max-width:620px;margin:18px auto">'
   +   '<div class="mat izraz" style="color:var(--zlat)">'+ekraniraj(s.fragment.vupros)+'</div></div>'
   + '<button class="but" id="bNapred">ПРИЕМАМ →</button></div>';
  $('#bNapred').addEventListener('click', ()=> ekranGlitch(i));
}

/* =====================================================================
   8. КАРТА НА МИСИЯТА
   ===================================================================== */
function ekranKarta(){
  document.body.classList.remove('glitch');
  tonSektor(null);
  scena.innerHTML =
   '<div class="panel">'
   + '<div class="etiket">карта</div><h2>КЪДЕ СМЕ</h2>'
   + '<div class="spisuk">'
   + MISIA.sektori.map((s,i)=>{
       const g = broiReshene(s);
       return '<button class="karta'+(sektorOtvoren(i)?' gotova':'')+'" data-s="'+i+'">'
         + '<span class="gl"><span>СЕКТОР '+s.kod+'</span><span>'+g+'/'+s.zadachi.length+'</span></span>'
         + '<span class="mat">'+ekraniraj(s.ime)+'</span>'
         + '<span class="muten" style="font-size:12px">'+(sektorOtvoren(i)
             ? 'фрагмент: '+ekraniraj(s.fragment.vupros) : 'шлюзът е заключен')+'</span></button>';
     }).join('')
   + '</div>'
   + '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">'
   +   (S.otvoreni.length === MISIA.sektori.length
       ? '<button class="but" id="bIzhod">КЪМ ВРАТАТА →</button>' : '')
   +   '<button class="but tih" id="bObratno">← обратно</button></div></div>';
  $$('.karta', scena).forEach(b => b.addEventListener('click', ()=> ekranSektor(+b.dataset.s)));
  const bi = $('#bIzhod'); if(bi) bi.addEventListener('click', ekranIzhod);
  $('#bObratno').addEventListener('click', ()=> ekranSektor(parvNezavursen()));
}
</script>

<script>
/* =====================================================================
   9. ЗАДАЧА — три начина да се отговори
   ===================================================================== */
let OPIT = null;   /* текущият опит: грешки, взета ли е идеята */

function ekranZadacha(si, zi){
  document.body.classList.remove('glitch');
  const s = MISIA.sektori[si], z = s.zadachi[zi];
  tonSektor(si);
  OPIT = {greshki:0, ideya:false, faza: z.vid === 'mreja' ? 'mreja' : 'chipove',
          kletka:null, izbrani:[], si:si, zi:zi};

  scena.innerHTML =
   '<div class="panel">'
   + '<div class="zad-glava">'
   +   '<div><div class="etiket">сектор '+s.kod+' · '+(z.knige ? 'задача '+z.knige : 'задача '+(zi+1))+'</div>'
   +   '<div class="muten" style="font-size:12px">'+vidIme(z.vid)+'</div></div>'
   +   '<button class="but tih" id="bKumSektor">← сектор '+s.kod+'</button></div>'
   + '<div class="mat izraz" id="uslovie">'+ekraniraj(z.pokazhi || z.izraz)+'</div>'
   + (z.ideya ? '<div style="margin-top:10px"><button class="but tih" id="bIdeya">ИДЕЯ · −3 бита</button>'
                + '<span id="ideyaTekst" class="muten" style="margin-left:10px"></span></div>' : '')
   + '<div id="tqlo"></div>'
   + '<div id="zashtoKutiq"></div>'
   + '</div>';

  $('#bKumSektor').addEventListener('click', ()=> ekranSektor(si));
  const bi = $('#bIdeya');
  if(bi) bi.addEventListener('click', function(){
    OPIT.ideya = true; S.biti = Math.max(0, S.biti - 3); zapazi(); osveji();
    $('#ideyaTekst').textContent = z.ideya; this.disabled = true;
  });

  if(z.vid === 'chislo') risuvaiChislo(z);
  else if(z.vid === 'mreja') risuvaiMreja(z);
  else risuvaiChipove(z, false);
}

/* ── 9.1 решетката ───────────────────────────────────────────────── */
function risuvaiMreja(z){
  const m = z.mreja;
  const puln = {};
  const tqlo = $('#tqlo');
  tqlo.innerHTML =
    '<p class="muten" style="font-size:13px;margin-top:14px">Всяко квадратче е едно произведение: '
    + 'членът отляво по члена отгоре. Щракни върху квадратче и избери.</p>'
    + '<div class="mreja-obvivka"><table class="mreja"><thead><tr><th class="ugul">·</th>'
    + m.koloni.map(k=>'<th>'+ekraniraj(k)+'</th>').join('') + '</tr></thead><tbody>'
    + m.redove.map((r,ri)=>'<tr><th>'+ekraniraj(r)+'</th>'
        + m.koloni.map((k,ki)=>'<td><button class="kletka" id="kl-'+ri+'-'+ki+'" '
            + 'data-r="'+ri+'" data-k="'+ki+'">?</button></td>').join('')+'</tr>').join('')
    + '</tbody></table></div>'
    + '<div class="izbor" id="tabla"></div>';

  function otvori(ri, ki){
    if(puln[ri+'-'+ki]) return;
    OPIT.kletka = [ri, ki];
    $$('.kletka', tqlo).forEach(b => b.classList.remove('otvorena'));
    $('#kl-'+ri+'-'+ki).classList.add('otvorena');
    const kl = m.kletki[ri][ki];
    const vsichki = razburkai([kl.t].concat(kl.p), z.id+ri+'x'+ki);
    $('#tabla').innerHTML = vsichki.map((t,i)=>
      '<button class="chip" data-t="'+ekraniraj(t)+'"><span class="nom">'+(i+1)+'</span>'
      + ekraniraj(t)+'</button>').join('');
    $$('#tabla .chip').forEach(b => b.addEventListener('click', ()=> pusni(b, kl.t, ri, ki)));
  }
  function pusni(buton, veren, ri, ki){
    if(buton.dataset.t === veren){
      puln[ri+'-'+ki] = true;
      const k = $('#kl-'+ri+'-'+ki);
      k.textContent = veren; k.className = 'kletka puln';
      $('#tabla').innerHTML = ''; OPIT.kletka = null;
      zvOk();
      const ostava = m.redove.length * m.koloni.length - Object.keys(puln).length;
      if(ostava === 0){ setTimeout(()=> risuvaiChipove(z, true), 420); }
      else{
        for(let a=0;a<m.redove.length;a++) for(let b=0;b<m.koloni.length;b++)
          if(!puln[a+'-'+b]) return otvori(a,b);
      }
    }else{
      buton.classList.add('gresh'); buton.disabled = true;
      $('#kl-'+ri+'-'+ki).classList.add('gresh');
      setTimeout(()=> $('#kl-'+ri+'-'+ki).classList.remove('gresh'), 360);
      OPIT.greshki++; S.biti = Math.max(0, S.biti-1); S.greshki++; zapazi(); osveji(); zvNe();
    }
  }
  $$('.kletka', tqlo).forEach(b => b.addEventListener('click', ()=> otvori(+b.dataset.r, +b.dataset.k)));
  otvori(0,0);
}

/* ── 9.2 чиповете ────────────────────────────────────────────────── */
function risuvaiChipove(z, sledMreja){
  OPIT.faza = 'chipove'; OPIT.izbrani = [];
  const pool = razburkai(z.chipove, z.id);
  const tqlo = $('#tqlo');
  const stari = sledMreja ? $('.mreja-obvivka', tqlo).outerHTML : '';
  tqlo.innerHTML = stari
    + '<p class="muten" style="font-size:13px;margin-top:16px">'
    + (sledMreja ? 'Решетката е пълна. Сега приведи подобните и сглоби отговора — '
                 + 'внимавай, сред чиповете стоят и членовете ОТПРЕДИ привеждането.'
                 : 'Сглоби отговора от членовете. Част от тях са примамки.')
    + '</p>'
    + '<div class="redica" id="redica"></div>'
    + '<div class="izbor" id="pool">'
    + pool.map((t,i)=>'<button class="chip" data-t="'+ekraniraj(t)+'"><span class="nom">'
        +(i+1)+'</span>'+ekraniraj(t)+'</button>').join('')
    + '</div>'
    + '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'
    +   '<button class="but" id="bProveri">ПРОВЕРИ</button>'
    +   '<button class="but tih" id="bIzchisti">изчисти</button></div>';

  function prerisuvai(){
    $('#redica').innerHTML = OPIT.izbrani.map((t,i)=>
      '<button class="chip" data-i="'+i+'">'+ekraniraj(t)+' ×</button>').join('');
    $$('#redica .chip').forEach(b => b.addEventListener('click', ()=>{
      OPIT.izbrani.splice(+b.dataset.i,1); prerisuvai(); zvTik();
    }));
    $$('#pool .chip').forEach(b => {
      const vzeto = OPIT.izbrani.filter(t => t === b.dataset.t).length;
      const imaGi = pool.filter(t => t === b.dataset.t).length;
      b.classList.toggle('vzet', vzeto >= imaGi);
    });
  }
  $$('#pool .chip').forEach(b => b.addEventListener('click', ()=>{
    OPIT.izbrani.push(b.dataset.t); prerisuvai(); zvTik();
  }));
  $('#bIzchisti').addEventListener('click', ()=>{ OPIT.izbrani = []; prerisuvai(); });
  $('#bProveri').addEventListener('click', ()=> proveriChipove(z));
  prerisuvai();
}

function proveriChipove(z){
  const dadeni = OPIT.izbrani.slice().sort();
  const verni = z.otgovor.slice().sort();
  const ednakvi = dadeni.length === verni.length && dadeni.every((t,i)=> t === verni[i]);
  if(ednakvi) return uspeh(z);
  OPIT.greshki++; S.greshki++; S.biti = Math.max(0, S.biti-2); zapazi(); osveji(); zvNe();
  const greshni = OPIT.izbrani.filter(t => z.otgovor.indexOf(t) === -1).length;
  const lipsvat = z.otgovor.filter(t => OPIT.izbrani.indexOf(t) === -1).length;
  const red = $('#redica');
  red.classList.add('smut'); setTimeout(()=> red.classList.remove('smut'), 500);
  if(OPIT.greshki >= 2){
    $$('#redica .chip').forEach(b=>{
      if(z.otgovor.indexOf(b.textContent.replace(' ×','')) === -1) b.classList.add('gresh');
    });
  }
  kaji(greshni && lipsvat
        ? greshni+' сгрешени и '+lipsvat+' липсващи члена.'
        : greshni ? greshni+' от избраните не са в отговора.'
        : 'Липсват '+lipsvat+' члена.');
}

/* ── 9.3 уравненията ─────────────────────────────────────────────── */
function risuvaiChislo(z){
  $('#tqlo').innerHTML =
     '<p class="muten" style="font-size:13px;margin-top:14px">Отвори скобите, приведи и реши. '
     + 'Дробен корен се пише с наклонена черта: 12/17.</p>'
     + '<div class="chislo-red"><span class="mat" style="font-size:24px">'+z.promenliva+' =</span>'
     + '<input id="poleKoren" inputmode="text" autocomplete="off" spellcheck="false" placeholder="?" />'
     + '<button class="but" id="bProveri">ПРОВЕРИ</button></div>';
  const pole = $('#poleKoren');
  pole.focus();
  pole.addEventListener('keydown', e => { if(e.key === 'Enter') proveriChislo(z); });
  $('#bProveri').addEventListener('click', ()=> proveriChislo(z));
}
function chetiChislo(t){
  const s = String(t).trim().replace(/−/g,'-').replace(/\s/g,'').replace(',','.');
  let m = s.match(/^(-?\d+)\/(\d+)$/);
  if(m) return {p:+m[1], q:+m[2], drob:true};
  m = s.match(/^(-?\d+(?:\.\d+)?)$/);
  if(m) return {v:parseFloat(m[1]), drob:false};
  return null;
}
function proveriChislo(z){
  const d = chetiChislo($('#poleKoren').value);
  if(!d) return kaji('Това не е число. Пиши 6, −4 или 12/17.');
  const tochno = d.drob ? (d.p * z.q === z.p * d.q)
                        : Math.abs(d.v * z.q - z.p) < 1e-9;
  if(tochno) return uspeh(z);
  OPIT.greshki++; S.greshki++; S.biti = Math.max(0, S.biti-2); zapazi(); osveji(); zvNe();
  const red = $('.chislo-red');
  red.classList.add('smut'); setTimeout(()=> red.classList.remove('smut'), 500);
  if(!d.drob && z.q !== 1 && Math.abs(d.v - z.p/z.q) < 0.01)
    return kaji('Близо е, но тази дроб не се записва точно като десетично число. Напиши я с черта.');
  kaji(OPIT.greshki >= 2
       ? 'Пак не. Отвори скобите наново: квадратите трябва да се унищожат и да остане едно '+z.promenliva+'.'
       : 'Не е този корен. Провери знаците при отварянето на скобите.');
}

/* ── 9.4 общото: успех и съобщения ───────────────────────────────── */
function kaji(tekst){
  let k = $('#kazano');
  if(!k){
    k = document.createElement('div');
    k.id = 'kazano'; k.style.cssText = 'margin-top:12px;color:var(--cherven);font-weight:700';
    $('#tqlo').appendChild(k);
  }
  k.textContent = tekst;
}
function uspeh(z){
  const parvi = !S.reshene[z.id];
  let nagrada = 10;
  if(OPIT.ideya) nagrada -= 4;
  nagrada -= Math.min(6, OPIT.greshki*2);
  nagrada = Math.max(2, nagrada);
  if(parvi){ S.reshene[z.id] = true; S.biti += nagrada; }
  zapazi(); osveji(); zvOk();

  const s = MISIA.sektori[OPIT.si];
  const sled = s.zadachi.findIndex((q,j)=> j > OPIT.zi && !S.reshene[q.id]);
  $('#tqlo').querySelectorAll('button').forEach(b => b.disabled = true);
  $('#zashtoKutiq').innerHTML =
     '<div class="zashto"><div class="nd">ЗАЩО</div>'
     + (z.sled ? '<div class="mat">'+ekraniraj(z.izraz)+' = '+ekraniraj(z.sled)+'</div>' : '')
     + z.zashto.map(r=>'<div class="mat" style="font-weight:400;color:var(--tekst)">'
         +ekraniraj(r)+'</div>').join('')
     + '</div>'
     + '<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
     +   '<b style="color:var(--ton)">+'+(parvi?nagrada:0)+' бита</b>'
     +   (sled !== -1 ? '<button class="but" id="bSled">СЛЕДВАЩА ЗАДАЧА →</button>' : '')
     +   '<button class="but'+(sled === -1 ? '' : ' tih')+'" id="bNazadSektor">КЪМ СЕКТОР '+s.kod+'</button>'
     + '</div>';
  const bs = $('#bSled');
  if(bs) bs.addEventListener('click', ()=> ekranZadacha(OPIT.si, sled));
  $('#bNazadSektor').addEventListener('click', ()=> ekranSektor(OPIT.si));
  $('#zashtoKutiq').scrollIntoView({behavior:'smooth', block:'nearest'});
}
</script>

<script>
/* =====================================================================
   10. ГЛИТЧ — бързата игра между секторите
   ===================================================================== */
let GL = null, GL_TIK = null;
function spriGlitch(){ if(GL_TIK){ clearInterval(GL_TIK); GL_TIK = null; } }

const SEK_NA_RED = 12;

function ekranGlitch(i){
  spriGlitch();
  const g = MISIA.glitch[i];
  tonSektor(i);
  document.body.classList.add('glitch');
  GL = {i:i, k:0, toch:[0,0], seriq:0, naiDulga:0, suveti:2,
        zakl:[false,false], pauza:false, ostava:SEK_NA_RED, prikliuchil:false, biti:0};
  scena.innerHTML =
   '<div class="panel">'
   + '<div class="zad-glava"><div><div class="etiket">глитч '+g.kod+'</div>'
   +   '<h2>'+ekraniraj(g.ime)+'</h2></div>'
   +   '<div class="muten" style="text-align:right;font-size:13px">равенство след равенство<br>'
   +   'казвате бързо: вярно или грешно</div></div>'
   + '<div class="glitch-stena">'
   +   igrachPanel(0) + '<div id="scenaGl"></div>' + igrachPanel(1)
   + '</div>'
   + '<div style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">'
   +   '<button class="but tih" id="bSuvet">СЪВЕТ · интервал <span id="brSuveti">2</span></button>'
   +   '<span class="muten" style="font-size:12px">съветът спира лентата за 10 секунди — '
   +   'колкото да се посъветвате</span></div>'
   + '</div>';
  $('#bSuvet').addEventListener('click', suvet);
  pokajiRed();
}
function igrachPanel(n){
  return '<div class="igrach" id="igr'+n+'">'
    + '<div class="etiket">играч '+(n+1)+'</div><b>'+ekraniraj(S.imena[n])+'</b>'
    + '<div class="toch" id="toch'+n+'">0</div>'
    + '<div class="butoni2">'
    +   '<button class="da" data-i="'+n+'" data-v="1"><span class="klav">'+(n?'K':'A')+'</span><br>ВЯРНО</button>'
    +   '<button class="ne" data-i="'+n+'" data-v="0"><span class="klav">'+(n?'M':'Z')+'</span><br>ГРЕШНО</button>'
    + '</div></div>';
}
function pokajiRed(){
  const g = MISIA.glitch[GL.i];
  if(GL.k >= g.redove.length) return krajGlitch();
  const r = g.redove[GL.k];
  GL.zakl = [false,false]; GL.ostava = SEK_NA_RED; GL.prikliuchil = false; GL.pauza = false;
  $('#igr0').className = 'igrach'; $('#igr1').className = 'igrach';
  $('#scenaGl').innerHTML =
    '<div class="tvurdenie">'
    + '<div class="etiket">'+(GL.k+1)+' от '+g.redove.length+(GL.seriq>1?' · серия '+GL.seriq:'')+'</div>'
    + '<div class="mat" id="redGl">'+ekraniraj(r.red)+'</div>'
    + '<div class="chasovnik"><i id="lenta"></i></div>'
    + '<div class="presuda" id="presuda">&nbsp;</div></div>';
  $$('.butoni2 button').forEach(b => b.onclick = ()=> otgovori(+b.dataset.i, b.dataset.v === '1'));
  GL_TIK = setInterval(tik, 50);
}
function tik(){
  if(GL.pauza || GL.prikliuchil) return;
  GL.ostava -= 0.05;
  const l = $('#lenta');
  if(l) l.style.width = Math.max(0, 100*GL.ostava/SEK_NA_RED)+'%';
  if(GL.ostava <= 2.5 && Math.abs(GL.ostava % 1) < 0.05) zvTik();
  if(GL.ostava <= 0) razkrii(null);
}
function suvet(){
  if(!GL || GL.suveti <= 0 || GL.prikliuchil) return;
  GL.suveti--; GL.pauza = true;
  $('#brSuveti').textContent = GL.suveti;
  $('#presuda').textContent = 'СЪВЕТ · 10';
  let ost = 10;
  const t = setInterval(()=>{
    ost--;
    const p = $('#presuda'); if(p) p.textContent = 'СЪВЕТ · '+ost;
    if(ost <= 0){ clearInterval(t); GL.pauza = false; const q = $('#presuda'); if(q) q.innerHTML = '&nbsp;'; }
  }, 1000);
}
function otgovori(n, kazva){
  if(!GL || GL.prikliuchil || GL.zakl[n] || GL.pauza) return;
  const r = MISIA.glitch[GL.i].redove[GL.k];
  if(kazva === r.vqrno){
    GL.toch[n] += 2; S.tochki[n] += 2; GL.biti += 2; S.biti += 2;
    GL.seriq++; GL.naiDulga = Math.max(GL.naiDulga, GL.seriq);
    S.naiDulga = Math.max(S.naiDulga, GL.seriq);
    if(GL.seriq >= 3){ GL.biti++; S.biti++; }
    $('#toch'+n).textContent = GL.toch[n];
    $('#igr'+n).classList.add('gori');
    zvOk(); razkrii(n);
  }else{
    GL.zakl[n] = true; GL.seriq = 0;
    S.biti = Math.max(0, S.biti-1); GL.biti -= 1;
    $('#igr'+n).classList.add('vun');
    const red = $('#redGl'); red.classList.add('smut');
    setTimeout(()=> red.classList.remove('smut'), 500);
    zvNe();
    if(GL.zakl[0] && GL.zakl[1]) razkrii(null);
  }
  osveji(); zapazi();
}
function razkrii(pobeditel){
  if(GL.prikliuchil) return;
  GL.prikliuchil = true; spriGlitch();
  const r = MISIA.glitch[GL.i].redove[GL.k];
  const p = $('#presuda');
  p.className = 'presuda ' + (r.vqrno ? 'ok' : 'ne');
  p.textContent = (r.vqrno ? 'ВЯРНО' : 'ГРЕШНО')
    + (pobeditel === null ? ' · никой' : ' · ' + S.imena[pobeditel]);
  if(!r.vqrno){
    const red = $('#redGl');
    red.insertAdjacentHTML('afterend',
      '<div class="muten" style="font-size:14px">'+ekraniraj(r.zashto)+'</div>');
  }
  setTimeout(()=>{ GL.k++; pokajiRed(); }, r.vqrno ? 1100 : 2100);
}
function krajGlitch(){
  spriGlitch();
  document.body.classList.remove('glitch');
  const i = GL.i;
  if(S.glitchGotovi.indexOf(i) === -1) S.glitchGotovi.push(i);
  zapazi(); osveji();
  const posleden = i >= MISIA.sektori.length - 1;
  scena.innerHTML =
   '<div class="panel" style="text-align:center">'
   + '<div class="etiket">глитч '+MISIA.glitch[i].kod+' · край</div>'
   + '<h2>СБОЯТ Е ОТБИТ</h2>'
   + '<div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:20px 0">'
   +   '<div><div class="etiket">'+ekraniraj(S.imena[0])+'</div><div class="toch">'+GL.toch[0]+'</div></div>'
   +   '<div><div class="etiket">най-дълга серия</div><div class="toch" style="color:var(--zlat)">'
       +GL.naiDulga+'</div></div>'
   +   '<div><div class="etiket">'+ekraniraj(S.imena[1])+'</div><div class="toch">'+GL.toch[1]+'</div></div>'
   + '</div>'
   + '<p class="muten">отборът спечели <b style="color:var(--ton)">'+Math.max(0,GL.biti)+' бита</b></p>'
   + '<button class="but" id="bNapred">'+(posleden ? 'КЪМ ВРАТАТА →' : 'СЕКТОР '
       + MISIA.sektori[i+1].kod+' →')+'</button>'
   + ' <button class="but tih" id="bPak">още веднъж</button></div>';
  $('#bNapred').addEventListener('click', ()=> posleden ? ekranIzhod() : ekranSektor(i+1));
  $('#bPak').addEventListener('click', ()=> ekranGlitch(i));
}

/* =====================================================================
   11. ВРАТАТА
   ===================================================================== */
function ekranIzhod(){
  document.body.classList.remove('glitch');
  spriGlitch(); tonSektor(null);
  const nezavursheni = MISIA.sektori.filter((s,i)=> !sektorOtvoren(i));
  if(nezavursheni.length){
    scena.innerHTML = '<div class="panel" style="text-align:center">'
      + '<h2>ВРАТАТА МЪЛЧИ</h2><p class="muten">Липсват фрагменти от '
      + nezavursheni.map(s=>'сектор '+s.kod).join(', ')
      + '.</p><button class="but" id="bObratno">ОБРАТНО</button></div>';
    $('#bObratno').addEventListener('click', ()=> ekranSektor(parvNezavursen()));
    return;
  }
  scena.innerHTML =
   '<div class="panel">'
   + '<div class="etiket">край на коридора</div><h2 style="color:var(--zlat)">ТРИ ВРАТИ</h2>'
   + '<p>Само на едната написаното е вярно. Другите две са нарисувани от машината, '
   +   'за да изглеждат като изход. Проверете, преди да бутнете.</p>'
   + '<div class="vrati">'
   + MISIA.vrati.map((v,i)=>'<button class="vrata" data-v="'+i+'">'
       + '<span class="rim">ВРАТА '+v.etiket+'</span>'
       + '<span class="mat">'+ekraniraj(v.red)+'</span>'
       + '<span class="muten" style="font-size:12px">бутни</span></button>').join('')
   + '</div></div>';
  $$('.vrata').forEach(b => b.addEventListener('click', ()=>{
    const v = MISIA.vrati[+b.dataset.v];
    if(v.vqrno){ zvOk(); ekranKljuch(); }
    else{
      b.classList.add('gresh'); b.disabled = true;
      S.biti = Math.max(0, S.biti-5); S.greshki++; zapazi(); osveji(); zvNe();
      b.insertAdjacentHTML('beforeend',
        '<span style="color:var(--cherven);font-size:12px">'+ekraniraj(v.zashto)+'</span>');
    }
  }));
}

function ekranKljuch(){
  let opiti = 0;
  scena.innerHTML =
   '<div class="panel" style="text-align:center">'
   + '<div class="etiket">ключалка</div><h2 style="color:var(--zlat)">ПЕТ ЦИФРИ</h2>'
   + '<p class="muten">По една от всеки сектор, в реда на секторите.</p>'
   + '<div class="kluch" id="kluch">'
   + MISIA.sektori.map((s,i)=>'<input id="c'+i+'" inputmode="numeric" maxlength="1" '
       + 'aria-label="фрагмент '+s.kod+'" />').join('')
   + '</div>'
   + '<button class="but" id="bOtkliuchi">ОТКЛЮЧИ</button>'
   + '<div id="kljuchKaz" style="margin-top:12px;min-height:24px;font-weight:700"></div>'
   + '<div class="spisuk-frag">'
   + MISIA.sektori.map(s=>'<div><span>'+s.kod+'</span>'+ekraniraj(s.fragment.vupros)+'</div>').join('')
   + '</div>'
   + '<div style="margin-top:14px"><button class="but tih" id="bPodskazka" hidden>'
   +   'ПОДСКАЗКА · −10 бита</button></div></div>';

  const poleta = MISIA.sektori.map((s,i)=> $('#c'+i));
  poleta.forEach((p,i)=>{
    p.addEventListener('input', ()=>{
      p.value = p.value.replace(/\D/g,'').slice(0,1);
      if(p.value && poleta[i+1]) poleta[i+1].focus();
    });
    p.addEventListener('keydown', e=>{
      if(e.key === 'Backspace' && !p.value && poleta[i-1]) poleta[i-1].focus();
      if(e.key === 'Enter') opitai();
    });
  });
  poleta[0].focus();
  $('#bOtkliuchi').addEventListener('click', opitai);
  $('#bPodskazka').addEventListener('click', ()=>{
    const i = poleta.findIndex((p,j)=> p.value !== MISIA.kod[j]);
    if(i === -1) return;
    poleta[i].value = MISIA.kod[i];
    S.biti = Math.max(0, S.biti-10); zapazi(); osveji();
    $('#kljuchKaz').innerHTML = '<span class="muten">Една цифра дойде наготово. Остава останалото.</span>';
  });

  function opitai(){
    const dadeno = poleta.map(p=>p.value || '·').join('');
    if(dadeno === MISIA.kod){ zvVrata(); return ekranKraj(); }
    opiti++; S.greshki++; zapazi();
    const vqrni = poleta.filter((p,i)=> p.value === MISIA.kod[i]).length;
    $('#kluch').classList.add('gresh');
    setTimeout(()=> $('#kluch').classList.remove('gresh'), 420);
    zvNe();
    $('#kljuchKaz').innerHTML = '<span style="color:var(--cherven)">НЕ. На място са '
      + vqrni + ' от 5 цифри.</span>';
    if(opiti >= 3) $('#bPodskazka').hidden = false;
  }
}
</script>

<script>
/* =====================================================================
   12. ВЕЧЕРЯТА
   ===================================================================== */
function ekranKraj(){
  document.body.classList.remove('glitch');
  spriGlitch(); tonSektor(null);
  S.svurshen = true; zapazi(); osveji();
  dujd.boia = ZLAT;
  const sek = minaloto();
  const vsichki = MISIA.sektori.reduce((n,s)=> n + s.zadachi.length, 0);
  scena.innerHTML =
   '<div class="panel" style="border-color:var(--zlat)">'

   +   red2('събрани битове', S.biti)
   +   red2('решени задачи', vsichkiReshene()+' от '+vsichki)
   +   red2('ГЛИТЧ · '+ekraniraj(S.imena[0]), S.tochki[0])
   +   red2('ГЛИТЧ · '+ekraniraj(S.imena[1]), S.tochki[1])
   +   red2('най-дълга серия', S.naiDulga)
   +   red2('кодът', MISIA.kod)
   + '</table></div>'
   + '<h2 style="margin-top:26px">МЕНЮ</h2>'
   + '<p class="muten" id="chiiRed">'+ekraniraj(S.imena[0])+', ти избираш пръв(а).</p>'
   + '<div class="menu" id="menu">'
   + MISIA.menu.map((q,i)=>'<button class="qdene" data-q="'+i+'"><b>'+ekraniraj(q[0])+'</b>'
       + '<span>'+ekraniraj(q[1])+'</span></button>').join('')
   + '</div>'
   + '<div id="poruchka"></div>'
   + '<div class="zashto" style="border-color:var(--zlat);margin-top:26px">'
   +   '<div class="nd">КАКВО ОСТАВА СЛЕД ТАЗИ СТАЯ</div>'
   +   '<div class="mat" style="font-weight:400">Всеки член от първата скоба среща всеки от втората.</div>'
   +   '<div class="mat" style="font-weight:400">Подобните се събират накрая, не по средата.</div>'
   +   '<div class="mat" style="font-weight:400">Минусът пред скоба сменя знака на всичко вътре.</div>'
   +   '<div class="mat" style="font-weight:400">В уравненията x² се унищожава — остава линейно.</div>'
   +   '<div class="mat" style="font-weight:400">Дробният корен е корен, не грешка.</div>'
   + '</div>'
   + '<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">'
   +   '<button class="but" id="bPechat">ПЕЧАТ НА ВАУЧЕРА</button>'
   +   '<button class="but tih" id="bPakVsichko">ОТНАЧАЛО</button></div></div>';

  $$('#menu .qdene').forEach(b => b.addEventListener('click', ()=>{
    const n = S.menu[0] === null ? 0 : 1;
    S.menu[n] = +b.dataset.q; zapazi(); zvOk();
    $$('#menu .qdene').forEach(x => x.classList.toggle('izbrano',
      S.menu.indexOf(+x.dataset.q) !== -1));
    if(S.menu[1] === null){
      $('#chiiRed').textContent = S.imena[1] + ', сега ти.';
    }else{
      $('#chiiRed').textContent = 'Поръчката е приета.';
      $('#poruchka').innerHTML = '<div class="vaucher"><div class="etiket" style="color:var(--zlat)">'
        + 'ваучер за вечеря</div><table>'
        + red2(ekraniraj(S.imena[0]), ekraniraj(MISIA.menu[S.menu[0]][0]))
        + red2(ekraniraj(S.imena[1]), ekraniraj(MISIA.menu[S.menu[1]][0]))
        + red2('изход от Матрицата за', chasovnik(sek))
        + '</table></div>';
    }
  }));
  if(S.menu[0] !== null && S.menu[1] !== null) $('#menu .qdene').click();
  $('#bPechat').addEventListener('click', ()=> window.print());
  $('#bPakVsichko').addEventListener('click', ()=> $('#bNulirai').click());
  zvVrata();
}
function red2(a,b){ return '<tr><td>'+a+'</td><td>'+b+'</td></tr>'; }

/* =====================================================================
   13. КЛАВИАТУРАТА
   ===================================================================== */
document.addEventListener('keydown', function(e){
  const vhvInput = document.activeElement && document.activeElement.tagName === 'INPUT';

  /* глитч: двата чифта клавиши работят и на кирилица, защото се гледа
     кой КЛАВИШ е натиснат, а не коя буква излиза */
  if(GL && $('.glitch-stena')){
    if(e.code === 'KeyA'){ otgovori(0, true);  e.preventDefault(); return; }
    if(e.code === 'KeyZ'){ otgovori(0, false); e.preventDefault(); return; }
    if(e.code === 'KeyK'){ otgovori(1, true);  e.preventDefault(); return; }
    if(e.code === 'KeyM'){ otgovori(1, false); e.preventDefault(); return; }
    if(e.code === 'Space'){ suvet(); e.preventDefault(); return; }
  }
  if(vhvInput) return;

  const tabla = $('#tabla');
  if(tabla && tabla.children.length){
    const n = +(e.key) ;
    if(n >= 1 && n <= tabla.children.length){ tabla.children[n-1].click(); e.preventDefault(); }
    return;
  }
  const pool = $('#pool');
  if(pool){
    const n = +(e.key);
    if(n >= 1 && n <= pool.children.length){
      const c = pool.children[n-1];
      if(!c.classList.contains('vzet')) c.click();
      e.preventDefault(); return;
    }
    if(e.key === 'Backspace'){
      const r = $('#redica');
      if(r && r.lastElementChild){ r.lastElementChild.click(); e.preventDefault(); }
      return;
    }
    if(e.key === 'Enter'){ const b = $('#bProveri'); if(b && !b.disabled) b.click(); }
  }
});

/* =====================================================================
   14. ПАЛИМ
   ===================================================================== */
vuzstanovi();
osveji();
if(S.zvuk === false){ $('#bZvuk').textContent = '✕'; $('#bZvuk').style.color = '#3a4a44'; }
window.addEventListener('beforeunload', zapazi);
setInterval(zapazi, 15000);
ekranBoot();
</script>
