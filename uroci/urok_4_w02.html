<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Космическа мисия · 4. клас</title>
<meta name="description" content="Интерактивен урок за 4. клас, седмица 2: пет планети — разряди, ред на действията, неизвестно число, мерки и време, и съставни задачи — с паузи за движение." />
<!-- =====================================================================
     Космическа мисия — 4. клас, седмица 2
     ---------------------------------------------------------------------
     Пет планети, по четири задачи на всяка: Луната (разряди и числа),
     Марс (ред на действията), Юпитер (неизвестното число), Сатурн (мерки
     и време) и Нептун (съставни задачи). Между планетите има паузи с
     движение, а на всяка планета — бележка за преподавателя.

     Материалът е преговор на 3. клас, тоест точно това, което прави
     седмица 2. Урокът не иска вход и нищо не предава към платформата.
     ===================================================================== -->
<style>
/* основите, които страницата имаше в claude.ai */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: route map with rocket on top; below it one stage at a time (planet = 4 problems, or a movement break). Deliberately single night-sky look. */
:root{
  --space:#0d1033; --space-2:#161b4d; --panel:#1f2563; --panel-2:#323a8a;
  --ink:#f4f1ff; --muted:#aab0e6;
  --star:#ffd84d; --rocket:#ff6b4a; --rocket-d:#c4442b; --mint:#4de3b5; --sky:#69c8ff; --pinkp:#ff8fd1;
  --ok:#7ff0c8; --ok-bg:#12493d; --bad:#ffb0a3; --bad-bg:#5a1f2a; --warn:#ffe08a; --warn-bg:#4d3d12;
  --display:'Russo One','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 70px;display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--star);outline-offset:3px}
.eyebrow{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mint)}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--display);font-size:20px}
.brand span{color:var(--star)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.starc{font-family:var(--display);font-size:19px;background:var(--space-2);border:2px solid var(--star);border-radius:999px;padding:3px 14px;font-variant-numeric:tabular-nums;color:var(--star)}
.tbtn{background:var(--space-2);border:2px solid var(--panel-2);border-radius:999px;padding:5px 14px;font-weight:800;font-size:15px}
.tbtn.sos{border-color:var(--mint);color:var(--mint)}
.tbtn.sos:hover{background:#123d40}

/* map */
.map{position:relative;display:flex;align-items:flex-start;overflow-x:auto;padding:44px 10px 10px;background:var(--space-2);border-radius:22px;border:2px solid var(--panel-2);scrollbar-width:thin}
.node{flex:none;display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0 2px;position:relative;min-width:44px}
.node .lbl{font-size:11.5px;color:var(--muted);font-weight:800;white-space:nowrap}
.node.cur .lbl{color:var(--star)}
.node .chk{position:absolute;top:-6px;right:0;width:18px;height:18px;border-radius:50%;background:var(--mint);color:var(--space);font-size:12px;font-weight:900;display:grid;place-items:center}
.link{flex:1 0 12px;height:3px;margin-top:17px;background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 10px);opacity:.45}
.link.done{background:var(--star);opacity:1}
.bnode{width:28px;height:28px;margin-top:3px;border-radius:50%;border:2.5px dashed var(--mint);display:grid;place-items:center}
.bnode svg{width:16px;height:16px}
.snode{width:34px;height:34px;border-radius:50%;background:var(--panel);border:2px solid var(--panel-2);display:grid;place-items:center}
.snode svg{width:18px;height:18px}
#rocket{position:absolute;top:6px;left:0;width:26px;transition:left .9s cubic-bezier(.5,0,.3,1);pointer-events:none}
#rocket .flame{animation:flame .15s infinite alternate;transform-origin:15px 31px}
@keyframes flame{to{transform:scaleY(1.35)}}

/* planets */
.pball{--s:34px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;box-shadow:inset calc(var(--s)*-.14) calc(var(--s)*-.12) 0 rgba(0,0,0,.22)}
.pb-moon{background:radial-gradient(circle at 30% 35%,#b9bdd6 0 9%,transparent 10%),radial-gradient(circle at 66% 60%,#b9bdd6 0 13%,transparent 14%),radial-gradient(circle at 42% 76%,#c4c8de 0 6%,transparent 7%),#e4e6f3}
.pb-mars{background:radial-gradient(circle at 35% 40%,#e2603a 0 10%,transparent 11%),radial-gradient(circle at 68% 64%,#d9552f 0 8%,transparent 9%),radial-gradient(circle at 30% 72%,#e2603a 0 5%,transparent 6%),#ff8257}
.pb-jupiter{background:radial-gradient(ellipse 14% 9% at 64% 62%,#c8573a 99%,transparent),linear-gradient(#f6d2a2 0 18%,#d99a5e 18% 30%,#f3c995 30% 45%,#c9814a 45% 55%,#f6d6ab 55% 72%,#d9a06a 72% 84%,#f3cfa0 84%)}
.pb-saturn{background:linear-gradient(#ffe7a3,#e8b75a)}
.pb-saturn::after{content:"";position:absolute;width:176%;height:36%;left:-38%;top:32%;border:calc(var(--s)*.07) solid #ffd27a;border-radius:50%;transform:rotate(-16deg);box-shadow:0 0 0 calc(var(--s)*.03) #b58a3a inset}
.pb-neptune{background:radial-gradient(circle at 62% 38%,#9fd0ff 0 11%,transparent 12%),radial-gradient(ellipse 40% 6% at 50% 66%,#4a7bea 99%,transparent),linear-gradient(#69adff,#2c4fd0)}

/* astronaut */
.astro{width:clamp(96px,20vw,160px);flex:none}
.astro .whole{transform-origin:50% 95%}
.astro .asvg{display:block;width:100%;height:auto;overflow:visible}
.arm,.leg{transform-box:fill-box}
.arm{transform-origin:50% 7%;transition:transform .35s}
.leg{transform-origin:50% 0}
.aeye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.astro.idle .whole{animation:afloat 3.2s ease-in-out infinite}
.astro.hop .whole{animation:ajump .8s ease-out}
.astro.hop .armL{animation:armUpL .8s ease-out}
.astro.hop .armR{animation:armUpR .8s ease-out}
.astro.squat .whole{animation:asquat 1.2s ease-in-out}
.astro.squat .armL{animation:armFwdL 1.2s ease-in-out}
.astro.squat .armR{animation:armFwdR 1.2s ease-in-out}
.astro.clap .armL{animation:clapL .32s ease-in-out}
.astro.clap .armR{animation:clapR .32s ease-in-out}
.astro.shake .whole{animation:ashake .55s ease}
.astro.wave .armR{animation:wave 1.1s ease-in-out 2}
.astro.wave .whole{animation:afloat 3.2s ease-in-out infinite}
.astro.dance .whole{animation:adance .42s ease-in-out infinite alternate}
.astro.dance .armL{animation:dL .42s ease-in-out infinite alternate}
.astro.dance .armR{animation:dR .42s ease-in-out infinite alternate}
.astro.dance .legL{animation:lk .42s ease-in-out infinite alternate}
.astro.frozen .asvg{filter:hue-rotate(170deg) saturate(.5) brightness(1.15) drop-shadow(0 0 14px #8fe9ff)}
.astro.reach .armL{transform:rotate(165deg)}
.astro.reach .armR{transform:rotate(-165deg)}
.astro.reach .whole{animation:stretch 2s ease-in-out infinite}
.astro.breath .whole{transition:transform 4s ease-in-out}
.astro.breath.in .whole{transform:scale(1.1)}
.astro.flamingo .legR{transform:rotate(-70deg)}
.astro.flamingo .armL{transform:rotate(100deg)}
.astro.flamingo .armR{transform:rotate(-100deg)}
.astro.flamingo .whole{animation:wobble 1.6s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes afloat{50%{transform:translateY(-5%) rotate(2deg)}}
@keyframes ajump{0%{transform:none}15%{transform:translateY(3%) scale(1.05,.93)}45%{transform:translateY(-30%)}75%{transform:translateY(0) scale(1.04,.95)}100%{transform:none}}
@keyframes armUpL{30%,60%{transform:rotate(150deg)}}
@keyframes armUpR{30%,60%{transform:rotate(-150deg)}}
@keyframes asquat{0%,100%{transform:none}40%,62%{transform:translateY(15%) scale(1.07,.84)}}
@keyframes armFwdL{40%,62%{transform:rotate(85deg)}}
@keyframes armFwdR{40%,62%{transform:rotate(-85deg)}}
@keyframes clapL{50%{transform:rotate(-48deg)}}
@keyframes clapR{50%{transform:rotate(48deg)}}
@keyframes ashake{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-155deg)}50%{transform:rotate(-120deg)}}
@keyframes adance{from{transform:rotate(-9deg)}to{transform:rotate(9deg) translateY(-6%)}}
@keyframes dL{from{transform:rotate(140deg)}to{transform:rotate(30deg)}}
@keyframes dR{from{transform:rotate(-30deg)}to{transform:rotate(-140deg)}}
@keyframes lk{to{transform:rotate(25deg)}}
@keyframes stretch{50%{transform:translateY(-6%) scaleY(1.04)}}
@keyframes wobble{50%{transform:rotate(4deg)}}

/* intro */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--panel),var(--space-2));border:2px solid var(--panel-2);border-radius:28px;padding:20px}
.hero h1{font-size:clamp(30px,6.4vw,48px)}
.hero h1 span{color:var(--star)}
.hero .lede{color:var(--muted);max-width:56ch;margin-top:6px;font-weight:700}
.namerow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.namerow label{font-weight:800}
#name{font:inherit;font-weight:800;font-size:20px;background:var(--space);color:var(--ink);border:2.5px solid var(--panel-2);border-radius:14px;padding:6px 12px;width:min(100%,230px)}
@media (max-width:600px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.namerow{justify-content:center}}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.rcard{background:var(--space-2);border:2px solid var(--panel-2);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-width:0}
.rcard b{display:block;font-family:var(--display);font-weight:400}
.rcard small{color:var(--muted);font-weight:700;font-size:14px}
.teacher{background:var(--space-2);border:2px dashed var(--panel-2);border-radius:18px;padding:10px 16px;font-size:15.5px;color:var(--muted)}
.teacher summary{font-weight:900;color:var(--ink);cursor:pointer}
.teacher ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.teacher p{margin-top:6px}

.btn{background:var(--rocket);color:#fff;border:0;border-radius:999px;padding:11px 24px;font-weight:900;font-size:19px;box-shadow:0 5px 0 var(--rocket-d);transition:transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rocket-d)}
.btn.mint{background:var(--mint);color:var(--space);box-shadow:0 5px 0 #23a37c}
.ghost{background:transparent;border:2.5px solid var(--panel-2);border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.ghost:hover{background:var(--panel)}
.ghost.nudge{border-color:var(--star);color:var(--star);animation:nud .5s ease 3}
@keyframes nud{50%{transform:translateY(-3px)}}

/* planet stage */
.phead{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--space-2);border:2px solid var(--panel-2);border-radius:26px;padding:14px 18px}
.phead .pball{--s:clamp(58px,13vw,92px);animation:pfloat 5s ease-in-out infinite}
@keyframes pfloat{50%{transform:translateY(-5px) rotate(4deg)}}
.phead h2{font-size:clamp(22px,4.8vw,30px)}
.phead .story{color:var(--muted);font-weight:700;font-size:16px;margin-top:4px}
.phead .astro{width:clamp(70px,14vw,112px)}
.rule{margin-top:8px;display:inline-block;background:var(--panel);border-radius:12px;padding:5px 12px;font-size:15px;font-weight:800;color:var(--star)}
@media (max-width:560px){.phead{grid-template-columns:auto 1fr;}.phead .astro{grid-column:2;grid-row:1;justify-self:end;width:64px}.phead .ptxt{grid-column:1 / -1}}
.pdots{display:flex;gap:10px;justify-content:center}
.pdot{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--panel-2);display:grid;place-items:center;font-family:var(--display);font-size:14px;color:var(--muted)}
.pdot.cur{border-color:var(--star);color:var(--star);transform:scale(1.15)}
.pdot.done{background:var(--star);border-color:var(--star);color:var(--space)}
.pcard{background:var(--panel);border:2px solid var(--panel-2);border-radius:28px;padding:22px;display:grid;gap:16px;min-width:0}
.ptag{justify-self:start;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--sky)}
.ptext{font-size:clamp(20px,4.6vw,26px);font-weight:800;line-height:1.5;text-wrap:pretty}
.expr{font-family:var(--display);font-size:clamp(30px,8vw,48px);letter-spacing:.03em;line-height:1.3;overflow-wrap:anywhere}
.expr i{color:var(--star);font-style:normal}
.qsub{font-family:var(--display);font-size:clamp(26px,6vw,38px);color:var(--star)}
.arow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans{font-family:var(--display);font-size:28px;background:var(--space);color:var(--ink);border:3px solid var(--panel-2);border-radius:16px;padding:8px 14px;width:min(100%,210px);min-width:0;font-variant-numeric:tabular-nums}
.ans:focus{border-color:var(--star)}
.unit{font-weight:900;color:var(--muted);font-size:19px}
.qrl{display:grid;gap:4px;font-weight:800;font-size:15px;color:var(--muted)}
.qrl .ans{width:150px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{background:var(--space);border:3px solid var(--panel-2);border-radius:18px;padding:14px;font-family:var(--display);font-size:clamp(20px,4.6vw,26px)}
.opt:hover{border-color:var(--sky)}
.opt.no{border-color:var(--bad);opacity:.55}
.opt.yes{border-color:var(--mint);background:var(--ok-bg)}
.fb{border-radius:16px;padding:10px 16px;font-weight:800}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.helper{background:var(--space-2);border-radius:20px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.helper h3{font-family:var(--body);font-weight:900;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint)}
.step{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:800;font-size:19px}
.step .ans{font-size:22px;width:130px;padding:4px 10px}
.step .ok{color:var(--mint);font-weight:900}
.step.done .q{color:var(--muted)}
.why{margin:0;padding-left:22px;display:grid;gap:5px;font-weight:800;font-size:18px}
.vis{overflow-x:auto;padding-block:4px}
.pv{display:flex;gap:8px}
.pv div{display:grid;justify-items:center;gap:2px}
.pv b{font-family:var(--display);font-weight:400;font-size:34px;width:58px;height:58px;display:grid;place-items:center;border-radius:14px;background:var(--panel);border:2.5px solid var(--sky)}
.pv small{font-size:12px;color:var(--muted);font-weight:800}
.chain{display:grid;gap:10px}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;font-weight:900}
.cbox{min-width:56px;height:46px;padding:0 8px;border-radius:12px;background:var(--panel);border:2.5px solid var(--sky);display:grid;place-items:center;font-family:var(--display);font-size:22px}
.cbox.q{border-color:var(--star);color:var(--star)}
.carr{font-size:15px;color:var(--muted);white-space:nowrap}
.carr b{color:var(--ink)}
.bars{display:grid;gap:6px;min-width:300px}
.brow{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;font-weight:800;font-size:14px}
.bbar{height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;color:var(--space)}
.done-card{text-align:center;justify-items:center}
.done-card h2{font-size:clamp(26px,6vw,38px)}
.bigstars{font-size:40px;color:var(--star);letter-spacing:6px}

/* break stage */
.brk{display:grid;gap:14px}
.bhead{background:var(--space-2);border:2px solid var(--mint);border-radius:26px;padding:16px 20px;display:grid;gap:6px}
.bhead h2{font-size:clamp(26px,6vw,38px);color:var(--mint)}
.binstr{font-size:clamp(18px,4.2vw,22px);font-weight:800}
.bstage{position:relative;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--panel);border-radius:28px;padding:22px;min-height:280px;overflow:hidden}
.bstage .astro{width:clamp(120px,26vw,200px);position:relative;z-index:1}
@media (max-width:560px){.bstage{grid-template-columns:1fr;justify-items:center;text-align:center}}
.bright{display:grid;gap:10px;justify-items:start;min-width:0}
@media (max-width:560px){.bright{justify-items:center}}
.bbig{font-family:var(--display);font-size:clamp(46px,13vw,96px);line-height:1;color:var(--star);overflow-wrap:anywhere}
.bbig.pop{animation:pop .35s ease}
.bbig .ld{color:var(--pinkp);text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:8px}
@keyframes pop{0%{transform:scale(.6);opacity:.3}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}
.bsub{font-size:clamp(19px,4.4vw,26px);font-weight:900}
.bsub.ev{color:var(--sky)}.bsub.od{color:var(--pinkp)}
.tbar{width:min(100%,360px);height:12px;border-radius:99px;background:var(--space);overflow:hidden}
.tbar span{display:block;height:100%;width:0;background:var(--mint);border-radius:99px}
.cdots{display:flex;flex-wrap:wrap;gap:8px;min-height:28px}
.cdots i{width:26px;height:26px;border-radius:50%;background:var(--pinkp);animation:pop .25s ease}
.breathc{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,#4de3b555,#4de3b511 70%);border:3px solid #4de3b588;transition:transform 4s ease-in-out;z-index:0}
.breathc.in{transform:scale(2)}
.breathc.hold{transform:scale(2)}
.bctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* finale */
.cert{background:linear-gradient(135deg,var(--panel),#3b2a76);border:3px solid var(--star);border-radius:30px;padding:24px;display:grid;gap:14px;justify-items:center;text-align:center}
.cert h1{font-size:clamp(28px,6.4vw,46px);color:var(--star)}
.plist{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.plist div{display:grid;justify-items:center;gap:4px;font-weight:800;font-size:14px}
.plist .pball{--s:52px}
.plist span{color:var(--star)}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:#070920e6;display:grid;place-items:center;padding:16px}
.ovc{background:var(--panel);border:3px solid var(--mint);border-radius:30px;padding:24px;display:grid;gap:12px;justify-items:center;text-align:center;width:min(100%,440px)}
.ovc h2{color:var(--mint);font-size:clamp(24px,5.4vw,32px)}
.ovc .cnt{font-family:var(--display);font-size:56px;color:var(--star);line-height:1}
.ovc .astro{width:150px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--space-2);border:2.5px solid var(--mint);border-radius:20px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:min(calc(100% - 32px),560px);font-weight:800}

/* ======================= ANSWER PARSING ======================= */
function numOf(s){const d=String(s).replace(/[^\d]/g,'');return d?parseInt(d,10):null}
function timeOf(s){s=String(s).trim();let m=s.match(/^(\d{1,2})\s*[:.,\s]\s*(\d{1,2})/);if(m)return{h:+m[1],m:+m[2],v:+m[1]*60+ +m[2]};m=s.match(/^(\d{1,2})\s*(ч|$)/);return m?{h:+m[1],m:0,v:+m[1]*60}:null}
const hm=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
function judgeNum(pr,raw){const n=numOf(raw);if(n===null)return{type:'warn',msg:'Напиши отговора с цифри.'};
  if(n===pr.a)return{type:'ok'};return{type:'bad',msg:(pr.diag&&pr.diag[n])||null}}
function judgeTime(pr,raw){const t=timeOf(raw);if(!t)return{type:'warn',msg:'Напиши часа така: 19:20'};
  if(t.m>=60)return{type:'warn',msg:`Минутите не може да са ${t.m}! 60 минути = 1 час, премести го при часовете.`};
  if(t.v===pr.a)return{type:'ok'};return{type:'bad',msg:(pr.diag&&pr.diag[t.v])||null}}
function judgeQR(pr,q,r){const Q=numOf(q),Rr=numOf(r);if(Q===null||Rr===null)return{type:'warn',msg:'Попълни и двете кутийки.'};
  const [a,b]=pr.a;if(Q===a&&Rr===b)return{type:'ok'};
  if(Rr>=5)return{type:'bad',msg:'Остатъкът трябва да е по-малък от 5! Иначе всеки може да вземе още по един.'};
  if(Q===a)return{type:'bad',msg:'Частното е вярно! Остатък = 78 − 5 · 15.'};
  if(Q===16)return{type:'bad',msg:'5 · 16 = 80, а бонбоните са само 78.'};
  if(Q*5+Rr!==78)return{type:'bad',msg:`Провери: ${Q} · 5 + ${Rr} трябва да прави 78.`};
  return{type:'bad',msg:null}}

  if(type==='qr')ansHTML=`<div class="arow"><label class="qrl">${pr.labels[0]}<input class="ans" id="a1" inputmode="numeric" autocomplete="off"></label><label class="qrl">${pr.labels[1]}<input class="ans" id="a2" inputmode="numeric" autocomplete="off"></label><button class="btn" id="chk" style="align-self:end">Провери</button></div>`;
  if(type==='choice')ansHTML=`<div class="opts">${pr.opts.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join('')}</div>`;
  if(type==='build')ansHTML=`<div class="helper"><h3>Строй числа</h3><div class="arow" id="slots"></div><div class="arow" id="tiles"></div><div class="arow"><button class="ghost" id="addN">Запиши числото</button><button class="ghost" id="clrN">Изчисти</button></div><div><b>Намерени:</b> <span id="found">няма още</span></div></div>
    <div class="arow"><span style="font-weight:900">Колко са всичките?</span><input class="ans" id="a1" inputmode="numeric" autocomplete="off" aria-label="Колко числа"><button class="btn" id="chk">Провери</button></div>`;
  $('pcard').innerHTML=`<span class="ptag">Задача ${k+1} от 4</span>${textHTML}${ansHTML}
   <div class="fb" id="fb" hidden role="status"></div>
   <div class="acts">${pr.steps?'<button class="ghost" id="stepsBtn">Стъпка по стъпка</button>':''}<button class="ghost" id="solBtn">Покажи решението</button><button class="ghost" data-say hidden>Прочети ми</button></div>
   <div class="helper" id="stepsBox" hidden><h3>Стъпка по стъпка</h3><div id="stepsList" style="display:grid;gap:10px"></div></div>
   <div class="helper" id="solBox" hidden></div>`;
  const pa=$('pastro'),fb=$('fb');
  const sayBtn=document.querySelector('[data-say]');if(sayBtn){sayBtn.hidden=!bgVoice;sayBtn.addEventListener('click',()=>say(pr.t.replace(/·/g,' по ').replace(/:/g,' делено на ')+(pr.sub?'. '+pr.sub:'')))}
  const first=$('a1');if(first&&matchMedia('(pointer:fine)').matches)first.focus();

  function show(type,msg){fb.className='fb '+type;fb.textContent=msg;fb.hidden=false}
  function win(){if(solved)return;solved=true;const stars=used===0?3:used===1?2:1;(S.res[p.id]=S.res[p.id]||[])[k]=stars;save();
    show('ok',`${pick(['Браво','Супер','Точно така','Отлично'])}, ${who()}! ${'★'.repeat(stars)}`);sfx.ok();burst(stars*8);move(pa,'hop');
    document.querySelectorAll('#pcard input,#pcard #chk,#pcard .opt,#addN,#clrN').forEach(e=>e.disabled=true);
    const nb=document.createElement('button');nb.className='btn mint';nb.textContent=k<3?'Следваща задача →':'Към звездите →';nb.id='nextP';
    $('pcard').querySelector('.acts').prepend(nb);nb.addEventListener('click',()=>{k<3?renderProblem(pi,k+1):planetDone(pi)});nb.focus();
    renderMap();if($('solBox').hidden&&pr.why)showSol(true)}
  function lose(msg){tries++;show('bad',msg||pick([`Още не е вярно. Прочети задачата пак, ${who()}.`,'Почти! Опитай пак.','Хм, провери сметката още веднъж.']));sfx.bad();move(pa,'shake');
    if(tries>=2&&pr.steps&&$('stepsBox').hidden){const b=$('stepsBtn');if(b)b.classList.add('nudge')}}
  function check(){if(solved)return;let r;
    if(type==='num'||type==='build'){if(!$('a1').value.trim())return $('a1').focus();
      if(type==='build'){const n=numOf($('a1').value);r=n===pr.a?{type:'ok'}:n<pr.a?{type:'bad',msg:'Има още числа! Опитай да сложиш друга цифра отпред.'}:{type:'bad',msg:'Толкова не може. Помни: 0 не може да е първа цифра.'}}
      else r=judgeNum(pr,$('a1').value)}
    if(type==='time'){if(!$('a1').value.trim())return $('a1').focus();r=judgeTime(pr,$('a1').value)}
    if(type==='qr')r=judgeQR(pr,$('a1').value,$('a2').value);
    if(r.type==='ok')win();else if(r.type==='warn')show('warn',r.msg);else lose(r.msg)}
  const chk=$('chk');if(chk)chk.addEventListener('click',check);
  document.querySelectorAll('#pcard input.ans').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(solved)$('nextP').click();else if(i.id==='a1'&&$('a2')&&!$('a2').value)$('a2').focus();else check()}}));
  if(type==='choice')document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{if(solved)return;const o=+b.dataset.o;
    if(o===pr.a){b.classList.add('yes');win()}else{b.classList.add('no');lose(pr.wrong[o])}}));
  if(type==='build')initBuild(pr,()=>{$('a1').value=pr.a;win()},show);

  /* steps */
  function renderStep(){const L=$('stepsList');const st=pr.steps[stepIdx];if(!st){L.insertAdjacentHTML('beforeend',`<p style="font-weight:900;color:var(--star)">Сега напиши отговора горе! ↑</p>`);const a=$('a1');if(a)a.focus();return}
    const row=document.createElement('div');row.className='step';row.innerHTML=`<span class="q">${st.q}</span><input class="ans" inputmode="${st.time?'decimal':'numeric'}" autocomplete="off" placeholder="${st.time?'??:??':'?'}" aria-label="${st.q}"><button class="ghost">ОК</button>`;
    L.appendChild(row);const inp=row.querySelector('input'),b=row.querySelector('button');if(matchMedia('(pointer:fine)').matches)inp.focus();
    const ok=()=>{let good;if(st.time){const t=timeOf(inp.value);good=t&&t.v===st.a}else good=numOf(inp.value)===st.a;
      if(good){row.classList.add('done');inp.disabled=true;b.remove();row.insertAdjacentHTML('beforeend','<span class="ok">✓</span>');sfx.beep(660);move(pa,'hop');stepIdx++;renderStep()}
      else{inp.value='';inp.placeholder='опитай пак';sfx.bad();move(pa,'shake')}};
    b.addEventListener('click',ok);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ok()}})}
  const sb=$('stepsBtn');if(sb)sb.addEventListener('click',()=>{if(!$('stepsBox').hidden)return;used=Math.max(used,1);sb.classList.remove('nudge');sb.disabled=true;$('stepsBox').hidden=false;renderStep()});
  function showSol(afterWin){const b=$('solBox');if(!b.hidden)return;if(!afterWin)used=2;
    b.innerHTML=`<h3>Решение</h3><ol class="why">${pr.why.map(w=>`<li>${w}</li>`).join('')}</ol>${pr.vis?`<div class="vis">${pr.vis()}</div>`:''}${!afterWin?'<p style="font-weight:900;color:var(--star)">Сега напиши отговора сам, за да продължиш.</p>':''}`;b.hidden=false;
    const run=b.querySelector('[data-run]');if(run)run.addEventListener('click',()=>{const c=b.querySelector('.clk'),e=+c.dataset.end;c.querySelector('.hh').style.transform=`rotate(${e*.5}deg)`;c.querySelector('.mh').style.transform=`rotate(${e*6}deg)`;run.textContent='Край: '+hm(e);run.disabled=true});
    $('solBtn').disabled=true}
  $('solBtn').addEventListener('click',()=>showSol(false));
}

function initBuild(pr,done,show){
  let slots=[null,null,null];const found=new Set();
  function draw(){$('slots').innerHTML=slots.map((d,i)=>`<button class="opt" data-s="${i}" style="width:64px;height:64px;padding:0" aria-label="място ${i+1}">${d===null?'_':pr.digits[d]}</button>`).join('');
    $('tiles').innerHTML=pr.digits.map((d,i)=>`<button class="btn" data-t="${i}" style="width:60px;height:60px;padding:0;font-family:var(--display);font-size:28px;${slots.includes(i)?'opacity:.35':''}" ${slots.includes(i)?'disabled':''}>${d}</button>`).join('');
    document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{const i=slots.indexOf(null);if(i<0)return;slots[i]=+b.dataset.t;sfx.beep(520+i*80);draw()}));
    document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{slots[+b.dataset.s]=null;draw()}));
    $('found').textContent=found.size?[...found].join(', ')+` (${found.size})`:'няма още'}
  $('addN').addEventListener('click',()=>{if(slots.includes(null))return show('warn','Сложи цифра на всяко от трите места.');
    const s=slots.map(i=>pr.digits[i]).join('');
    if(s[0]==='0'){show('warn',`${s} започва с 0, значи е двуцифрено число (${+s}). Не става!`);sfx.bad();move($('pastro'),'shake')}
    else if(found.has(s))show('warn',`${s} вече го имаш. Опитай друго подреждане.`);
    else{found.add(s);show('ok',`Ново число: ${s}!`);sfx.beep(784);move($('pastro'),'hop')}
    slots=[null,null,null];draw();if(found.size===pr.a)setTimeout(done,500)});
  $('clrN').addEventListener('click',()=>{slots=[null,null,null];draw()});draw();
}

function planetDone(pi){const p=P[pi],res=S.res[p.id]||[],sum=res.reduce((a,b)=>a+b,0);dots(pi,-1);
  $('pcard').classList.add('done-card');
  $('pcard').innerHTML=`<span class="pball pb-${p.id}" style="--s:110px"></span><h2>${p.name} е спасен${p.id==='moon'?'а':''}!</h2><div class="bigstars">${'★'.repeat(sum)}</div><p style="font-weight:800;color:var(--muted)">${sum} звезди от тази планета. Сега ставаме прави!</p><button class="btn mint" id="toBreak">${nextLabel()} →</button>`;
  sfx.tada();burst(40);move($('pastro'),'wave');renderMap();$('toBreak').addEventListener('click',()=>go(S.stage+1));$('toBreak').focus()}

/* ---------- breaks ---------- */
function renderBreak(k){
  const b=BREAK_INFO[k];
  $('screen').innerHTML=`<section class="brk"><div class="bhead"><span class="eyebrow">Пауза за движение · ${b.dur}</span><h2>${b.title}</h2><p class="binstr">${b.instr}</p></div>
   <div class="bstage"><div class="breathc" id="bcirc" hidden></div>${astro('idle','bastro')}<div class="bright"><div class="bbig" id="bbig">${k==='breathe'?'':'Готов ли си?'}</div><div class="bsub" id="bsub">Стани прав, ${who()}!</div><div class="tbar" id="tbar" hidden><span></span></div><div class="cdots" id="cdots"></div></div></div>
   <div class="bctl"><button class="btn mint" id="bgo">Старт ▶</button><button class="ghost" id="bskip">Прескочи паузата</button></div>
   <details class="teacher"><summary>За учителя</summary><p>${b.teacher}</p></details></section>`;
  if(k==='breathe'){$('bsub').textContent='Седни удобно.';$('bcirc').hidden=false}
  const A=$('bastro');
  const u={big(h){const e=$('bbig');e.innerHTML=h;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')},
    sub(t,c=''){const e=$('bsub');e.textContent=t;e.className='bsub '+c},
    move:(c,p)=>move(A,c,p),
    bar(ms){const t=$('tbar'),s=t.querySelector('span');t.hidden=false;s.style.transition='none';s.style.width='100%';void s.offsetWidth;s.style.transition=`width ${ms}ms linear`;s.style.width='0%'},
    nobar(){$('tbar').hidden=true},dots(n){$('cdots').innerHTML=''},dot(){$('cdots').insertAdjacentHTML('beforeend','<i></i>')}};
  function finish(){S.doneB[S.stage]=true;save();renderMap();u.nobar();u.move('wave');sfx.tada();burst(30);
    u.big(k==='breathe'?'Готов!':'Браво!');u.sub(k==='breathe'?'Сега сме спокойни и готови за последната мисия.':`Седни обратно, ${who()}. Продължаваме!`);
    const g=$('bgo');g.textContent=nextLabel()+' →';g.hidden=false;g.onclick=()=>go(S.stage+1);g.focus();$('bskip').textContent='Още веднъж';$('bskip').onclick=()=>{clearAll();renderBreak(k)}}
  $('bskip').onclick=()=>{S.doneB[S.stage]=true;go(S.stage+1)};
  $('bgo').onclick=()=>{ac();$('bgo').hidden=true;RUN[k](u,finish)};
}
const countdown=u=>[[()=>{u.big('3');sfx.beep(440)},800],[()=>{u.big('2');sfx.beep(440)},800],[()=>{u.big('1');sfx.beep(440)},800]];
const RUN={
 count5(u,done){const L=[...countdown(u)];
   L.push([()=>u.sub('Скок + кажи числото!'),0]);
   for(let i=1;i<=20;i++){const n=i*5;L.push([()=>{u.big(n);u.move('hop');sfx.beep(300+n*5)},1700])}
   L.push([()=>{u.big('100!');u.sub('Сега назад по 10, с клякане!','od');u.move('wave');sfx.ok()},2800]);
   for(let n=90;n>=0;n-=10)L.push([()=>{u.big(n);u.move('squat');sfx.beep(300+n*5)},2000]);
   L.push([done,0]);seq(L)},
 evenodd(u,done){const nums=shuffle([...Array(6)].map(()=>ri(50,499)*2).concat([...Array(6)].map(()=>ri(50,499)*2+1)));
   const L=[[()=>{u.big('');u.sub('Четно → клек · Нечетно → скок')},2200],...countdown(u)];
   nums.forEach(n=>{const s=String(n);L.push([()=>{u.big(s.slice(0,-1)+`<span class="ld">${s.slice(-1)}</span>`);u.sub('Какво правиш?');u.move('idle',true);u.bar(2600)},2600]);
     L.push([()=>{const ev=n%2===0;u.nobar();u.sub(ev?'ЧЕТНО → клек!':'НЕЧЕТНО → скок!',ev?'ev':'od');u.move(ev?'squat':'hop');sfx.beep(ev?330:660)},1500])});
   L.push([done,0]);seq(L)},
 clap(u,done){const L=[...countdown(u)];
   for(let r=0;r<6;r++){const a=ri(3,9),b=ri(3,9),p=a*b,f=ri(0,2);
     const q=f===0?`${a} · ? = ${p}`:f===1?`? · ${b} = ${p}`:`${p} : ${a} = ?`,ans=f===1?a:b,full=f===0?`${a} · ${b} = ${p}`:f===1?`${a} · ${b} = ${p}`:`${p} : ${a} = ${b}`;
     L.push([()=>{u.big(q);u.sub('Изпляскай отговора!');u.dots();u.move('idle',true);u.bar(4500)},4500]);
     L.push([()=>{u.nobar();u.big(full);u.sub('Броим заедно: '+ans);for(let c=0;c<ans;c++)later(()=>{u.dot();clapSnd();u.move('clap')},c*380)},ans*380+1400])}
   L.push([()=>u.dots(),0],[done,0]);seq(L)},
 freeze(u,done){const qs=[()=>{const a=ri(6,9),b=ri(6,9);return[`${a} · ${b}`,a*b]},()=>{const a=ri(25,69),b=ri(15,29);return[`${a} + ${b}`,a+b]},()=>{const a=ri(12,48);return[`100 − ${a}`,100-a]},()=>{const a=ri(3,9),b=ri(4,9);return[`${a*b} : ${a}`,b]},()=>{const a=ri(2,9);return[`${a} · 100`,a*100]}];
   const L=[];shuffle(qs).forEach((g,i)=>{const [q,a]=g();
     L.push([()=>{u.big('Танцувай!');u.sub(S.sound?'Музиката свири…':'Танцувай, докато учителят каже „Стоп“!');u.nobar();u.move('dance',true);musicStart()},ri(4500,8000)]);
     L.push([()=>{musicStop();u.move('frozen',true);u.big('ЗАМРЪЗНИ!');u.sub('');sfx.beep(880)},1000]);
     L.push([()=>{u.big(q+' = ?');u.sub('Не мърдай! Кажи отговора на глас.');u.bar(5000)},5000]);
     L.push([()=>{u.nobar();u.big(q+' = '+a);sfx.ok()},1900])});
   L.push([()=>{u.move('idle',true)},0],[done,0]);seq(L)},
 breathe(u,done){const c=$('bcirc');const L=[];
   for(let i=0;i<4;i++){L.push([()=>{c.className='breathc in';u.move('breath',true);$('bastro').classList.add('in');u.big('Вдишай…');u.sub('1 · 2 · 3 · 4')},4000]);
     L.push([()=>{c.className='breathc hold';u.big('Задръж');u.sub('1 · 2')},2000]);
     L.push([()=>{c.className='breathc';$('bastro').classList.remove('in');u.big('Издишай');u.sub('бавно, като ракета: шшшш')},4500])}
   L.push([()=>{u.move('idle',true)},0],[done,0]);seq(L)}
};

/* ---------- SOS mini-break ---------- */
let ST=[];
function sos(){closeToast();const o=pick([{t:'Протегни се до звездите!',m:'reach',d:15},{t:'10 подскока на място — брой на глас!',m:'jump',d:15},{t:'Танцувай като робот!',m:'dance',d:15},{t:'Застани на един крак като фламинго!',m:'flamingo',d:15},{t:'Пет дълбоки вдишвания',m:'breathe',d:20},{t:'Пляскай 10 пъти и брой!',m:'clap',d:12}]);
  const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="ovc" role="dialog" aria-label="Мини-пауза"><span class="eyebrow">Мини-пауза</span><h2>${o.t}</h2>${astro('idle','sastro')}<div class="cnt" id="scnt">${o.d}</div><button class="btn mint" id="sback">Обратно към мисията</button></div>`;
  document.body.appendChild(ov);const A=$('sastro');let n=o.d;
  if(['reach','dance','flamingo'].includes(o.m))move(A,o.m,true);if(o.m==='dance')musicStart();
  let beat=0;ST.push(setInterval(()=>{beat++;if(o.m==='jump'&&beat%2===0){move(A,'hop');sfx.beep(500)}if(o.m==='clap'){move(A,'clap');clapSnd()}if(o.m==='breathe'){A.classList.add('breath');A.classList.toggle('in',Math.floor(beat/8)%2===0)}},500));
  ST.push(setInterval(()=>{n--;$('scnt').textContent=Math.max(n,0);if(n<=0){ST.forEach(clearInterval);ST=[];musicStop();$('scnt').textContent='★';move(A,'wave');sfx.tada()}},1000));
  $('sback').addEventListener('click',()=>{ST.forEach(clearInterval);ST=[];musicStop();ov.remove();focusStart=Date.now();focusPrompted=false});$('sback').focus()}
$('sosBtn').addEventListener('click',()=>{ac();sos()});
function showToast(){closeToast();const t=document.createElement('div');t.className='toast';t.id='toast';t.innerHTML=`<span>Работим вече 6 минути на тази планета. Време за мини-пауза?</span><button class="btn mint" style="font-size:16px;padding:7px 16px">Да, пауза!</button><button class="ghost">Не сега</button>`;
  document.body.appendChild(t);const [y,nn]=t.querySelectorAll('button');y.addEventListener('click',()=>{ac();sos()});nn.addEventListener('click',closeToast)}
function closeToast(){const t=$('toast');if(t)t.remove()}

/* ---------- finale ---------- */
function renderFinale(){const sum=total(),max=60;
  $('screen').innerHTML=`<section class="cert">${astro('wave','fastro')}<span class="eyebrow">Мисията е изпълнена</span><h1>Капитан ${S.name.trim()||'на мисията'}</h1>
   <p style="font-weight:800;font-size:20px">спаси 5 планети и събра <b style="color:var(--star)">${sum} звезди</b> от ${max}!</p>
   <div class="plist">${P.map(p=>{const s=(S.res[p.id]||[]).reduce((a,b)=>a+b,0);return `<div><span class="pball pb-${p.id}"></span>${p.name}<span>${s} ★</span></div>`}).join('')}</div>
   <div class="bctl" style="justify-content:center"><button class="btn" id="again">Нова мисия</button><span id="againQ" hidden>Изтриваме звездите? <button class="ghost" id="againY">Да, отначало</button></span></div></section>`;
  sfx.tada();burst(60);later(()=>burst(40),1200);
  $('again').addEventListener('click',()=>$('againQ').hidden=false);
  $('againY').addEventListener('click',()=>{S.res={};S.doneB={};save();go(0)})}

setSnd();render();
})();}
if(typeof module!=='undefined')module.exports={P,numOf,timeOf,judgeNum,judgeTime,judgeQR,hm};
