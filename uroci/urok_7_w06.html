<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Лего сейфът · 7. клас</title>
<meta name="description" content="Интерактивен урок за 7. клас в три раздела: умножение на многочлен с многочлен, събиране и изваждане на рационални числа, и формулите за съкратено умножение. С лего плочи, пудели и игри за класа." />
<!-- =====================================================================
     Лего сейфът — 7. клас
     ---------------------------------------------------------------------
     Урок ЗА ДЪСКАТА, не тест. Никъде няма поле за въвеждане на отговор:
     задачата се чете на глас, децата смятат, а отговорът се показва с
     бутон, когато преподавателят реши. Същото прави и урокът за
     седмица 2 — този върви по неговия образец.

     ТРИ РАЗДЕЛА

     1. Многочлен по многочлен — през площта на лего плоча.
     2. Събиране и изваждане на рационални числа — по числовата ос.
     3. Формулите за съкратено умножение — пак през лего квадрата.

     Всеки раздел е еднакъв по устройство: правило с картинка, решени
     примери стъпка по стъпка, задачи от лесни към трудни с показване на
     отговора, една игра за класа и бележки за преподавателя.

     Страницата не иска вход и нищо не предава: урокът не се оценява.
     Единственото, което се тегли отвън, са шрифтовете — и без тях
     всичко се чете. Снимката на пуделите е в самия сайт.
     ===================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ink:#16233F;
  --ink-soft:#55658A;
  --paper:#FFFDF7;
  --paper-raised:#FFFFFF;
  --line:#E4DCCB;
  --accent:#F7AD19;
  --accent-ink:#A1661B;
  --pink:#E88FB0;
  --pink-soft:#FDEFF4;
  --p1:#256abf;  --p1-soft:#E3EDFA;
  --p2:#eb6834;  --p2-soft:#FDE8DF;
  --ok:#1F7A4C;  --ok-soft:#E4F2EA;
  --bad:#C0392B; --bad-soft:#FBE9E7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{ box-sizing:border-box; }
/* Фонът стои само на <html>. Сложим ли го и на <body>, плътният цвят на
   body покрива .sky (z-index:-1) и снимката изчезва. */
html{ background:var(--paper); }
html,body{ margin:0; color:var(--ink); }
body{ font-family:'Nunito',system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.55; }

/* Снимката на пуделите стои най-отзад, зад плътен кремав воал: вижда се
   колкото да личи, а текстът отгоре остава със същия контраст, както
   върху чист фон. */
.sky{
  position:fixed; inset:0; z-index:-1;
  background:url('img/pudeli.png') center/cover no-repeat fixed;
}
.sky::after{ content:''; position:absolute; inset:0; background:rgba(255,253,247,0.88); }

.bar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap;
  padding:0.55rem 1rem;
  background:rgba(255,253,247,0.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.bar b{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:1.05rem; }
.bar b em{ font-style:normal; color:var(--accent-ink); }
.bar small{ color:var(--ink-soft); font-size:0.82rem; }
.bar .sp{ flex:1 1 auto; }
.pup{ width:34px; height:34px; flex:none; }

.wrap{ max-width:1000px; margin:0 auto; padding:1rem 1rem 4rem; }

/* ── разделите ───────────────────────────────────────────────── */
.tabs{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem; }
.tab{
  flex:1 1 220px; text-align:left; cursor:pointer; font:inherit;
  border:1px solid var(--line); border-radius:16px; padding:0.6rem 0.9rem;
  background:var(--paper-raised); color:var(--ink);
  display:flex; align-items:center; gap:0.6rem;
}
.tab b{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1rem; display:block; }
.tab small{ display:block; color:var(--ink-soft); font-size:0.8rem; }
.tab .brick{ width:26px; height:18px; border-radius:4px; flex:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12); background:var(--line); }
.tab[aria-selected="true"]{ border-color:var(--accent); background:#FFF7E6; box-shadow:0 6px 18px rgba(161,102,27,0.12); }
.tab:nth-child(1) .brick{ background:var(--p1); }
.tab:nth-child(2) .brick{ background:var(--p2); }
.tab:nth-child(3) .brick{ background:var(--pink); }

.card{
  background:var(--paper-raised); border:1px solid var(--line);
  border-radius:18px; padding:1rem 1.1rem; margin-bottom:1rem;
  box-shadow:0 10px 26px rgba(22,35,63,0.05);
}
h1{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(26px,5vw,38px); margin:0 0 0.3rem; line-height:1.1; }
h1 em{ font-style:normal; color:var(--accent-ink); }
h2{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.2rem; margin:1.2rem 0 0.5rem; display:flex; align-items:center; gap:0.5rem; }
h2:first-child{ margin-top:0; }
h3{ font-size:1rem; font-weight:800; margin:0 0 0.3rem; }
p{ margin:0 0 0.7rem; }
.muted{ color:var(--ink-soft); }
.small{ font-size:0.9rem; }
.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; }

.goal{
  border-left:5px solid var(--accent); background:#FFF8EA;
  border-radius:0 14px 14px 0; padding:0.7rem 0.9rem; margin-bottom:1rem;
}
.hero{ display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
.hero img{ width:230px; height:auto; border-radius:18px; border:4px solid var(--pink-soft); box-shadow:0 10px 24px rgba(232,143,176,.25); }
.hero .t{ flex:1 1 260px; min-width:0; }

.btn{
  font:inherit; font-weight:800; cursor:pointer;
  border:1px solid transparent; border-radius:999px;
  padding:0.45rem 1rem; min-height:40px;
  background:var(--accent); color:var(--ink);
}
.btn:hover{ transform:translateY(-1px); }
.btn.ghost{ background:transparent; border-color:var(--line); }
.btn.ghost:hover{ background:#FFF6E4; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }
.row{ display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }

/* ── правилото ───────────────────────────────────────────────── */
.rule{ background:var(--p1-soft); border:1px solid #C9DAF2; border-radius:14px; padding:0.8rem 0.9rem; }
.rule .mono{ font-size:1.05rem; font-weight:700; }
.rule.pinkish{ background:var(--pink-soft); border-color:#F3D3E0; }
.rule.warm{ background:var(--p2-soft); border-color:#F6CDBA; }

/* ── примерът стъпка по стъпка ───────────────────────────────── */
.steps{ list-style:none; margin:0.6rem 0 0; padding:0; }
.steps li{
  display:flex; gap:0.6rem; align-items:flex-start;
  padding:0.4rem 0; border-top:1px dashed var(--line);
  font-family:'JetBrains Mono',monospace; font-size:1rem;
}
.steps li:first-child{ border-top:0; }
.steps li.hid{ display:none; }
.steps .n{ width:24px; height:24px; flex:none; border-radius:7px; background:var(--accent);
  display:grid; place-items:center; font-size:0.78rem; font-weight:700; font-family:'Nunito',sans-serif; }
.steps li.fin{ font-weight:700; color:var(--ok); }
.steps li.fin .n{ background:var(--ok); color:#fff; }

/* ── задачите ────────────────────────────────────────────────── */
.tasks{ display:grid; gap:0.6rem; }
@media (min-width:760px){ .tasks{ grid-template-columns:1fr 1fr; } }
.task{ border:1px solid var(--line); border-radius:14px; padding:0.7rem 0.8rem; background:var(--paper); }
.task .top{ display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem; }
.task .n{ font-size:0.78rem; font-weight:800; color:var(--ink-soft); letter-spacing:.04em; text-transform:uppercase; }
.lvl{ font-size:0.7rem; font-weight:800; border-radius:999px; padding:0.1rem 0.5rem; }
.lvl.l1{ background:var(--ok-soft); color:var(--ok); }
.lvl.l2{ background:#FFF1D6; color:var(--accent-ink); }
.lvl.l3{ background:var(--bad-soft); color:var(--bad); }
.lvl.l4{ background:#EDE6FB; color:#5B3FA8; }
.task .q{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.08rem; margin:0.2rem 0 0.5rem; }
.task .a{ background:var(--ok-soft); border-radius:10px; padding:0.5rem 0.7rem; margin-top:0.5rem; }
.task .a .mono{ font-weight:700; }
.task .a .why{ display:block; font-family:'Nunito',sans-serif; font-weight:600; font-size:0.88rem; color:var(--ink-soft); margin-top:0.25rem; white-space:pre-line; }

/* ── лего плочата ────────────────────────────────────────────── */
.lego{ display:block; width:100%; max-width:430px; height:auto; margin:0.6rem 0 0.2rem; }
.lg-cell{ fill:#FDF0D6; stroke:var(--accent-ink); stroke-width:1.5; }
.lg-cell.b{ fill:var(--p1-soft); }
.lg-cell.c{ fill:var(--pink-soft); }
.lg-stud{ fill:#F3DFB4; stroke:var(--accent-ink); stroke-width:1; }
.lg-txt{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; fill:var(--ink); }
.lg-side{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; fill:var(--accent-ink); }

/* ── числовата ос ────────────────────────────────────────────── */
.nline{ display:block; width:100%; max-width:620px; height:auto; margin:0.5rem 0; }
.nl-axis{ stroke:var(--ink-soft); stroke-width:1.6; }
.nl-arrow{ fill:var(--ink-soft); }
.nl-tick{ stroke:var(--ink-soft); stroke-width:1.2; }
.nl-tick.z{ stroke:var(--ink); stroke-width:2.4; }
.nl-num{ font-family:'JetBrains Mono',monospace; font-size:12px; fill:var(--ink-soft); }
.nl-hop{ stroke:var(--p2); stroke-width:2.5; fill:none; stroke-linecap:round; }
.nl-hop.back{ stroke:var(--p1); }
.nl-lab{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; fill:var(--ink); }

/* ── игрите ──────────────────────────────────────────────────── */
.game{ border:1px solid var(--line); border-radius:16px; padding:0.9rem; background:linear-gradient(#FFFDF7,#FFF4DF); }
.lanes{ display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; align-items:end; }
.lane{ text-align:center; }
.target{ height:74px; border-radius:14px; border:2px dashed var(--line); display:grid; place-items:center;
  background:var(--paper-raised); margin-bottom:0.4rem; }
.target.lit{ border-style:solid; }
.lane.a .target.lit{ background:var(--p1-soft); border-color:var(--p1); }
.lane.b .target.lit{ background:var(--p2-soft); border-color:var(--p2); }
.target i{ width:70px; height:30px; border-radius:7px; display:block; opacity:0; }
.target.lit i{ opacity:1; }
.lane.a .target i{ background:var(--p1); }
.lane.b .target i{ background:var(--p2); }
.tower{ display:flex; flex-direction:column-reverse; align-items:center; gap:3px; min-height:54px; }
.tbrick{ width:70px; height:15px; border-radius:4px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.12); }
.lane.a .tbrick{ background:var(--p1); }
.lane.b .tbrick{ background:var(--p2); }
.rider{ width:50px; height:50px; margin-bottom:-4px; }
.clock{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.25rem; }
.score{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:1.4rem; }
.fb{ font-weight:800; min-height:1.5rem; margin-top:0.5rem; }
.fb.ok{ color:var(--ok); } .fb.bad{ color:var(--bad); }
.tf-q{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.2rem; margin:0.4rem 0 0.6rem; }

/* ── ключалката ──────────────────────────────────────────────── */
.lock{ display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; margin:0.6rem 0; }
.dial{ text-align:center; }
.dial .num{ width:54px; height:64px; border-radius:12px; border:2px solid var(--ink); background:var(--ink);
  color:#FFF6E4; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.7rem;
  display:grid; place-items:center; }
.dial button{ width:54px; min-height:30px; margin:0.2rem 0; padding:0; border:1px solid var(--line);
  border-radius:8px; background:var(--paper-raised); font:inherit; font-weight:800; cursor:pointer; }
.hintrow{ display:flex; gap:0.5rem; align-items:baseline; font-size:0.93rem; margin-bottom:0.25rem; }
.hintrow b{ font-family:'JetBrains Mono',monospace; color:var(--accent-ink); }

/* ── бележките ───────────────────────────────────────────────── */
.notes{ background:var(--pink-soft); border:1px solid #F3D3E0; border-radius:14px; padding:0.8rem 0.9rem; }
.notes ul{ margin:0.3rem 0 0; padding-left:1.1rem; }
.notes li{ margin-bottom:0.35rem; }
.page-legal{ text-align:center; color:var(--ink-soft); font-size:0.8rem; margin:2rem 0 1rem; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<header class="bar">
  <svg class="pup" data-poodle="1" aria-hidden="true"></svg>
  <b>Лего <em>сейфът</em></b>
  <small>7. клас · три раздела за дъската</small>
  <span class="sp"></span>
  <small class="mono" id="barTab"></small>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="panels"></main>
  <p class="page-legal">© 2026 The Light Academy</p>
</div>

<script>
/* ===================================================================
   Съдържанието на трите раздела
   -------------------------------------------------------------------
   Урокът е за дъската: `a` е отговорът, който се ПОКАЗВА с бутон, а
   `why` е краткото обяснение под него. Никъде няма поле за писане.
   =================================================================== */
var TOPICS = [
{
  id:'mn',
  tab:{ b:'Многочлен · многочлен', s:'умножение, лего плочи' },
  goal:'Докрая на раздела всеки трябва да може да умножи скоба по скоба и да каже '
      +'защо нито едно парче не бива да остане неумножено.',
  hero:true,
  rule:'<p><b>Всеки член</b> на първата скоба умножава <b>всеки член</b> на втората.</p>'
      +'<p class="mono">(a + b)(c + d) = ac + ad + bc + bd</p>'
      +'<p class="small muted">Четири произведения — точно толкова, колкото са парчетата на лего плочата отдолу.</p>',
  lego:[
    { rows:['3x'], cols:['2x','5'], cells:[['6x²','15x']],
      cap:'3x · (2x + 5) — плоча с две парчета. Страните са множителите, парчетата са произведенията.' },
    { rows:['x','4'], cols:['x','2'], cells:[['x²','2x'],['4x','8']],
      cap:'(x + 4)(x + 2) — плоча 2 на 2. Двете средни парчета са подобни членове: 2x + 4x = 6x.' }
  ],
  examples:[
    { expr:'3x · (2x + 5)', steps:['3x · 2x = 6x²','3x · 5 = 15x'], answer:'6x² + 15x' },
    { expr:'(x + 4)(x + 2)', steps:['x · x = x²','x · 2 = 2x','4 · x = 4x','4 · 2 = 8','2x + 4x = 6x'],
      answer:'x² + 6x + 8' },
    { expr:'(2a − 3)(a + 4)', steps:['2a · a = 2a²','2a · 4 = 8a','(−3) · a = −3a','(−3) · 4 = −12','8a − 3a = 5a'],
      answer:'2a² + 5a − 12' }
  ],
  tasks:[
    { q:'4x · (x + 3)', a:'4x² + 12x', lvl:1, why:'4x · x = 4x², после 4x · 3 = 12x.' },
    { q:'−3a · (2a − 5)', a:'−6a² + 15a', lvl:1, why:'Минус по минус дава плюс: (−3a) · (−5) = +15a.' },
    { q:'5x² · (2x³ − x + 1)', a:'10x⁵ − 5x³ + 5x²', lvl:2, why:'При степени с равни основи показателите се събират: x² · x³ = x⁵.' },
    { q:'(x + 2)(x + 5)', a:'x² + 7x + 10', lvl:1, why:'Четири произведения; средните два са подобни: 5x + 2x = 7x.' },
    { q:'(3x − 2y)(2x + y)', a:'6x² − xy − 2y²', lvl:2, why:'3xy − 4xy = −xy — внимавайте със знака.' },
    { q:'(x + 1)(x² − 3x + 2)', a:'x³ − 2x² − x + 2', lvl:3, why:'Шест произведения: първо x по всичко, после 1 по всичко.' },
    { q:'(2x − 1)(x + 3) − x(x − 5)', a:'x² + 10x − 3', lvl:3,
      why:'(2x − 1)(x + 3) = 2x² + 5x − 3, а x(x − 5) = x² − 5x.\nМинусът пред втората скоба обръща знаците ѝ.' },
    { q:'?  ·  (2x − 3)  =  10x² − 15x', a:'5x', lvl:3, why:'5x · 2x = 10x² и 5x · (−3) = −15x — и двата члена излизат.' },
    { q:'(x + 3)(x − 3)(x + 1)', a:'x³ + x² − 9x − 9', lvl:4,
      why:'Първо двете еднакви скоби: (x + 3)(x − 3) = x² − 9.\nОстава (x² − 9)(x + 1).' },
    { q:'(2a − b)(a + 3b) + (a + b)(a − 2b)', a:'3a² + 4ab − 5b²', lvl:4,
      why:'Първата скоба дава 2a² + 5ab − 3b², втората a² − ab − 2b².\nСъбираме подобните: 2a² + a² = 3a², 5ab − ab = 4ab, −3b² − 2b² = −5b².' },
    { q:'(x² + 2x − 1)(x² − x + 3)', a:'x⁴ + x³ + 7x − 3', lvl:4,
      why:'Девет произведения. Членовете с x² се унищожават: 3x² − 2x² − x² = 0 — затова в отговора няма x².' },
    { q:'Опростете: (x + 2)(x + 5) − (x + 1)(x + 6)', a:'4', lvl:4,
      why:'x² + 7x + 10 − (x² + 7x + 6). Всичко с x си отива и остава само число.' },
    { q:'Кой е коефициентът пред x² в (x + 1)(x − 2)(x + 4)?', a:'3', lvl:4,
      why:'Членът с x² се получава, като вземем x от две скоби и числото от третата: 1 − 2 + 4 = 3.\nЦелият многочлен е x³ + 3x² − 6x − 8.' }
  ],
  game:'duel',
  lock:[
    { d:7, q:'Коефициентът пред x в отговора на задача 4' },
    { d:4, q:'Колко члена има отговорът на задача 6' },
    { d:1, q:'Коефициентът пред xy в задача 5, без знака' },
    { d:3, q:'Свободният член в задача 7, без знака' }
  ],
  notes:[
    'Първата плоча я нарисувайте на дъската заедно — после децата сами ще я чертаят настрани, когато се объркат.',
    'Най-честата грешка е „забравеното парче“: (x + 4)(x + 2) = x² + 8. Питайте колко парчета има плочата.',
    'Задача 8 е наопаки — дайте я на по-бързите, докато другите довършват 7.',
    'Домашното към този раздел е „Многочлен · многочлен — ниво 2“ (homework_7_w06b).',
    'Задачи 9–13 са за най-бързите: три скоби, събиране на два многочлена и две, в които половината членове се унищожават — точно това ги изненадва най-много.'
  ]
},
{
  id:'rac',
  tab:{ b:'Рационални числа ±', s:'събиране и изваждане с минус' },
  goal:'Знакът не е украса: той казва накъде се върви по числовата ос. Целта е децата да спрат '
      +'да гадаят и да започнат да виждат посоката.',
  rule:'<p><b>Плюс</b> значи надясно, <b>минус</b> — наляво. Изваждането на отрицателно число е '
      +'крачка надясно: <span class="mono">a − (−b) = a + b</span>.</p>'
      +'<p class="small muted">Затова разстоянието между две числа никога не е отрицателно.</p>',
  hops:[

<script>
/* ===================================================================
   Рисунки, подредба и игрите
   =================================================================== */
(function(){
  'use strict';

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function el(tag, cls, html){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(html != null) n.innerHTML = html;
    return n;
  }
  var LVL = { 1:'лесно', 2:'средно', 3:'трудно', 4:'за най-смелите' };

  /* ── пудел ────────────────────────────────────────────────────── */
  function poodle(coat, bow){
    coat = coat || '#F0D9AE';
    var dark = '#D8BC8A', ink = '#3A2A1A';
    var s = '';
    s += '<circle cx="14" cy="31" r="9.5" fill="' + dark + '"/>';
    s += '<circle cx="50" cy="31" r="9.5" fill="' + dark + '"/>';
    s += '<circle cx="32" cy="12" r="9" fill="' + coat + '"/>';
    s += '<circle cx="32" cy="31" r="15" fill="' + coat + '"/>';
    s += '<ellipse cx="32" cy="39" rx="9.5" ry="7.5" fill="#FFF3E0"/>';
    s += '<ellipse cx="32" cy="34.5" rx="3.4" ry="2.5" fill="' + ink + '"/>';
    s += '<circle cx="25.5" cy="28" r="2.3" fill="' + ink + '"/>';
    s += '<circle cx="38.5" cy="28" r="2.3" fill="' + ink + '"/>';
    s += '<circle cx="26.4" cy="27.2" r="0.8" fill="#fff"/>';
    s += '<circle cx="39.4" cy="27.2" r="0.8" fill="#fff"/>';
    s += '<path d="M27 41.5q5 4 10 0" stroke="' + ink + '" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    if(bow){
      s += '<path d="M44 16l6-4v8z" fill="' + bow + '"/>';
      s += '<path d="M44 16l-6-4v8z" fill="' + bow + '"/>';
      s += '<circle cx="44" cy="16" r="2" fill="' + bow + '"/>';
    }
    return s;
  }
  function fillPoodles(root){
    var list = root.querySelectorAll('[data-poodle]');
    for(var i = 0; i < list.length; i++){
      var n = list[i];
      n.setAttribute('viewBox', '0 0 64 64');
      n.innerHTML = poodle(n.getAttribute('data-coat'), n.getAttribute('data-bow'));
    }
  }

  /* ── лего плоча: страните са множителите, парчетата — произведенията ── */
  function legoSvg(spec){
    var CW = 112, CH = 66, LX = 44, TY = 28, PAD = 6;
    var rows = spec.rows, cols = spec.cols;
    var W = LX + cols.length * CW + PAD;
    var H = TY + rows.length * CH + PAD;
    var s = '<svg class="lego" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="'
          + esc(spec.cap) + '">';
    var i, j, x, y, k;
    for(j = 0; j < cols.length; j++){
      s += '<text class="lg-side" x="' + (LX + j * CW + CW / 2) + '" y="18" text-anchor="middle">'
         + esc(cols[j]) + '</text>';
    }
    for(i = 0; i < rows.length; i++){
      s += '<text class="lg-side" x="' + (LX - 10) + '" y="' + (TY + i * CH + CH / 2 + 5)
         + '" text-anchor="end">' + esc(rows[i]) + '</text>';
    }
    for(i = 0; i < rows.length; i++){
      for(j = 0; j < cols.length; j++){
        x = LX + j * CW; y = TY + i * CH;
        var cls = 'lg-cell' + ((i + j) % 2 ? ' b' : (i === j ? ' c' : ''));
        s += '<rect class="' + cls + '" x="' + (x + 2) + '" y="' + (y + 2) + '" width="' + (CW - 4)
           + '" height="' + (CH - 4) + '" rx="7"/>';
        for(k = 0; k < 3; k++){
          s += '<circle class="lg-stud" cx="' + (x + 24 + k * 32) + '" cy="' + (y + 13) + '" r="7"/>';
        }
        s += '<text class="lg-txt" x="' + (x + CW / 2) + '" y="' + (y + CH - 15)
           + '" text-anchor="middle">' + esc(spec.cells[i][j]) + '</text>';
      }
    }
    return s + '</svg>';
  }
  function legoBlock(spec){
    var w = el('div', 'legowrap', legoSvg(spec));
    w.appendChild(el('p', 'small muted', esc(spec.cap)));
    return w;
  }

  /* ── числова ос със скокове ───────────────────────────────────── */
  /* В целия урок минусът е типографски „−“, не тире — и по оста, и в игрите. */
  function num(v){ return String(v).replace('.', ',').replace(/^-/, '\u2212'); }
  function nlineSvg(o){
    var W = 620, H = 150, PAD = 30, AY = 110;
    var lo = o.lo, hi = o.hi, span = hi - lo;
    function X(v){ return PAD + (v - lo) / span * (W - 2 * PAD); }
    var s = '<svg class="nline" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="'
          + esc(o.cap || 'числова ос') + '">';
    s += '<line class="nl-axis" x1="' + (PAD - 14) + '" y1="' + AY + '" x2="' + (W - PAD + 14)
       + '" y2="' + AY + '"/>';
    s += '<path class="nl-arrow" d="M' + (W - PAD + 14) + ' ' + AY + 'l-9-4.5v9z"/>';
    s += '<path class="nl-arrow" d="M' + (PAD - 14) + ' ' + AY + 'l9-4.5v9z"/>';
    var step = span > 18 ? 2 : 1, v;
    for(v = Math.ceil(lo); v <= hi; v++){
      var zero = (v === 0);
      s += '<line class="nl-tick' + (zero ? ' z' : '') + '" x1="' + X(v) + '" y1="' + (AY - (zero ? 9 : 6))
         + '" x2="' + X(v) + '" y2="' + (AY + (zero ? 9 : 6)) + '"/>';
      if(zero || v % step === 0){
        s += '<text class="nl-num" x="' + X(v) + '" y="' + (AY + 24) + '" text-anchor="middle">'
           + num(v) + '</text>';
      }
    }
    var hops = o.hops || [];
    for(var i = 0; i < hops.length; i++){
      /* Контролната точка е двойно по-високо от върха на дъгата, затова
         етикетът се слага на сметнатия връх, а не на контролната точка. */
      var h = hops[i], x1 = X(h.from), x2 = X(h.to);
      var base = AY - 8, ctrl = base - 76 - i * 56, apex = (base + ctrl) / 2;
      s += '<path class="nl-hop' + (h.to < h.from ? ' back' : '') + '" d="M' + x1 + ' ' + base
         + 'Q' + ((x1 + x2) / 2) + ' ' + ctrl + ' ' + x2 + ' ' + base + '"/>';
      s += '<text class="nl-lab" x="' + ((x1 + x2) / 2) + '" y="' + (apex - 7)
         + '" text-anchor="middle">' + esc(h.lab) + '</text>';
      s += '<circle cx="' + x2 + '" cy="' + (AY - 8) + '" r="4.5" fill="var(--p2)"/>';
    }
    if(o.start != null){
      s += '<circle cx="' + X(o.start) + '" cy="' + (AY - 8) + '" r="5.5" fill="var(--ink)"/>';
    }
    return s + '</svg>';
  }
  function nlineBlock(o){
    var w = el('div', null, nlineSvg(o));
    if(o.cap) w.appendChild(el('p', 'small muted', esc(o.cap)));
    return w;
  }

  /* ── примерът стъпка по стъпка ────────────────────────────────── */
  function exampleBlock(ex){
    var box = el('div', 'rule warm');
    box.appendChild(el('p', 'mono', esc(ex.expr) + ' = ?'));
    var ol = el('ol', 'steps');
    var i;
    for(i = 0; i < ex.steps.length; i++){
      var li = el('li', 'hid', '<span class="n">' + (i + 1) + '</span><span>' + esc(ex.steps[i]) + '</span>');
      ol.appendChild(li);
    }
    var fin = el('li', 'hid fin', '<span class="n">=</span><span>' + esc(ex.expr) + ' = ' + esc(ex.answer) + '</span>');
    ol.appendChild(fin);
    box.appendChild(ol);

    var row = el('div', 'row');
    var bNext = el('button', 'btn ghost', 'Следваща стъпка');
    var bAll  = el('button', 'btn ghost', 'Покажи всичко');
    var bHide = el('button', 'btn ghost', 'Отначало');
    row.appendChild(bNext); row.appendChild(bAll); row.appendChild(bHide);
    box.appendChild(row);

    var items = ol.querySelectorAll('li');
    function shown(){
      var n = 0;
      for(var i = 0; i < items.length; i++){ if(!items[i].classList.contains('hid')) n++; }
      return n;
    }
    function sync(){ bNext.disabled = shown() >= items.length; }
    bNext.addEventListener('click', function(){
      var k = shown();
      if(k < items.length) items[k].classList.remove('hid');
      sync();
    });
    bAll.addEventListener('click', function(){
      for(var i = 0; i < items.length; i++) items[i].classList.remove('hid');
      sync();
    });
    bHide.addEventListener('click', function(){
      for(var i = 0; i < items.length; i++) items[i].classList.add('hid');
      sync();
    });
    sync();
    return box;
  }

  /* ── задачите: отговорът се ПОКАЗВА, не се въвежда ────────────── */
  function taskBlock(t, i){
    var d = el('div', 'task');
    d.appendChild(el('div', 'top',
      '<span class="n">Задача ' + (i + 1) + '</span><span class="lvl l' + t.lvl + '">' + LVL[t.lvl] + '</span>'));
    d.appendChild(el('div', 'q', esc(t.q)));
    var btn = el('button', 'btn ghost', 'Отговор');
    var ans = el('div', 'a', '<span class="mono">= ' + esc(t.a) + '</span><span class="why">'
      + esc(t.why) + '</span>');
    ans.hidden = true;
    btn.addEventListener('click', function(){
      ans.hidden = !ans.hidden;
      btn.textContent = ans.hidden ? 'Отговор' : 'Скрий';
    });
    d.appendChild(btn);
    d.appendChild(ans);
    d.__show = function(on){
      ans.hidden = !on;
      btn.textContent = on ? 'Скрий' : 'Отговор';
    };
    return d;
  }

  /* ── игра 1: лего дуел (реакция, две деца на една клавиатура) ──── */
  function duelGame(){
    var g = el('div', 'game');
    g.innerHTML =
      '<h3>Лего дуел · почивка за две деца</h3>'

      + 'на таблет. Всяко попадение е още една тухличка. Грешен натиск сваля една. 60 секунди.</p>'

      +   '<div class="lane a"><div class="target"><i></i></div>'
      +     '<div class="tower"></div><svg class="rider" data-poodle="1" data-coat="#F0D9AE" data-bow="#256abf"></svg>'
      +     '<p class="score">0</p><button class="btn ghost" data-tap="a">клавиш F</button></div>'
      +   '<div class="lane b"><div class="target"><i></i></div>'
      +     '<div class="tower"></div><svg class="rider" data-poodle="1" data-coat="#E8C79A" data-bow="#eb6834"></svg>'
      +     '<p class="score">0</p><button class="btn ghost" data-tap="b">клавиш J</button></div>'
      + '</div>'
      + '<div class="row" style="justify-content:center;margin-top:0.7rem">'
      +   '<button class="btn" data-go>Старт</button><span class="clock">60</span></div>'
      + '<p class="fb" data-fb></p>';
    fillPoodles(g);

    var lanes = { a: g.querySelector('.lane.a'), b: g.querySelector('.lane.b') };
    var clock = g.querySelector('.clock'), fb = g.querySelector('[data-fb]');
    var go = g.querySelector('[data-go]');
    var pts = { a:0, b:0 }, lit = null, running = false, left = 60, tTick = 0, tLight = 0;

    function paint(k){
      lanes[k].querySelector('.score').textContent = pts[k];
      var tower = lanes[k].querySelector('.tower');
      tower.innerHTML = '';
      for(var i = 0; i < Math.min(pts[k], 7); i++) tower.appendChild(el('span', 'tbrick'));
    }
    function dark(){
      lanes.a.querySelector('.target').classList.remove('lit');
      lanes.b.querySelector('.target').classList.remove('lit');
      lit = null;
    }
    function light(){
      if(!running) return;
      var k = Math.random() < 0.5 ? 'a' : 'b';
      lit = k;
      lanes[k].querySelector('.target').classList.add('lit');
      tLight = setTimeout(function(){ dark(); tLight = setTimeout(light, 300 + Math.random() * 700); }, 900);
    }
    function hit(k){
      if(!running) return;
      if(lit === k){
        pts[k]++; paint(k); dark();
        clearTimeout(tLight);
        tLight = setTimeout(light, 300 + Math.random() * 700);
        fb.className = 'fb ok'; fb.textContent = 'Тухличка за ' + (k === 'a' ? 'син' : 'оранжев') + '!';
      } else {
        pts[k] = Math.max(0, pts[k] - 1); paint(k);
        fb.className = 'fb bad'; fb.textContent = 'Рано! Плочката не светеше.';
      }
    }
    function stop(){
      running = false; dark();
      clearTimeout(tLight); clearInterval(tTick);
      go.disabled = false; go.textContent = 'Още веднъж';
      fb.className = 'fb';
      fb.textContent = pts.a === pts.b ? 'Равенство — по ' + pts.a + ' тухлички.'
        : (pts.a > pts.b ? 'Синият пудел строи по-висока кула: ' : 'Оранжевият пудел строи по-висока кула: ')
          + Math.max(pts.a, pts.b) + ' : ' + Math.min(pts.a, pts.b);
    }
    go.addEventListener('click', function(){
      pts.a = 0; pts.b = 0; paint('a'); paint('b');
      left = 60; clock.textContent = left;
      running = true; go.disabled = true; go.textContent = 'Тече…';
      fb.className = 'fb'; fb.textContent = '';
      clearInterval(tTick);
      tTick = setInterval(function(){
        left--; clock.textContent = left;
        if(left <= 0) stop();
      }, 1000);
      clearTimeout(tLight);
      tLight = setTimeout(light, 600);
    });
    g.addEventListener('click', function(e){
      var b = e.target.closest('[data-tap]');
      if(b) hit(b.getAttribute('data-tap'));
    });
    document.addEventListener('keydown', function(e){
      if(!running || !g.isConnected || g.closest('[hidden]')) return;
      var k = (e.key || '').toLowerCase();
      if(k === 'f' || k === 'а') hit('a');
      if(k === 'j' || k === 'о') hit('b');
    });
    return g;
  }

  /* ── игра 2: пуделски скок по числовата ос ────────────────────── */
  function hopGame(){
    var g = el('div', 'game');
    g.innerHTML =
      '<h3>Пуделски скок · почивка на числовата ос</h3>'
      + '<p class="small muted">Класът казва на глас къде ще се приземи пуделът. Чак тогава натискате „Скочи“.</p>'
      + '<p class="tf-q" data-card></p><div data-line></div>'
      + '<div class="row"><button class="btn" data-jump>Скочи</button>'
      +   '<button class="btn ghost" data-next>Нова карта</button></div>'
      + '<p class="fb" data-fb></p>';
    var card = g.querySelector('[data-card]'), line = g.querySelector('[data-line]');
    var fb = g.querySelector('[data-fb]'), bJump = g.querySelector('[data-jump]');
    var i = -1, cur = null;

    function draw(withHop){
      var hops = [];
      if(withHop){
        hops.push({ from:cur.from, to:cur.from + cur.add, lab:(cur.add > 0 ? '+' : '−') + Math.abs(cur.add) });
      }
      line.innerHTML = nlineSvg({ lo:-10, hi:10, start:cur.from, hops:hops, cap:cur.txt });
    }
    function next(){
      i = (i + 1) % HOPS.length;
      cur = HOPS[i];
      card.textContent = cur.txt;
      fb.className = 'fb'; fb.textContent = '';
      bJump.disabled = false;
      draw(false);
    }
    bJump.addEventListener('click', function(){
      draw(true);
      bJump.disabled = true;
      var r = cur.from + cur.add;
      fb.className = 'fb ok';
      fb.textContent = '(' + num(cur.from) + ') ' + (cur.add > 0 ? '+ ' : '− ') + Math.abs(cur.add)
        + ' = ' + num(r) + '  ·  пуделът спира на ' + num(r);
    });
    g.querySelector('[data-next]').addEventListener('click', next);
    next();
    return g;
  }

  /* ── игра 3: вярно или грешно за формулите ────────────────────── */
  function tfGame(){
    var g = el('div', 'game');
    g.innerHTML =
      '<h3>Вярно или грешно · почивка с формулите</h3>'
      + '<p class="small muted">Четете на глас, класът вдига ръка, после натискате отговора на класа.</p>'
      + '<p class="tf-q" data-q></p>'
      + '<div class="row"><button class="btn" data-v="1">Вярно</button>'
      +   '<button class="btn ghost" data-v="0">Грешно</button>'
      +   '<button class="btn ghost" data-next>Следваща</button>'
      +   '<span class="score" data-sc>0 / 0</span></div>'
      + '<p class="fb" data-fb></p>';
    var q = g.querySelector('[data-q]'), fb = g.querySelector('[data-fb]'), sc = g.querySelector('[data-sc]');
    var i = -1, done = 0, ok = 0, locked = false;

    function next(){
      i = (i + 1) % TF.length;
      q.textContent = TF[i][0];
      fb.className = 'fb'; fb.textContent = '';
      locked = false;
    }
    g.addEventListener('click', function(e){
      var b = e.target.closest('[data-v]');
      if(!b || locked) return;
      locked = true; done++;
      var right = (b.getAttribute('data-v') === '1') === TF[i][1];
      if(right) ok++;
      sc.textContent = ok + ' / ' + done;
      fb.className = 'fb ' + (right ? 'ok' : 'bad');
      fb.textContent = (right ? '✓ Позна! ' : '✗ Не. ') + TF[i][2];
    });
    g.querySelector('[data-next]').addEventListener('click', next);
    next();
    return g;
  }

  /* ── лего сейфът: четири циферблата, нищо за писане ───────────── */
  function lockBlock(spec){
    var g = el('div', 'game');
    var hints = '';
    for(var i = 0; i < spec.length; i++){
      hints += '<div class="hintrow"><b>' + (i + 1) + '.</b><span>' + esc(spec[i].q) + '</span></div>';
    }
    var dials = '';
    for(i = 0; i < spec.length; i++){
      dials += '<div class="dial"><button data-up="' + i + '" aria-label="нагоре">▲</button>'
             + '<div class="num" data-num="' + i + '">0</div>'
             + '<button data-dn="' + i + '" aria-label="надолу">▼</button></div>';
    }
    g.innerHTML =
      '<h3>Лего сейфът · четири ключалки</h3>'
      + '<p class="small muted">Отговорите на задачите дават кода. Нищо не се пише — само се върти.</p>'
      + hints + '<div class="lock">' + dials + '</div>'
      + '<div class="row" style="justify-content:center"><button class="btn" data-open>Опитай сейфа</button>'
      +   '<button class="btn ghost" data-reset>Нулирай</button></div>'
      + '<p class="fb" data-fb></p>';
    var val = [0, 0, 0, 0], fb = g.querySelector('[data-fb]');
    function show(k){ g.querySelector('[data-num="' + k + '"]').textContent = val[k]; }
    g.addEventListener('click', function(e){
      var up = e.target.closest('[data-up]'), dn = e.target.closest('[data-dn]');
      var k;
      if(up){ k = +up.getAttribute('data-up'); val[k] = (val[k] + 1) % 10; show(k); }
      if(dn){ k = +dn.getAttribute('data-dn'); val[k] = (val[k] + 9) % 10; show(k); }
    });
    g.querySelector('[data-open]').addEventListener('click', function(){
      var bad = 0;
      for(var i = 0; i < spec.length; i++){ if(val[i] !== spec[i].d) bad++; }
      if(bad === 0){
        fb.className = 'fb ok';
        fb.textContent = '🔓 Сейфът се отвори! Вътре има кутия лего и три пудела.';
      } else {
        fb.className = 'fb bad';
        fb.textContent = bad === 1 ? 'Една ключалка не пасва — проверете коя задача сте пропуснали.'
          : bad + ' ключалки още не пасват.';
      }
    });
    g.querySelector('[data-reset]').addEventListener('click', function(){
      for(var i = 0; i < 4; i++){ val[i] = 0; show(i); }
      fb.className = 'fb'; fb.textContent = '';
    });
    return g;
  }

  /* ── подредбата на един раздел ────────────────────────────────── */
  function buildPanel(t, idx){
    var p = el('section', null, '');
    p.id = 'p-' + t.id;
    p.setAttribute('role', 'tabpanel');

    var head = el('div', 'card');
    if(t.hero){
      head.innerHTML =
        '<div class="hero"><img src="img/pudeli.png" alt="Трите пудела на класа в розовото им легло" '
        + 'width="467" height="428" loading="lazy">'
        + '<div class="t"><h1>Лего <em>сейфът</em></h1>'
        + '<p class="muted">Многочлени, рационални числа и формулите за съкратено умножение — '
        + 'с лего плочи, числова ос и три пудела, които гледат отстрани.</p></div></div>';
    } else {
      head.innerHTML = '<h1>' + esc(t.tab.b) + '</h1>';
    }
    head.appendChild(el('div', 'goal', '<b>Целта на часа:</b> ' + esc(t.goal)));
    head.appendChild(el('div', 'rule' + (t.id === 'form' ? ' pinkish' : ''), t.rule));
    var k;
    if(t.lego){ for(k = 0; k < t.lego.length; k++) head.appendChild(legoBlock(t.lego[k])); }
    if(t.hops){ for(k = 0; k < t.hops.length; k++) head.appendChild(nlineBlock(t.hops[k])); }
    p.appendChild(head);

    var ex = el('div', 'card');
    ex.appendChild(el('h2', null, '<span>📐</span> На дъската, стъпка по стъпка'));
    for(k = 0; k < t.examples.length; k++) ex.appendChild(exampleBlock(t.examples[k]));
    p.appendChild(ex);

    var tk = el('div', 'card');
    tk.appendChild(el('h2', null, '<span>🧱</span> Задачи — от лесни към по-сложни'));
    var bar = el('div', 'row');
    var bAll = el('button', 'btn ghost', 'Покажи всички отговори');
    var bNone = el('button', 'btn ghost', 'Скрий всички');
    bar.appendChild(bAll); bar.appendChild(bNone);
    tk.appendChild(bar);
    var list = el('div', 'tasks');
    var cards = [];
    for(k = 0; k < t.tasks.length; k++){
      var c = taskBlock(t.tasks[k], k);
      cards.push(c); list.appendChild(c);
    }
    tk.appendChild(list);
    bAll.addEventListener('click', function(){ cards.forEach(function(c){ c.__show(true); }); });
    bNone.addEventListener('click', function(){ cards.forEach(function(c){ c.__show(false); }); });
    p.appendChild(tk);

    var gm = el('div', 'card');
    gm.appendChild(el('h2', null, '<span>🐩</span> Пауза за игра'));
    gm.appendChild(t.game === 'duel' ? duelGame() : (t.game === 'hop' ? hopGame() : tfGame()));
    if(t.lock){
      gm.appendChild(el('h2', null, '<span>🔐</span> Финалът'));
      gm.appendChild(lockBlock(t.lock));
    }
    p.appendChild(gm);

    var nt = el('div', 'card');
    var li = '';
    for(k = 0; k < t.notes.length; k++) li += '<li>' + esc(t.notes[k]) + '</li>';
    nt.appendChild(el('h2', null, '<span>📝</span> За учителя'));
    nt.appendChild(el('div', 'notes', '<ul>' + li + '</ul>'));
    p.appendChild(nt);
    return p;
  }

  /* ── разделите ────────────────────────────────────────────────── */
  var tabs = document.getElementById('tabs');
  var panels = document.getElementById('panels');
  var barTab = document.getElementById('barTab');
  var btns = [], secs = [];

  TOPICS.forEach(function(t, i){
    var b = el('button', 'tab', '<span class="brick"></span><span><b>' + esc(t.tab.b)
      + '</b><small>' + esc(t.tab.s) + '</small></span>');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    b.setAttribute('aria-controls', 'p-' + t.id);
    b.addEventListener('click', function(){ open(i, true); });
    tabs.appendChild(b);
    btns.push(b);

    var s = buildPanel(t, i);
    s.hidden = (i !== 0);
    panels.appendChild(s);
    secs.push(s);
  });

  function open(i, push){
    for(var k = 0; k < btns.length; k++){
      btns[k].setAttribute('aria-selected', k === i ? 'true' : 'false');
      secs[k].hidden = (k !== i);
    }
    barTab.textContent = TOPICS[i].tab.b;
    if(push && history.replaceState) history.replaceState(null, '', '#' + TOPICS[i].id);
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  var want = (location.hash || '').replace('#', '');
  var start = 0;
  for(var i = 0; i < TOPICS.length; i++){ if(TOPICS[i].id === want) start = i; }
  open(start, false);
  fillPoodles(document);
})();
</script>
