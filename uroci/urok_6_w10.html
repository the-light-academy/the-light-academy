<!-- =====================================================================
     Гран при Каталуня — 6. клас, умножение и деление
     ---------------------------------------------------------------------
     Същата писта като „Рационално Гран при“ (uroci/urok_6_w06.html) —
     същият двигател, същите три части, същата таблица с грешките. Новото
     е математиката: вместо събиране тук се умножава и дели.

     Седем теми: знакът при · и :, десетични, дроби, деление, степени на
     отрицателни числа, изрази с няколко действия и свойствата
     (разместително, разпределително, умножение с 0 и 1, обратно число).

     Задачите не са записани — раждат се на място от GEN по тема и ниво,
     затова двама души никога не получават една и съща гонка. Всеки
     въпрос носи и обяснението „защо“.

     Страницата не иска вход и нищо не предава към платформата: урокът не
     се оценява. Работи и без интернет — шрифтовете са единственото,
     което се тегли отвън, и без тях надписите пак са четими. Докъде е
     стигнала групата се пази в localStorage на самия компютър.
     ===================================================================== -->

<style>
/* Layout: pit wall — the live circuit in the middle, each driver's cockpit panel on the side of the keyboard they use. One deliberate night-garage look around a daylight track. */

  --bg:#0c0f15; --panel:#141922; --panel2:#1b212d; --line:#283041;
  --fg:#eef2f7; --muted:#95a0b4; --red:#e10600; --go:#36d17a; --bad:#ff5a4f; --amber:#ffc23d;

  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:10px 18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1720px;margin:0 auto 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:30px;height:20px;flex:none;border-radius:3px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/10px 10px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.03em;line-height:1;text-transform:uppercase}
.brand b em{font-style:normal;color:var(--red)}
.brand small{color:var(--muted);font-size:13px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;color:var(--muted)}
.tb:hover{color:var(--fg)}
.tb.warn{color:var(--amber);border-color:var(--amber)}

.arena{display:grid;gap:12px;max-width:1720px;margin:0 auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"s"}
.stage{grid-area:s;position:relative;display:grid;width:min(100%,max(560px,calc((100dvh - 80px)*16/9)));margin-inline:auto;min-width:0}
.stage>*{grid-area:1/1;min-width:0}
#cv{width:100%;aspect-ratio:16/9;display:block;border-radius:12px;align-self:start;background:#2f6f37;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.hud{display:none;min-width:0}

@media (min-width:1150px){
  body.racing .arena{grid-template-columns:250px minmax(0,1fr) 250px;grid-template-areas:"l s r";align-items:start}
  body.racing .stage{width:min(100%,calc((100dvh - 70px)*16/9))}
}
@media (max-width:640px){body.racing .arena{grid-template-columns:minmax(0,1fr);grid-template-areas:"s" "l" "r"}}

.ov{position:relative;z-index:2;min-height:100%;border-radius:12px;background:rgba(8,10,15,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:clamp(14px,3vw,34px);display:flex;justify-content:center;align-items:flex-start}

.scr{width:min(100%,1060px);display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;text-wrap:balance}
.hero h1{font-size:clamp(40px,6vw,72px)}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{margin:8px 0 0;color:var(--muted);max-width:62ch}

h3{font-size:24px}

.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.sw{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

.part p{margin:0;font-size:14px;color:var(--muted);flex:1}
.part.done{border-color:var(--go)}
.part .st{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--go)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}

td.n{font-family:var(--f-num);font-size:16px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle;background:var(--c)}
.cellp{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:1px 6px;font-family:var(--f-num);font-weight:600}
.drivers{display:flex;gap:10px;flex-wrap:wrap}

.rules{margin:0;padding-left:20px;display:grid;gap:6px;max-width:72ch}
.headline{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,42px);text-transform:uppercase;line-height:1.05}
.headline.ok{color:var(--go)} .headline.mid{color:var(--amber)} .headline.no{color:var(--bad)}

.pp{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0;transition:box-shadow .2s}
.pp.fok{animation:fok .7s}
.pp.fbad{animation:fbad .7s}
@keyframes fok{30%{box-shadow:0 0 0 3px var(--go),0 0 30px rgba(54,209,122,.5)}}
@keyframes fbad{30%{box-shadow:0 0 0 3px var(--bad),0 0 30px rgba(255,90,79,.5)}}
.pph{display:flex;align-items:center;gap:8px;min-width:0}
.ppn{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppp{font-family:var(--f-display);font-size:22px;background:var(--c);color:var(--ct);border-radius:6px;padding:0 8px;line-height:1.25}
.pps{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pps b{color:var(--fg);font-family:var(--f-num);font-size:14px}
.qt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qq{font-size:17px;font-weight:600;line-height:1.35}
.nl{width:100%;height:auto;color:var(--fg);display:block;max-width:320px}
.ln{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.ln button{background:var(--panel2);border:2px solid transparent;border-radius:8px;padding:4px 4px 6px;text-align:center;min-width:0;transition:transform .12s,border-color .12s}
.ln button.sel{border-color:var(--c);background:var(--panel);transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ln button.x{opacity:.3;text-decoration:line-through}
.ln button.okb{border-color:var(--go)}
.ln button.okb b{color:var(--go)}
.ln button:disabled{cursor:default}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{color:var(--fg);font-family:var(--f-num);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.okk{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-size:12px;vertical-align:middle}
.pp.wait{animation:wt .8s infinite alternate}
@keyframes wt{to{box-shadow:0 0 0 2px var(--c),0 0 22px var(--c)}}
.cross button.sel{border-color:var(--amber);background:var(--panel);box-shadow:0 0 0 2px var(--amber)}
.ln small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ln b{font-family:var(--f-num);font-size:21px;font-weight:700;color:var(--c);overflow-wrap:anywhere}
.ppm{min-height:1.35em;font-weight:600;font-size:14px}
.ppm.ok{color:var(--go)} .ppm.bad{color:var(--bad)} .ppm.info{color:var(--amber)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--f-num);font-weight:700;line-height:1;margin:0 1px;font-size:.86em}

.fr span:last-child{padding:1px 2px 0}
.pitb{border:2px dashed var(--amber);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:7px;background:rgba(255,194,61,.06)}
.pitb .qt{color:var(--amber)}
.tyres{display:flex;gap:6px;align-items:center}
.tyres i{width:18px;height:18px;border-radius:50%;background:#111;border:3px solid #3a3f4a}
.tyres i.ok{border-color:var(--go)}
.tyres i.now{border-color:var(--amber);animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.2)}}
.cross{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". u ." "l c r" ". d .";gap:4px}
.cross button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;min-width:0}
.cross button small{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.cross button b{font-family:var(--f-num);font-size:18px;color:var(--fg);overflow-wrap:anywhere}
.cross button:disabled{opacity:.25}
.cross .c{grid-area:c;display:grid;place-items:center;font-size:11px;color:var(--amber);text-align:center;line-height:1.1}
</style>

<script>
'use strict';
/* ================= basics ================= */
const VW=1280,VH=720,W=116,BASEV=225,ACC=250,BRK=430,TURN=2.75,G4=4;
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hexRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function shade(h,k){const c=hexRgb(h).map(v=>Math.round(k<0?v*(1+k):v+(255-v)*k));return `rgb(${c.join(',')})`}
function txtOn(h){const [r,g,b]=hexRgb(h);return (r*299+g*587+b*114)/1000>150?'#111':'#fff'}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FD='"Saira Extra Condensed","Arial Narrow",sans-serif',FN='"Barlow Condensed","Arial Narrow",sans-serif',FB='"Barlow",system-ui,sans-serif';
function fmtT(t){if(t==null)return '—';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}

const LIVERY=[['Червен','#e8352c'],['Оранжев','#ff8a1f'],['Жълт','#ffd23d'],['Лайм','#9be04a'],['Зелен','#1fb86a'],['Тюркоаз','#22c3d6'],['Син','#3b74ff'],['Лилав','#9b5cff'],['Розов','#ff5fa8'],['Бял','#eef1f5']];
const KEYSETS={
  wasd:{u:'KeyW',l:'KeyA',d:'KeyS',r:'KeyD',ok:['Space'],g:['W','A','S','D'],og:'Space'},
  tfgh:{u:'KeyT',l:'KeyF',d:'KeyG',r:'KeyH',ok:['KeyY'],g:['T','F','G','H'],og:'Y'},
  ijkl:{u:'KeyI',l:'KeyJ',d:'KeyK',r:'KeyL',ok:['KeyO'],g:['I','J','K','L'],og:'O'},
  arrows:{u:'ArrowUp',l:'ArrowLeft',d:'ArrowDown',r:'ArrowRight',ok:['Enter','NumpadEnter'],g:['↑','←','↓','→'],og:'Enter'}};
const keysetsFor=n=>n<=2?['wasd','arrows']:n===3?['wasd','ijkl','arrows']:['wasd','tfgh','ijkl','arrows'];
const keyCaps=k=>`<span class="keys" aria-label="Клавиши">${KEYSETS[k].g.map(g=>`<span>${g}</span>`).join('')}</span><span class="okk">${KEYSETS[k].og}</span>`;

const TRACKS=[
 {name:'Каталуня Ринг',pts:[[640,622],[1000,622],[1150,565],[1190,430],[1120,330],[960,325],[860,255],[905,150],[820,82],[560,82],[380,115],[250,90],[118,170],[112,320],[230,400],[255,500],[215,590],[330,628]]},
 {name:'Монжуик',pts:[[560,630],[900,630],[1105,605],[1180,480],[1090,372],[880,388],[705,352],[780,240],[985,222],[1160,170],[1100,82],[700,82],[420,92],[255,170],[300,300],[180,380],[112,500],[180,612],[360,640]]},
 {name:'Отборен кръг Барселона',pts:[[640,630],[980,630],[1160,560],[1170,400],[1040,330],[1080,190],[980,88],[760,108],[640,230],[520,108],[300,88],[140,170],[128,330],[262,420],[170,540],[300,632]]}];

/* ================= numbers ================= */
const MN='−';
function fd(v){v=Math.round(v*1000)/1000;if(Object.is(v,-0)||v===0)return '0';return (v<0?MN:'')+String(Math.abs(v)).replace('.',',')}
const pz=s=>s[0]===MN?'('+s+')':s;

  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let j=0;j<60;j++){const t=j/60,t2=t*t,t3=t2*t;raw.push([0,1].map(k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}

function stepCar(c,dt,inp){
  locate(c);const s=surf(c);
  let maxV=BASEV*SET.speed;if(c.boost>0)maxV*=1.42;if(c.slip>0)maxV*=1.13;if(c.slowed>0)maxV*=.58;if(s==='grass')maxV*=.42;
  const inPitLane=s==='pit'&&c.lat*TK.side>W/2+4;if(inPitLane)maxV=Math.min(maxV,80);
  const fx=Math.cos(c.a),fy=Math.sin(c.a);let vf=c.vx*fx+c.vy*fy,vl=-c.vx*fy+c.vy*fx,drifting=false;
  const steer=inp.steer!=null?inp.steer:(inp.right?1:0)-(inp.left?1:0);
  if(c.spin>0){c.spin-=dt;c.a+=10.5*dt*c.spinDir;vf*=Math.exp(-2.2*dt);vl*=Math.exp(-3*dt);c.steer=0}
  else{
    drifting=c.dfx>0;
    if(inp.hold){vf*=Math.exp(-7*dt);vl*=Math.exp(-7*dt)}
    else{if(inp.up)vf+=ACC*(c.boost>0?1.7:1)*dt;
    if(inp.down){if(vf>5)vf-=BRK*dt;else vf=Math.max(0,vf-ACC*.45*dt)}}
    if(c.vspin>0){c.vspin-=dt;vf*=Math.exp(-2.6*dt)}
    const sp=Math.min(1,Math.abs(vf)/70);c.a+=steer*TURN*(drifting?1.45:1)*sp*dt*(vf<0?-1:1)*(s==='grass'?.8:1);
    c.steer=lerp(c.steer,steer,1-Math.exp(-12*dt));
  }
  vf-=vf*.32*dt;if(!inp.up&&!inp.down)vf-=vf*.55*dt;
  if(vf>maxV)vf=lerp(vf,maxV,1-Math.exp(-3.2*dt));if(vf<-60)vf=-60;
  const grip=drifting?1.3:(s==='grass'?4.5:8.5);vl*=Math.exp(-grip*dt);
  c.vx=vf*fx-vl*fy;c.vy=vf*fy+vl*fx;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vf=vf;c.drift=Math.abs(vl);c.surface=s;
  if(c.x<12){c.x=12;c.vx=Math.abs(c.vx)*.3}if(c.x>VW-12){c.x=VW-12;c.vx=-Math.abs(c.vx)*.3}if(c.y<12){c.y=12;c.vy=Math.abs(c.vy)*.3}if(c.y>VH-12){c.y=VH-12;c.vy=-Math.abs(c.vy)*.3}
  // effects
  const ra=c.a+Math.PI;
  if((c.drift>38&&Math.abs(vf)>60)||c.spin>0||c.vspin>0||c.dfx>0||(inp.down&&vf>150)){skid(c);if(Math.random()<.5)pt({k:'smoke',layer:0,x:c.x+Math.cos(ra)*14,y:c.y+Math.sin(ra)*14,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,life:.9,s:4})}else c.skidP=null;
  if(s==='grass'&&Math.abs(vf)>40&&Math.random()<.4)pt({k:'smoke',layer:0,c:'#8a6a3d',a:1.4,x:c.x+Math.cos(ra)*12,y:c.y+Math.sin(ra)*12,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:.6,s:3});
  if(c.boost>0&&Math.random()<.7)pt({k:'spark',layer:0,c:Math.random()<.5?'#ffb347':'#ffe08a',x:c.x+Math.cos(ra)*20,y:c.y+Math.sin(ra)*20,vx:Math.cos(ra)*160+(Math.random()-.5)*60,vy:Math.sin(ra)*160+(Math.random()-.5)*60,life:.3});
  if(c.slip>0&&Math.random()<.5)pt({k:'wind',layer:1,x:c.x+(Math.random()-.5)*18,y:c.y+(Math.random()-.5)*18,vx:Math.cos(c.a)*220,vy:Math.sin(c.a)*220,life:.25});
  c.dfx=Math.max(0,c.dfx-dt);c.boost=Math.max(0,c.boost-dt);c.slip=Math.max(0,c.slip-dt);c.slowed=Math.max(0,c.slowed-dt);
}
function skid(c){if(!SKX)return;const fx=Math.cos(c.a),fy=Math.sin(c.a),now=[1,-1].map(s=>({x:c.x-fx*11-fy*s*8,y:c.y-fy*11+fx*s*8}));
  if(c.skidP){SKX.strokeStyle='rgba(18,18,20,.32)';SKX.lineWidth=3.2;for(let k=0;k<2;k++){SKX.beginPath();SKX.moveTo(c.skidP[k].x,c.skidP[k].y);SKX.lineTo(now[k].x,now[k].y);SKX.stroke()}}c.skidP=now}

function collide(cars){for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j];if(a.inPit||b.inPit)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>=26||d<.01)continue;
  const nx=dx/d,ny=dy/d,ov=(26-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rel<0){const J=-(1.45)*rel/2;a.vx-=J*nx;a.vy-=J*ny;b.vx+=J*nx;b.vy+=J*ny;if(-rel>55){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;for(let k=0;k<14;k++){const an=Math.random()*7;pt({k:'spark',layer:1,x:mx,y:my,vx:Math.cos(an)*220,vy:Math.sin(an)*220,life:.35})}AU.crash();shake=Math.min(8,shake+(-rel)/30)}}}}

function float(x,y,text,col,size=22){pt({k:'txt',layer:1,x,y:y-18,vx:0,vy:-34,life:1.5,text,c:col,s:size})}
function mates(c){return RC.cars.filter(m=>!m.ai&&m!==c)}
function stat(c,q,ok){if(q.done)return;q.done=true;c.total++;if(ok)c.correct++;const st=G.stats[c.id]||(G.stats[c.id]={});const a=st[q.topic]||(st[q.topic]=[0,0]);a[1]++;if(ok)a[0]++}

function moveSel(c,d){const q=c.q;if(!q||c.qOK||c.finished)return;let s=c.sel;for(let k=0;k<3;k++){const n=clamp(s+d,0,2);if(n===s)break;s=n;if(!q.wrong.includes(s))break}if(!q.wrong.includes(s)&&s!==c.sel){c.sel=s;AU.tick();hudFull(c)}}
function gateAnswer(c){const q=c.q;if(!q||c.qOK||c.lock>0||c.finished)return;const i=c.sel;if(q.wrong.includes(i))return;
  if(i===q.la){const first=!q.wrong.length;stat(c,q,true);c.qOK=true;AU.good();flash(c,'fok');pt({k:'ring',layer:0,x:c.x,y:c.y,c:'#36d17a',s:10,life:.6});
    if(first)reward(c);else msg(c,'Вярно! Карай нататък.','ok');
    if(RC.team)checkDrift(c);hudFull(c)}
  else{stat(c,q,false);q.wrong.push(i);AU.bad();AU.spin();c.vspin=.9;c.spinDir=Math.random()<.5?1:-1;c.lock=1.1;float(c.x,c.y,'✗','#ff5a4f',30);msg(c,`Не е ${q.lane[i]}. ${q.why}`,'bad',7000);flash(c,'fbad');
    const free=[0,1,2].filter(k=>!q.wrong.includes(k));c.sel=free.includes(1)?1:free[0];hudFull(c)}}
function reward(c){
  if(RC.team){const ms=mates(c).filter(m=>!m.finished),inPit=ms.find(m=>m.inPit);
    if(inPit){tireDone(inPit,c.name);msg(c,`Първи опит! Смени гума на ${inPit.name}.`,'ok');float(c.x,c.y,'ГУМА ЗА '+inPit.name.toUpperCase(),'#36d17a',18);beam(c,inPit);return}
    if(ms.length){const m=ms.sort((a,b)=>a.progress-b.progress)[0];giveBoost(m);msg(c,`Първи опит! Турбо за ${m.name}.`,'ok');msg(m,`${c.name} ти даде турбо!`,'ok');float(c.x,c.y,'ТУРБО → '+m.name.toUpperCase(),'#36d17a',18);beam(c,m);return}}
  giveBoost(c);msg(c,'Първи опит! Турбо!','ok')}
function inZone(c){for(let z=0;z<TK.drift.length;z++){const Z=TK.drift[z];let d=c.idx-Z.a;if(d<0)d+=TK.N;if(d<=Z.b-Z.a)return z}return -1}
function checkDrift(c){const z=inZone(c),key=z+'-'+c.lapSeen;if(z<0||c.dz[key])return;c.dz[key]=1;c.dfx=1;const sd=Math.random()<.5?1:-1;c.vx+=-Math.sin(c.a)*sd*70;c.vy+=Math.cos(c.a)*sd*70;driftShield(c)}
function gateFx(c){for(let k=0;k<2;k++)pt({k:'ring',layer:0,x:c.x,y:c.y,c:c.col,s:6+k*8,life:.5})}
function giveBoost(c){c.boost=2.7;AU.boost();float(c.x,c.y,'ТУРБО!','#ffc23d',24);for(let k=0;k<10;k++)pt({k:'ring',layer:0,x:c.x,y:c.y,c:'#ffc23d',s:8,life:.5})}
function beam(a,b){const n=14;for(let k=0;k<=n;k++){const t=k/n;pt({k:'spark',layer:1,c:'#36d17a',x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,life:.5+t*.3})}}
function enterPit(c){const b=TK.boxes[c.box];c.inPit=true;c.x=b.x;c.y=b.y;c.a=b.a;c.vx=c.vy=c.vf=0;c.skidP=null;c.pitN++;
  if(c.rival){c.pitT=14+Math.random()*4;return}
  c.sel=0;c.pit={tire:0,t0:RC.t,lock:0,wrong:[],q:pitQ(c)};AU.pitIn();hudFull(c);msg(c,'В бокса си! Посоката избира, '+KEYSETS[c.ks].og+' проверява.','info')}
function pitQ(c){return makeQ(['prop','same','diff','abs','cmp'][((c.pit?c.pit.tire:0)+c.pitN-1)%5],lvlFor(c))}
function pitAnswer(c,k){const p=c.pit;if(!p||p.lock>0||p.wrong.includes(k))return;if(k===p.q.a4){stat(c,p.q,true);tireDone(c,null)}else{stat(c,p.q,false);p.wrong.push(k);p.lock=1.1;c.sel=[0,1,2,3].find(i=>!p.wrong.includes(i));AU.bad();hudFull(c);msg(c,'Гайката падна! Опитай друг отговор.','bad');flash(c,'fbad')}}
function tireDone(c,by){const p=c.pit;if(!p)return;p.tire++;AU.wrench();const b=TK.boxes[c.box];for(let k=0;k<12;k++){const an=Math.random()*7;pt({k:'spark',layer:1,x:b.x,y:b.y,vx:Math.cos(an)*120,vy:Math.sin(an)*120,life:.3})}
  if(p.tire>=4){exitPit(c);return}p.q=pitQ(c);p.wrong=[];p.lock=0;c.sel=0;hudFull(c);if(by)msg(c,`${by} смени една гума вместо теб!`,'ok');else msg(c,'Гумата е сменена!','ok');flash(c,'fok')}
function exitPit(c){c.inPit=false;c.pitDone=true;c.wantPit=false;if(c.rival)return;const t=RC.t-c.pit.t0;c.pit=null;c.sel=1;AU.release();hudFull(c);msg(c,`Пит-стоп за ${t.toFixed(1)} с. Карай!`,'ok');float(c.x,c.y,'ПУСКАЙ!','#36d17a')}

function update(dt){
  if(!RC){if(attract)stepAttract(dt);updPS(dt);return}
  RC.lt+=dt;
  if(RC.phase==='lights'){const k=Math.min(5,Math.floor(RC.lt/.8));if(k>RC.lights){RC.lights=k;AU.light()}if(RC.lt>=RC.goAt){RC.phase='race';RC.lights=0;AU.go();RC.banner={t:'ТРЪГВАЙ!',c:'#36d17a',until:RC.lt+1.2}}updPS(dt);return}
  if(RC.phase==='done'){updPS(dt);return}
  RC.t+=dt;const cars=RC.cars,players=cars.filter(c=>!c.ai),N=TK.N,NG=RC.laps*G4;
  for(const c of cars){
    if(c.inPit){if(c.rival){c.pitT-=dt*(c.slowed>0?.5:1);if(c.pitT<=0)exitPit(c)}else if(c.pit)c.pit.lock=Math.max(0,c.pit.lock-dt);c.vx=c.vy=c.vf=0;c.wait=false;continue}
    c.lock=Math.max(0,c.lock-dt);
    let base=BASEV*SET.speed*(c.finished?.4:c.rival?.88:.95),stop=Infinity,isPit=false;
    if(!c.finished&&c.wantPit&&!c.pitDone){stop=c.pitLap*N+TK.boxes[c.box].i;isPit=true}
    if(!c.finished&&!c.qOK&&c.gk<NG){const g=gateTarget(c.gk)-6;if(g<stop){stop=g;isPit=false}}
    const dist=stop<Infinity?(stop-c.progress)*TK.sp:1e9;
    if(dist<1e9)base=Math.min(base,Math.sqrt(2*330*Math.max(0,dist)));
    let lt=c.laneR;
    if(c.wantPit&&!c.pitDone&&c.progress>c.pitLap*N-40)lt=TK.side*(W/2+27);
    else if(!c.rival&&!c.finished&&c.q&&c.gk<NG&&gateTarget(c.gk)-c.progress<170)lt=(1-c.sel)*W/3;
    c.aiLat=lerp(c.aiLat,lt,1-Math.exp(-3*dt));
    let inp=aiInput(c,base);if(base<6)inp={steer:inp.steer*.3,hold:true};
    c.wait=base<6&&!isPit&&!c.finished;
    stepCar(c,dt,inp);
    if(isPit&&dist<10&&Math.abs(c.vf)<35)enterPit(c);
    if(c.rival&&!c.qOK&&!isPit&&dist<16){if(c.think==null)c.think=5.5+Math.random()*3.5;c.think-=dt*(c.slowed>0?.4:1);if(c.think<=0){c.qOK=true;c.think=null}}
    while(c.qOK&&c.gk<NG&&c.progress>=gateTarget(c.gk)){c.gk++;c.qOK=false;if(!c.rival){nextQ(c);c.sel=1;hudFull(c)}gateFx(c)}
    const lapNow=Math.floor(c.progress/N);
    if(!c.finished&&lapNow>c.lapSeen&&lapNow>=1){c.lapSeen=lapNow;if(!c.rival)AU.lap();
      if(lapNow===1&&!c.pitDone){c.wantPit=true;c.pitLap=1;if(!c.rival)msg(c,'Колата влиза в бокса за пит-стоп!','info')}
      if(lapNow>=RC.laps){c.finished=true;c.finishT=RC.t;if(RC.firstFin==null&&!c.rival)RC.firstFin=RC.t;if(!c.rival){AU.fanfare();confetti(c.x,c.y,c.col);hudFull(c)}}
      else if(lapNow===RC.laps-1&&!c.rival){RC.banner={t:'ПОСЛЕДНА ОБИКОЛКА · '+c.name.toUpperCase(),c:c.col,until:RC.lt+1.8}}}
    if(c.rival||c.finished)continue;
    if(RC.team){const z=inZone(c);if(z>=0&&!c.inZone){c.inZone=true;if(!c.dz[z+'-'+c.lapSeen]&&!c.qOK)msg(c,'Жълт завой! Отговори вярно СЕГА за дрифт.','info',3000)}else if(z<0)c.inZone=false;
      for(const m of mates(c)){const dx=m.x-c.x,dy=m.y-c.y,d=Math.hypot(dx,dy);if(d<95&&d>20&&(dx*Math.cos(c.a)+dy*Math.sin(c.a))/d>.9&&c.vf>90)c.slip=.3}}
  }
  collide(cars.filter(c=>!c.inPit&&Math.abs(c.vf)>40));
  RC.order=[...cars].sort((a,b)=>{if(a.finished&&b.finished)return(a.finishT+a.pen)-(b.finishT+b.pen);if(a.finished)return -1;if(b.finished)return 1;return b.progress-a.progress});
  RC.order.forEach((c,i)=>c.pos=i+1);
  const allDone=players.every(c=>c.finished);
  if(RC.endT==null&&(allDone||(RC.firstFin!=null&&RC.t-RC.firstFin>45)))RC.endT=RC.t;
  if(RC.endT!=null&&RC.t-RC.endT>(allDone?2.2:.5)){endRace()}
  RC.hudT-=dt;if(RC.hudT<=0){RC.hudT=.15;players.forEach(hudStat)}
  RC.engT-=dt;if(RC.engT<=0){RC.engT=.07;players.forEach(c=>AU.engUpd(c))}
  updPS(dt);
}
function driftShield(c){const rv=RC.cars.filter(r=>r.rival);AU.shield();RC.banner={t:'ДРИФТ-БЛОКАДА · '+c.name.toUpperCase(),c:'#ffc23d',until:RC.lt+2};msg(c,'Супер дрифт! Сивите са забавени.','ok');
  for(const r of rv){r.slowed=4;for(let k=0;k<26;k++)pt({k:'smoke',layer:1,c:'#e9edf3',x:r.x+(Math.random()-.5)*30,y:r.y+(Math.random()-.5)*30,vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50,life:1.6,s:7,a:1.5})}
  mates(c).forEach(m=>msg(m,`${c.name} задържа Сивите с дрифт!`,'ok'))}
function confetti(x,y,col){const cs=[col,'#fff','#ffc23d','#111'];for(let k=0;k<70;k++){const an=Math.random()*7,sp=80+Math.random()*260;pt({k:'conf',layer:1,x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-120,g:260,dr:1.2,life:1.8+Math.random(),s:5+Math.random()*4,c:cs[k%4],rot:an,vr:(Math.random()-.5)*14})}}

/* attract mode */
function startAttract(){TK=buildTrack(0);boxCols=[];renderBG();const cols=['#e8352c','#3b74ff','#ffd23d','#22c3d6'];attract=cols.map((col,i)=>mkCar({col,name:'',ai:true},i));attract.forEach((c,i)=>c.base=BASEV*(.62+i*.05))}
function stepAttract(dt){for(const c of attract)stepCar(c,dt,aiInput(c,c.base));collide(attract)}

/* ================= particles & render ================= */
const PS=[];
function pt(o){if(PS.length<800)PS.push(Object.assign({vx:0,vy:0,t:0,life:1,s:4,g:0,rot:0,vr:0,dr:0},o))}
function updPS(dt){for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.t+=dt;if(p.t>=p.life){PS.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.dr){const f=Math.exp(-p.dr*dt);p.vx*=f;p.vy*=f}p.rot+=p.vr*dt}}
function drawPS(c,layer){for(const p of PS){if(p.layer!==layer)continue;const k=p.t/p.life;
  if(p.k==='smoke'){c.globalAlpha=Math.min(1,(1-k)*.42*(p.a||1));c.fillStyle=p.c||'#dfe2e7';c.beginPath();c.arc(p.x,p.y,p.s*(1+k*2.6),0,7);c.fill()}
  else if(p.k==='spark'){c.globalAlpha=1-k;c.strokeStyle=p.c||'#ffd56b';c.lineWidth=1.8;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);c.stroke()}
  else if(p.k==='conf'){c.globalAlpha=1-k*k;c.fillStyle=p.c;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()}
  else if(p.k==='txt'){c.globalAlpha=1-k*k;c.font=`800 ${p.s}px ${FD}`;c.textAlign='center';c.textBaseline='middle';c.lineWidth=5;c.strokeStyle='rgba(0,0,0,.65)';c.strokeText(p.text,p.x,p.y);c.fillStyle=p.c;c.fillText(p.text,p.x,p.y)}
  else if(p.k==='wind'){c.globalAlpha=(1-k)*.7;c.strokeStyle='#fff';c.lineWidth=1.2;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.09,p.y-p.vy*.09);c.stroke()}
  else if(p.k==='ring'){c.globalAlpha=(1-k)*.8;c.strokeStyle=p.c;c.lineWidth=3*(1-k)+.5;c.beginPath();c.arc(p.x,p.y,p.s+k*44,0,7);c.stroke()}}
  c.globalAlpha=1}
function drawCar(c,car){const col=car.col,dk=shade(col,-.4);c.save();c.translate(car.x,car.y);
  c.save();c.translate(3,4);c.rotate(car.a);c.fillStyle='rgba(0,0,0,.33)';rr(c,-19,-9,39,18,7);c.fill();c.restore();
  c.rotate(car.a+(car.vspin>0?(1-car.vspin/.9)*Math.PI*2*car.spinDir:0)+(car.dfx>0?Math.sin(car.dfx*7)*.45:0));
  if(car.boost>0){const L=13+Math.random()*12,g=c.createLinearGradient(-18,0,-18-L,0);g.addColorStop(0,'rgba(255,245,190,.95)');g.addColorStop(.4,'rgba(255,140,30,.9)');g.addColorStop(1,'rgba(255,50,0,0)');c.fillStyle=g;c.beginPath();c.moveTo(-17,-4);c.lineTo(-18-L,0);c.lineTo(-17,4);c.fill()}
  if(car.slowed>0){c.globalAlpha=.55}
  c.fillStyle='#111';rr(c,-15,-11,9,5,1.5);c.fill();rr(c,-15,6,9,5,1.5);c.fill();
  for(const s of [-1,1]){c.save();c.translate(10,s*8.5);c.rotate(car.steer*.45);rr(c,-4,-2.4,8,4.8,1.4);c.fill();c.restore()}
  c.fillStyle=dk;rr(c,-20,-8.5,4.5,17,1);c.fill();
  c.fillStyle=col;c.beginPath();c.moveTo(-16,-4);c.lineTo(-8,-6.8);c.lineTo(2,-6.2);c.lineTo(8,-2.6);c.lineTo(18,-1.4);c.lineTo(18,1.4);c.lineTo(8,2.6);c.lineTo(2,6.2);c.lineTo(-8,6.8);c.lineTo(-16,4);c.closePath();c.fill();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=.8;c.stroke();
  c.fillStyle='rgba(255,255,255,.45)';c.fillRect(-14,-.8,30,1.6);
  c.fillStyle=dk;rr(c,16,-9,3.6,18,1);c.fill();

function carMini(col){return `<svg viewBox="-24 -14 48 28" width="64" height="37" aria-hidden="true"><rect x="-15" y="-11" width="9" height="5" rx="1.5" fill="#111"/><rect x="-15" y="6" width="9" height="5" rx="1.5" fill="#111"/><rect x="6" y="-11" width="8" height="5" rx="1.5" fill="#111"/><rect x="6" y="6" width="8" height="5" rx="1.5" fill="#111"/><rect x="-20" y="-8.5" width="4.5" height="17" rx="1" fill="${shade(col,-.4)}"/><path d="M-16,-4 L-8,-6.8 L2,-6.2 L8,-2.6 L18,-1.4 L18,1.4 L8,2.6 L2,6.2 L-8,6.8 L-16,4Z" fill="${col}" stroke="rgba(0,0,0,.35)" stroke-width=".8"/><rect x="16" y="-9" width="3.6" height="18" rx="1" fill="${shade(col,-.4)}"/><ellipse cx="-1" cy="0" rx="4.8" ry="3.1" fill="#0b0d12"/><circle cx="-1.6" cy="0" r="2.3" fill="#fff"/></svg>`}
function showSetup(){ovState='setup';
  const n=SET.n;while(SET.players.length<n){const used=SET.players.map(p=>p.col),free=LIVERY.find(l=>!used.includes(l[1]));SET.players.push({name:'',col:free[1]})}SET.players.length=n;
  if(SET.heat>4)SET.heat=4;
  const seg=(id,vals,cur,lab)=>`<div class="seg" id="${id}" role="group">${vals.map((v,i)=>`<button type="button" data-v="${v}" aria-pressed="${v===cur}">${lab[i]}</button>`).join('')}</div>`;
  showOv(`<div class="scr">
    <div class="hero"><div class="eyebrow">6. клас · умножение и деление</div><h1>Гран при <em>Каталуня</em></h1><p>Знакът при · и :, десетични и дроби, деление чрез обратно число, степени на отрицателни числа, изрази с няколко действия и свойствата. Задачите са върху самата писта и стават все по-трудни.</p></div>
    <div class="grid2">
      <section class="box"><div class="row" style="justify-content:space-between"><div><div class="lbl">Колко пилоти?</div><div class="small">от 2 до 8</div></div>
        <div class="stepper"><button type="button" id="nM" aria-label="По-малко" ${n<=2?'disabled':''}>−</button><output id="nO">${n}</output><button type="button" id="nP" aria-label="Повече" ${n>=8?'disabled':''}>+</button></div></div>
        <div style="display:grid;gap:8px">${SET.players.map((p,i)=>`<div class="prow"><span class="no">${i+1}</span>${carMini(p.col)}<div style="min-width:0"><input id="nm${i}" maxlength="14" placeholder="Пилот ${i+1}" value="${esc(p.name)}" aria-label="Име на пилот ${i+1}"><div class="sw" role="radiogroup" aria-label="Цвят">${LIVERY.map(([ln,h])=>{const t=SET.players.some((o,j)=>j!==i&&o.col===h);return `<button type="button" role="radio" style="--c:${h}" data-i="${i}" data-h="${h}" aria-checked="${p.col===h}" title="${ln}${t?' – зает':''}" aria-label="${ln}" ${t?'disabled':''}></button>`}).join('')}</div></div></div>`).join('')}</div>
      </section>
      <section class="box">
        ${n>=3?`<div><div class="lbl">Карат едновременно</div>${seg('sH',[2,3,4].filter(v=>v<=n),SET.heat,[2,3,4].filter(v=>v<=n).map(String))}<div class="small" style="margin-top:4px">Останалите чакат за следващата гонка.</div></div>`:''}
        <div><div class="lbl">Обиколки</div>${seg('sL',[2,3,4],SET.laps,['2','3','4'])}</div>
        <div><div class="lbl">Скорост</div>${seg('sS',[1,.78],SET.speed,['Нормална','По-бавна'])}</div>
        <ul class="how">
          <li><span class="ic">${keyCaps('wasd')}</span><div><b>Клавиши</b>Колите карат сами. Вляво/вдясно избираш отговор, после го проверяваш: първият с A D и Space, вторият със стрелките и Enter. Трети: J L и O. Четвърти: F H и Y.</div></li>
          <li><span class="ic" style="color:var(--amber)">≡</span><div><b>Портали</b>Колата спира на портала, докато не отговориш вярно. Верен от първия път – турбо. Грешен – завъртане и нов опит.</div></li>
          <li><span class="ic" style="color:var(--red)">P</span><div><b>Пит-стоп</b>В началото на 2-ра обиколка колата сама влиза в бокса. Сменяш 4 гуми с 4 задачи: посоката избира отговора, твоят клавиш проверява.</div></li>
        
</ul>
      </section>
    </div>
    <div class="row end"><button class="btn big" id="go">Към шампионата</button></div></div>`);
  $('nM').onclick=()=>{SET.n=Math.max(2,n-1);showSetup()};$('nP').onclick=()=>{SET.n=Math.min(8,n+1);showSetup()};
  SET.players.forEach((p,i)=>{$('nm'+i).oninput=e=>{p.name=e.target.value}});
  ov.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{SET.players[+b.dataset.i].col=b.dataset.h;AU.resume();AU.tick();showSetup()});
  const segH=(id,f)=>{const el=$(id);if(el)el.querySelectorAll('button').forEach(b=>b.onclick=()=>{f(+b.dataset.v);showSetup()})};
  segH('sH',v=>SET.heat=v);segH('sL',v=>SET.laps=v);segH('sS',v=>SET.speed=v);
  $('go').onclick=()=>{AU.resume();showMenu()}}
function showMenu(){ovState='menu';snap();
  const ids=SET.players.map((_,i)=>i),stand=[...ids].sort((a,b)=>(G.champ[b]||0)-(G.champ[a]||0));
  const nh=groupSizes(SET.n,SET.heat).length;
  const stats=`<div class="tbl"><table><thead><tr><th>Пилот</th>${TOP.map(t=>`<th title="${TOPN[t]}">${TOPN[t]}</th>`).join('')}</tr></thead><tbody>${ids.map(i=>`<tr><td><span class="dot" style="--c:${SET.players[i].col}"></span>${esc(pname(i))}</td>${TOP.map(t=>{const a=(G.stats[i]||{})[t];if(!a)return '<td class="small">—</td>';const r=a[0]/a[1],bg=r>=.8?'rgba(54,209,122,.25)':r>=.5?'rgba(255,194,61,.22)':'rgba(255,90,79,.25)';return `<td><span class="cellp" style="background:${bg}">${a[0]}/${a[1]}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  showOv(`<div class="scr">
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">${SET.n} пилоти · ${SET.laps} обиколки · ${nh} ${nh===1?'гонка':'гонки'} на част</div><h2>Шампионат</h2></div><button class="btn ghost" id="bSet">Пилоти и настройки</button></div>
    <div class="parts">${PARTS.map((P,p)=>`<article class="part ${G.done[p]?'done':''}"><span class="pn" aria-hidden="true">${p+1}</span><div class="eyebrow">${P.no}${G.done[p]?' · <span class="st">готово</span>':''}</div><h3>${P.title}</h3><p>${P.desc}</p><div class="small">Писта: ${TRACKS[p].name}</div><button class="btn${G.done[p]?' ghost':''}" data-p="${p}" ${p===nextPart()?'id="go"':''}>${G.done[p]?'Карай отново':'Старт'}</button></article>`).join('')}</div>
    <div class="grid2"><section class="box"><div class="lbl">Класиране (точки от Част 1 и 2)</div><div class="tbl"><table><thead><tr><th>Поз.</th><th>Пилот</th><th>Точки</th></tr></thead><tbody>${stand.map((i,k)=>`<tr><td class="n">${k+1}</td><td><span class="dot" style="--c:${SET.players[i].col}"></span>${esc(pname(i))}</td><td class="n">${G.champ[i]||0}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="box"><div class="lbl">За учителя: верни отговори по теми</div>${stats}<div class="small">Зелено – 80% и повече, жълто – от 50%, червено – под 50%.</div></section></div></div>`);
  ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{AU.resume();startPart(+b.dataset.p)});$('bSet').onclick=showSetup}
function nextPart(){const i=G.done.indexOf(false);return i<0?0:i}
function startPart(p){G.part=p;G.heats=makeHeats(p);G.heat=0;if(p<2)G.partRes[p]=[];else G.team=[];if(G.done[p]&&p<2){/* re-run: remove old points */}showIntro()}
function showIntro(){ovState='intro';const p=G.part,P=PARTS[p],ids=G.heats[G.heat],ks=keysetsFor(ids.length);
  const rules=p===2?['Отборът тръгва зад двата Сиви болида. Сивите също спират на всеки портал, за да „мислят“. Целта: и двамата да финиширате пред тях.','Верен отговор от първия път → турбото отива при съотборника, който е по-назад.','Ако съотборникът е в бокса, твоят верен отговор сменя една негова гума.','Жълтите завои ДРИФТ: отговори вярно, докато колата ти е в жълтия завой. Тя прави дрифт и задържа Сивите в дима.','Когато карате близо един зад друг, задният получава въздушен тунел.']
    :['Колите карат сами. Избираш отговор вляво/вдясно и го проверяваш с твоя клавиш.','Колата спира на портала, докато не отговориш вярно. Можеш да отговориш и докато кара – тогава не спира.','Верен от първия път → турбо. Грешен → завъртане, 1 секунда пауза и нов опит.','В началото на 2-ра обиколка колата влиза в бокса: 4 гуми, 4 задачи.'];
  showOv(`<div class="scr"><div class="eyebrow">${P.no} · гонка ${G.heat+1} от ${G.heats.length} · ${TRACKS[p].name} · ${SET.laps} обиколки</div><h2>${P.title}</h2>
    <div class="drivers">${ids.map((id,k)=>`<div class="drv" style="--c:${SET.players[id].col}">${carMini(SET.players[id].col)}<b>${esc(pname(id))}</b>${keyCaps(ks[k])}</div>`).join('')}</div>
    <ul class="rules">${rules.map(r=>`<li>${r}</li>`).join('')}</ul>
    <div class="row end"><button class="btn ghost" id="bMenu">Назад</button><button class="btn big" id="go">На стартовата решетка</button></div></div>`);
  $('bMenu').onclick=showMenu;$('go').onclick=()=>{AU.resume();ovState='race';newRace(p,ids)}}

/* ================= input & chrome ================= */
let ovShownAt=0;
function act(c,a){if(c.finished)return;
  if(c.inPit&&c.pit){const m={u:0,l:1,d:2,r:3}[a];if(m!=null){if(!c.pit.wrong.includes(m)&&m!==c.sel){c.sel=m;AU.tick();hudFull(c)}}else pitAnswer(c,c.sel);return}
  if(a==='l')moveSel(c,-1);else if(a==='r')moveSel(c,1);else if(a==='ok')gateAnswer(c)}
addEventListener('keydown',e=>{
  if(RC&&RC.phase!=='done'){let hit=false;
    for(const c of RC.cars){if(c.ai||!c.ks)continue;const k=KEYSETS[c.ks];let a=null;
      if(e.code===k.u)a='u';else if(e.code===k.l)a='l';else if(e.code===k.d)a='d';else if(e.code===k.r)a='r';else if(k.ok.includes(e.code))a='ok';
      if(!a)continue;hit=true;if(!e.repeat)act(c,a)}
    if(hit||e.code==='Space'||e.code==='Enter'||e.code.startsWith('Arrow'))e.preventDefault();return}
  if(!RC&&e.key==='Enter'&&!ov.hidden&&!(e.target&&e.target.tagName==='INPUT')){e.preventDefault();if(e.repeat||performance.now()-ovShownAt<1500)return;const b=ov.querySelector('#go');if(b)b.click()}
},{passive:false});
$('bSound').onclick=()=>{AU.resume();AU.set(!AU.on);$('bSound').textContent='Звук: '+(AU.on?'вкл.':'изкл.');$('bSound').setAttribute('aria-pressed',AU.on)};
$('bFull').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{})};
let exitArm=0;$('bExit').onclick=()=>{const b=$('bExit');if(Date.now()-exitArm<3000){exitArm=0;b.classList.remove('warn');b.textContent='Изход от гонката';if(RC){RC.cars.forEach(c=>AU.engStop(c));RC=null;document.body.classList.remove('racing');b.hidden=true;$('hudL').innerHTML='';$('hudR').innerHTML='';TK=null;startAttract();requestAnimationFrame(resize);showMenu()}}else{exitArm=Date.now();b.classList.add('warn');b.textContent='Сигурни? Натисни пак';setTimeout(()=>{if(Date.now()-exitArm>=2900){b.classList.remove('warn');b.textContent='Изход от гонката'}},3000)}};
new ResizeObserver(()=>resize()).observe(cv);
function snap(){try{localStorage.setItem('rgp-md',JSON.stringify({SET,G}))}catch(e){}}
function boot(data){
  let d=data&&data.SET?data:null;if(!d){try{d=JSON.parse(localStorage.getItem('rgp-md')||'null')}catch(e){}}
  if(d&&d.SET&&d.G&&Array.isArray(d.SET.players)){SET=d.SET;G=Object.assign(freshG(),d.G)}
  const go=()=>{startAttract();resize();renderBG();(d?showMenu:showSetup)();requestAnimationFrame(frame)};
  Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(go,go);
}
boot();
</script>

</body>
