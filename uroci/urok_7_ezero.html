<!-- =====================================================================
     ЛЕБЕДОВО ЕЗЕРО — 7. клас, формулите за съкратено умножение,
     трета степен
     ---------------------------------------------------------------------
     Разходка из приказката в четири действия и финал. Всяко действие е
     една формула:

       I   (a + b)³   балът в замъка — кубът се разглобява на 8 парчета
       II  (a − b)³   езерото под луната — знаците се редуват
       III a³ − b³    черният лебед — отвън минус, вътре плюс
       IV  a³ + b³    белият лебед — огледалото на третото действие
       V   зората     всичко заедно, последните две за състезание

     40 задачи от лесни към трудни и седем вида работа: МОДЕЛ НА КУБА
     (колко са парчетата от всеки вид), ТРИЪГЪЛНИКЪТ НА ПАСКАЛ (откъде
     идват 1, 3, 3, 1), СВЪРЗВАНЕ (произведение ↔ разлагане), ЧИПОВЕ,
     НАУМ (101³, 99³, 12³ − 8³ през формулите), РАЗПОЗНАВАНЕ и ЧИСЛО.

     Между действията са ФУЕТЕТАТА: бърза игра „вярно или грешно“ на два
     чифта клавиша, 8 въртения всеки път — 32 за целия спектакъл, точно
     както в трето действие на балета.

     Накрая всичко се заключва в едно число: коефициентите 1, 3, 3, 1
     дават 1331, а 1331 = 11³.

     Урокът се води от дъската: нищо не е заключено, никъде не се пише.
     Всяка задача се отмята с кръгчето ✓ на картата ѝ или с бутона
     „РЕШИХМЕ Я НА ДЪСКАТА“, който показва и отговора.

     Фонът стои мирно — нищо не пада и нищо не минава.

     НИЩО ТУК НЕ Е ПРЕСМЕТНАТО НА РЪКА. Условията стоят в
     scripts/urok7/ezero.py; разложенията, примамките, веригите наум и
     верността на твърденията ги смята scripts/build_ezero.py със sympy,
     а scripts/check_ezero.py ги проверява по друг път — числено.

     Страницата не иска вход и нищо не предава към платформата.
     ===================================================================== -->

<div class="obvivka">
  <header id="hud">
    <div class="hud-mark">Лебедово езеро<small>7. КЛАС · ТРЕТА СТЕПЕН</small></div>

<script>
/* ДАННИ:НАЧАЛО — пише ги scripts/build_ezero.py; условията са в scripts/urok7/ezero.py */
const EZERO = {
 "deistviq": [
  {
   "kod": "I",
   "ime": "БАЛЪТ В ЗАМЪКА",
   "formula": "(a + b)³ = a³ + 3a²b + 3ab² + b³",
   "podnaslov": "Кубът се разглобява на осем парчета.",
   "briefing": "Принц Зигфрид има рожден ден и залата е пълна. Тази вечер ще научиш откъде идват тройките в (a + b)³: кубът със страна a + b се разглобява на осем парчета и две от групите са по три еднакви. Нищо не се помни наизуст — брои се.",
   "nujni": 5,

    if(r >= UVERTURA.length){ t.textContent = sglobeno; $('#vhod').hidden = false; return; }
    const red = UVERTURA[r];
    if(k <= red.length){ t.textContent = sglobeno + red.slice(0,k); k++; setTimeout(pishi, tiho?0:13); }
    else { sglobeno += red + '\n'; r++; k = 0; setTimeout(pishi, tiho?0:110); }
  })();
  scena.addEventListener('click', function(e){
    if(!e.target.closest('#bZapochni, #bProdulji')) return;
    S.imena = [($('#ime1').value||'ИГРАЧ 1').toUpperCase().slice(0,14),
               ($('#ime2').value||'ИГРАЧ 2').toUpperCase().slice(0,14)];
    zapazi(); zvOk(); ekranAkt(parvNezavursen());
  });
}
function imePole(n, klavishi){
  return '<div style="flex:1 1 200px;border:1px solid var(--ram);border-radius:12px;padding:12px 14px">'
    + '<label for="ime'+(n+1)+'" style="display:block;font-size:11px;letter-spacing:.2em;'
    + 'color:var(--blqd);margin-bottom:6px">ТАНЦЬОР '+(n+1)+' · клавиши '+klavishi+' · по желание</label>'
    + '<input id="ime'+(n+1)+'" maxlength="14" value="'+ekraniraj(S.imena[n])+'" '
    + 'style="width:100%;background:none;border:none;outline:none;color:var(--ton);'
    + 'font-size:19px;font-weight:700" /></div>';
}

/* =====================================================================
   5. ДЕЙСТВИЕ
   ===================================================================== */
function ekranAkt(i){
  document.body.classList.remove('fuete'); spriFuete();
  if(i >= EZERO.deistviq.length) return ekranPosledno();
  const d = EZERO.deistviq[i];
  tonAkt(i);
  const got = broiReshene(d), otvoren = aktOtvoren(i);
  scena.innerHTML =
   '<div class="panel">'
   + '<div class="akt-glava"><div class="rim">'+d.kod+'</div>'
   +   '<div><div class="etiket">действие</div><h2>'+ekraniraj(d.ime)+'</h2>'
   +   '<div class="muten">'+ekraniraj(d.podnaslov)+'</div></div></div>'
   + '<div class="formula-red mat">'+ekraniraj(d.formula)+'</div>'
   + '<p class="proza" style="max-width:60ch">'+ekraniraj(d.briefing)+'</p>'
   + '<div class="lenta"><i style="width:'+Math.min(100,Math.round(100*got/d.nujni))+'%"></i></div>'
   + '<div class="muten" style="font-size:13px">решени '+got+' от '+d.zadachi.length
   +   (got ? ' · <b style="color:var(--zlat)">'+got+' отметнати</b>' : '')+'</div>'
   + '<div class="spisuk">'
   + d.zadachi.map((q,j)=>
       '<div class="karta-red">'
       + '<button class="karta'+(S.reshene[q.id]?' gotova':'')+'" data-z="'+j+'">'
       + '<span class="gl"><span>'+(j+1)+' · '+vidIme(q.vid)+'</span>'
       + '<span>'+(S.reshene[q.id]?'✓':'')+'</span></span>'
       + '<span class="mat">'+ekraniraj(q.izraz)+'</span></button>'
       + '<button class="otmetka'+(S.reshene[q.id]?' ima':'')+'" data-o="'+j+'" '
       + 'title="отметни я като решена">✓</button></div>').join('')
   + '</div>'
   + '<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">'
   +   (got >= d.nujni
       ? '<button class="but" id="bOtvori">'+(otvoren?'НАПРЕД →':'ЗАВЕСАТА ПАДА →')+'</button>'
       : '<button class="but" id="bOtvori">ЗАВЕСАТА ПАДА →</button>')
   +   (i>0?' <button class="but tih" id="bNazad">← предишно действие</button>':'')
   + '</div></div>';
  $$('.karta', scena).forEach(b => b.addEventListener('click', ()=> ekranZadacha(i, +b.dataset.z)));
  $$('.otmetka', scena).forEach(b => b.addEventListener('click', function(e){
    e.stopPropagation(); otmetni(i, +b.dataset.o);
  }));
  const bo = $('#bOtvori');
  if(bo) bo.addEventListener('click', ()=>{
    if(!otvoren){ S.otvoreni.push(i); zapazi(); osveji(); zvAkt(); }
    if(i >= EZERO.fuete.length) return ekranPosledno();
    return S.fueteGotovi.indexOf(i) === -1 ? ekranFuete(i) : ekranAkt(i+1);
  });
  const bn = $('#bNazad'); if(bn) bn.addEventListener('click', ()=> ekranAkt(i-1));
  osveji();
}
function otmetni(di, qi){
  /* Отмятането е за преподавателя: задачата е решена на дъската и тук
     само се маркира. Повторното щракване я връща неотметната. */
  const q = EZERO.deistviq[di].zadachi[qi];
  if(S.reshene[q.id]){ delete S.reshene[q.id]; S.biti = Math.max(0, S.biti - 10); }
  else { S.reshene[q.id] = true; S.biti += 10; zvOk(); }
  zapazi(); osveji(); ekranAkt(di);
}
function vidIme(v){
  return v === 'kub' ? 'модел' : v === 'paskal' ? 'триъгълник' : v === 'dvoiki' ? 'свързване'
       : v === 'naum' ? 'наум' : v === 'chislo' ? 'число' : v === 'izbor' ? 'разпознаване'
       : 'сглобяване';
}

function ekranProgram(){
  document.body.classList.remove('fuete'); spriFuete(); tonAkt(null);
  scena.innerHTML =
   '<div class="panel"><div class="etiket">програма</div><h2>Спектакълът</h2>'
   + '<div class="spisuk">'
   + EZERO.deistviq.map((d,i)=>'<button class="karta'+(aktOtvoren(i)?' gotova':'')+'" data-s="'+i+'">'
       + '<span class="gl"><span>ДЕЙСТВИЕ '+d.kod+'</span><span>'+broiReshene(d)+'/'+d.zadachi.length+'</span></span>'
       + '<span class="mat">'+ekraniraj(d.ime)+'</span>'
       + '<span class="muten" style="font-size:12px">'+ekraniraj(d.formula)+'</span></button>').join('')
   + '</div><div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">'
   + '<button class="but" id="bFinal">КЪМ ФИНАЛА →</button>'
   + '<button class="but tih" id="bObratno">← обратно</button></div></div>';
  $$('.karta', scena).forEach(b => b.addEventListener('click', ()=> ekranAkt(+b.dataset.s)));
  const bf = $('#bFinal'); if(bf) bf.addEventListener('click', ekranPosledno);
  $('#bObratno').addEventListener('click', ()=> ekranAkt(parvNezavursen()));
}
</script>

<script>
/* =====================================================================
   6. ЗАДАЧА
   ===================================================================== */
let OPIT = null;

function ekranZadacha(di, qi){
  document.body.classList.remove('fuete'); spriFuete();
  const d = EZERO.deistviq[di], q = d.zadachi[qi];
  tonAkt(di);
  OPIT = {di:di, qi:qi, greshki:0, ideya:false, izbrani:[], aktiven:null, izbran:null};
  scena.innerHTML =
   '<div class="panel">'
   + '<div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center">'
   +   '<div><div class="etiket">действие '+d.kod+' · '+(qi+1)+' от '+d.zadachi.length+'</div>'
   +   '<div class="muten" style="font-size:12px">'+vidIme(q.vid)+'</div></div>'
   +   '<button class="but tih" id="bKumAkt">← действие '+d.kod+'</button></div>'
   + '<div class="mat izraz" style="margin-top:10px">'
   +   ekraniraj(q.vupros && q.vid === 'izbor' ? q.vupros + ' ' + q.izraz : q.izraz)+'</div>'
   + (q.ideya ? '<div style="margin-top:10px"><button class="but tih" id="bIdeya">ИДЕЯ · −3 точки</button>'
                + '<span id="ideyaTekst" class="muten" style="margin-left:10px"></span></div>' : '')
   + (q.vid === 'chislo' || q.vid === 'naum' ? ''
      : '<div style="margin-top:12px"><button class="but" id="bReshena">'
      + 'РЕШИХМЕ Я НА ДЪСКАТА · покажи отговора</button></div>')
   + '<div id="tqlo"></div><div id="zashtoKutiq"></div></div>';
  $('#bKumAkt').addEventListener('click', ()=> ekranAkt(di));
  const bRe0 = $('#bReshena'); if(bRe0) bRe0.addEventListener('click', ()=> uspeh(q));
  const bi = $('#bIdeya');
  if(bi) bi.addEventListener('click', function(){
    OPIT.ideya = true; S.biti = Math.max(0, S.biti-3); zapazi(); osveji();
    $('#ideyaTekst').textContent = q.ideya; this.disabled = true;
  });

  if(q.vid === 'kub') risuvaiKub(q);
  else if(q.vid === 'paskal') risuvaiPaskal(q);
  else if(q.vid === 'dvoiki') risuvaiDvoiki(q);
  else if(q.vid === 'izbor') risuvaiIzbor(q);
  else if(q.vid === 'chislo' || q.vid === 'naum') risuvaiChislo(q);
  else risuvaiChipove(q);
}

/* ── 6.1 моделът на куба ─────────────────────────────────────────── */
function kubSvg(){
  /* Изометрия: виждат се точно три стени — горната (z = s) и двете
     предни (x = s и y = s). Кубът е разрязан с три равнини на разстояние
     a от началото, затова всяка видима стена е разделена на четири. */
  const a = 86, b = 44, s = a + b;
  const K = 0.866, ox = 170, oy = 26;
  const P = (x,y,z) => [ox + (x - y)*K, oy + (x + y)*0.5 - z + s];
  const stena = (pts, gust) => '<path d="M' + pts.map(q => q[0].toFixed(1)+' '+q[1].toFixed(1))
      .join(' L') + ' Z" fill="var(--ton)" fill-opacity="'+gust+'" stroke="var(--ton)" '
      + 'stroke-width="2" stroke-linejoin="round"/>';
  const rez = (p1,p2) => '<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'
      + p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="var(--ton)" stroke-opacity=".55" '
      + 'stroke-width="1.2"/>';
  const nadpis = (q, t, dx, dy) => '<text x="'+(q[0]+dx).toFixed(1)+'" y="'+(q[1]+dy).toFixed(1)
      + '" fill="var(--blqd)" font-size="13" font-family="JetBrains Mono, monospace" '
      + 'text-anchor="middle">'+t+'</text>';
  return '<svg viewBox="0 0 340 300" role="img" '
    + 'aria-label="куб със страна a + b, разрязан на осем парчета">'
    + stena([P(0,0,s), P(s,0,s), P(s,s,s), P(0,s,s)], .30)      /* горе   */
    + stena([P(s,0,s), P(s,s,s), P(s,s,0), P(s,0,0)], .17)      /* дясно  */
    + stena([P(0,s,s), P(s,s,s), P(s,s,0), P(0,s,0)], .10)      /* ляво   */
    + rez(P(a,0,s), P(a,s,s)) + rez(P(0,a,s), P(s,a,s))
    + rez(P(s,a,s), P(s,a,0)) + rez(P(s,0,a), P(s,s,a))
    + rez(P(a,s,s), P(a,s,0)) + rez(P(0,s,a), P(s,s,a))
    /* малкото кубче b³ — предният долен ъгъл, двете му видими стени */
    + '<path d="M' + [P(s,a,a), P(s,s,a), P(s,s,0), P(s,a,0)]
        .map(q => q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')
      + ' Z" fill="var(--zlat)" fill-opacity=".45" stroke="var(--zlat)" stroke-width="1.5"/>'
    + '<path d="M' + [P(a,s,a), P(s,s,a), P(s,s,0), P(a,s,0)]
        .map(q => q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')
      + ' Z" fill="var(--zlat)" fill-opacity=".30" stroke="var(--zlat)" stroke-width="1.5"/>'
    + nadpis(P(s,s,a/2), 'a', 16, 4) + nadpis(P(s,s,a+b/2), 'b', 16, 4)
    + nadpis(P(s,a/2,0), 'a', 14, 14) + nadpis(P(s,a+b/2,0), 'b', 14, 14)
    + nadpis(P(a/2,s,0), 'a', -14, 14) + nadpis(P(a+b/2,s,0), 'b', -14, 14)
    + nadpis(P(s,s,0), 'b³', 0, 30)
    + '</svg>';
}
const KUB_OPIS = {'a³':'кубчето a · a · a', 'a²b':'плочка a · a · b',
                  'ab²':'летва a · b · b', 'b³':'малкото кубче b · b · b'};
const KUB_IZBOR = [1, 2, 3, 4, 6];

function risuvaiKub(q){
  /* Никъде не се пише: броят парчета се избира с щракане. Вярното
     число заключва реда, грешното се разтърсва и отпада. */
  const gotovi = {};
  $('#tqlo').innerHTML =
    '<p class="muten" style="font-size:13px;margin-top:14px">' + ekraniraj(q.vupros) + '</p>'
    + '<div class="kub">' + kubSvg()
    + '<div class="parcheta">'
    + q.parcheta.map(function(p, i){
        return '<div class="parche" id="p-' + i + '">'
          + '<span class="ime mat">' + ekraniraj(p[0]) + '</span>'
          + '<span class="opis">' + ekraniraj(KUB_OPIS[p[0]] || '') + '</span>'
          + '<span class="broeve" id="b-' + i + '">'
          + KUB_IZBOR.map(function(n){
              return '<button class="broj" data-p="' + i + '" data-n="' + n + '">' + n + '</button>';
            }).join('')
          + '</span></div>';
      }).join('')
    + '</div></div>';
  $$('.broj', $('#tqlo')).forEach(function(b){
    b.addEventListener('click', function(){
      const i = +b.dataset.p, veren = q.parcheta[i][1];
      if(+b.dataset.n === veren){
        gotovi[i] = true;
        $('#b-' + i).innerHTML = '<span class="izbrano">' + veren + '</span>';
        $('#p-' + i).classList.add('ok');
        zvOk();
        if(Object.keys(gotovi).length === q.parcheta.length)
          setTimeout(function(){ uspeh(q); }, 300);
      }else{
        b.classList.add('gresh'); b.disabled = true;
        OPIT.greshki++; S.greshki++; S.biti = Math.max(0, S.biti - 1);
        zapazi(); osveji(); zvNe();
        kaji(OPIT.greshki >= 2
          ? 'Плочките a²b и летвите ab² са по равно.'
          : 'Не е този брой. Погледни колко парчета от този вид има на чертежа.');
      }
    });
  });
}

/* ── 6.2 триъгълникът на Паскал ──────────────────────────────────── */
function risuvaiPaskal(q){
  const skriti = q.skriti.map(s => s.join('-'));
  const dadeni = {};
  function cel(i,j){
    const k = i+'-'+j, v = q.redove[i][j];
    if(skriti.indexOf(k) === -1 || dadeni[k])
      return '<div class="pcell'+(dadeni[k]?' puln':'')+(i===3?' red4':'')+'">'+v+'</div>';
    return '<button class="pcell skrit'+(OPIT.aktiven === k ? ' aktiven':'')+'" data-k="'+k+'">?</button>';
  }
  function prerisuvai(){
    const gotovo = skriti.every(k => dadeni[k]);
    $('#tqlo').innerHTML =
      '<p class="muten" style="font-size:13px;margin-top:14px">'+ekraniraj(q.vupros)+'</p>'
      + '<div class="paskal">'
      + q.redove.map((red,i)=>'<div class="pred">'
          + red.map((v,j)=> cel(i,j)).join('') + '</div>').join('')
      + '</div>'
      + (gotovo ? '' : '<div class="izbor" id="pool">'
          + razburkai([1,2,3,4,6,5,7], q.id).map(n =>
              '<button class="chip" data-n="'+n+'">'+n+'</button>').join('') + '</div>');
    $$('.pcell.skrit').forEach(b => b.addEventListener('click', ()=>{
      OPIT.aktiven = b.dataset.k; prerisuvai();
    }));
    $$('#pool .chip').forEach(b => b.addEventListener('click', ()=>{
      if(!OPIT.aktiven) return kaji('Първо избери празно квадратче.');
      const [i,j] = OPIT.aktiven.split('-').map(Number);
      if(+b.dataset.n === q.redove[i][j]){
        dadeni[OPIT.aktiven] = true;
        OPIT.aktiven = skriti.find(k => !dadeni[k]) || null;
        zvOk(); prerisuvai();
      }else{
        b.classList.add('gresh'); OPIT.greshki++; S.greshki++;
        S.biti = Math.max(0,S.biti-1); zapazi(); osveji(); zvNe();
        kaji('Не е това. Съберете двете числа точно над празното място.');
      }
    }));
    if(gotovo){
      $('#tqlo').insertAdjacentHTML('beforeend',
        '<div class="zashto" style="border-color:var(--zlat)"><div class="nd">ТРИЪГЪЛНИКЪТ КАЗВА</div>'
        + '<div class="mat izraz" style="font-size:19px">'+ekraniraj(q.izvod)+'</div></div>');
      setTimeout(()=> uspeh(q), 300);
    }
  }
  OPIT.aktiven = skriti[0];
  prerisuvai();
}

/* ── 6.3 свързване по двойки ─────────────────────────────────────── */
function risuvaiDvoiki(q){
  const lqvo = razburkai(q.dvojki.map(p => p[0]), q.id + 'L');
  const dqsno = razburkai(q.dvojki.map(p => p[1]), q.id + 'R');
  const karta = {};
  q.dvojki.forEach(p => { karta[p[0]] = p[1]; });
  const svurzani = {};
  $('#tqlo').innerHTML =
    '<p class="muten" style="font-size:13px;margin-top:14px">'+ekraniraj(q.vupros)+'</p>'
    + '<div class="dvoiki"><div class="kol">'
    + lqvo.map(t => '<button data-l="'+ekraniraj(t)+'">'+ekraniraj(t)+'</button>').join('')
    + '</div><div class="kol">'
    + dqsno.map(t => '<button data-r="'+ekraniraj(t)+'">'+ekraniraj(t)+'</button>').join('')
    + '</div></div>';
  $$('.dvoiki [data-l]').forEach(b => b.addEventListener('click', ()=>{
    $$('.dvoiki [data-l]').forEach(x => x.classList.remove('izbran'));
    b.classList.add('izbran'); OPIT.izbran = b.dataset.l; zvTik();
  }));
  $$('.dvoiki [data-r]').forEach(b => b.addEventListener('click', ()=>{
    if(!OPIT.izbran) return kaji('Първо избери отляво.');
    if(karta[OPIT.izbran] === b.dataset.r){
      b.classList.add('svurzan');
      $('.dvoiki [data-l="'+CSS.escape(OPIT.izbran)+'"]').classList.add('svurzan');
      $$('.dvoiki [data-l]').forEach(x => x.classList.remove('izbran'));
      svurzani[OPIT.izbran] = true; OPIT.izbran = null; zvOk();
      if(Object.keys(svurzani).length === q.dvojki.length) setTimeout(()=> uspeh(q), 250);
    }else{
      b.classList.add('gresh'); setTimeout(()=> b.classList.remove('gresh'), 400);
      OPIT.greshki++; S.greshki++; S.biti = Math.max(0,S.biti-1); zapazi(); osveji(); zvNe();
      kaji('Не си пасват. Отвори скобите наум: кои два члена остават?');
    }
  }));
}

/* ── 6.4 чипове ──────────────────────────────────────────────────── */
function risuvaiChipove(q){
  OPIT.izbrani = [];
  const pool = razburkai(q.chipove, q.id);
  $('#tqlo').innerHTML =
     '<p class="muten" style="font-size:13px;margin-top:14px">Сглоби отговора от членовете. '
   + 'Част от тях са типичните грешки.</p>'
   + '<div class="redica" id="redica"></div>'
   + '<div class="izbor" id="pool">'
   + pool.map((t,i)=>'<button class="chip" data-t="'+ekraniraj(t)+'"><span class="nom">'
       +(i+1)+'</span>'+ekraniraj(t)+'</button>').join('')
   + '</div>'
   + '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'
   +   '<button class="but" id="bProveri">ПРОВЕРИ</button>'
   +   '<button class="but tih" id="bIzchisti">изчисти</button></div>';
  function prerisuvai(){
    $('#redica').innerHTML = OPIT.izbrani.map((t,i)=>
      '<button class="chip" data-i="'+i+'">'+ekraniraj(t)+' ×</button>').join('');
    $$('#redica .chip').forEach(b => b.addEventListener('click', ()=>{
      OPIT.izbrani.splice(+b.dataset.i,1); prerisuvai(); zvTik();
    }));
    $$('#pool .chip').forEach(b => {
      const vzeto = OPIT.izbrani.filter(t => t === b.dataset.t).length;
      const ima = pool.filter(t => t === b.dataset.t).length;
      b.classList.toggle('vzet', vzeto >= ima);
    });
  }
  $$('#pool .chip').forEach(b => b.addEventListener('click', ()=>{
    OPIT.izbrani.push(b.dataset.t); prerisuvai(); zvTik();
  }));
  $('#bIzchisti').addEventListener('click', ()=>{ OPIT.izbrani = []; prerisuvai(); });
  $('#bProveri').addEventListener('click', ()=> proveriChipove(q));
  prerisuvai();
}
function proveriChipove(q){
  const dadeni = OPIT.izbrani.slice().sort(), verni = q.otgovor.slice().sort();
  if(dadeni.length === verni.length && dadeni.every((t,i)=> t === verni[i])) return uspeh(q);
  OPIT.greshki++; S.greshki++; S.biti = Math.max(0,S.biti-2); zapazi(); osveji(); zvNe();
  const greshni = OPIT.izbrani.filter(t => q.otgovor.indexOf(t) === -1).length;
  const lipsvat = q.otgovor.filter(t => OPIT.izbrani.indexOf(t) === -1).length;
  const r = $('#redica'); r.classList.add('tres'); setTimeout(()=> r.classList.remove('tres'), 450);
  if(OPIT.greshki >= 2) $$('#redica .chip').forEach(b=>{
    if(q.otgovor.indexOf(b.textContent.replace(' ×','')) === -1) b.classList.add('gresh');
  });
  kaji(greshni && lipsvat ? greshni+' сгрешени и '+lipsvat+' липсващи члена.'
      : greshni ? greshni+' от избраните не са в отговора.' : 'Липсват '+lipsvat+' члена.');
}

/* ── 6.5 разпознаване ────────────────────────────────────────────── */
function risuvaiIzbor(q){
  $('#tqlo').innerHTML = '<div class="golemi">'
    + razburkai(q.izbori, q.id).map(t =>
        '<button data-t="'+ekraniraj(t)+'">'+ekraniraj(t)+'</button>').join('') + '</div>';
  $$('.golemi button').forEach(b => b.addEventListener('click', ()=>{
    if(b.dataset.t === q.veren){ b.classList.add('vqrno'); return uspeh(q); }
    b.classList.add('gresh'); b.disabled = true;
    OPIT.greshki++; S.greshki++; S.biti = Math.max(0,S.biti-2); zapazi(); osveji(); zvNe();
    kaji('Не е това. Провери знака в малката скоба.');
  }));
}

/* ── 6.6 число и наум ────────────────────────────────────────────── */
/* Урокът се води от дъската: тук никъде не се пише. Задачата се чете,
   смята се на дъската, а бутонът показва отговора и я отмята. */
function risuvaiChislo(q){
  const naum = q.vid === 'naum';
  $('#tqlo').innerHTML =
    '<p class="muten" style="font-size:13px;margin-top:14px">'
    + (naum ? 'Пресметнете наум, през формулата — на дъската.'
            : 'Решете я на дъската.')
    + ' Когато сте готови, покажете отговора.</p>'
    + '<div class="chislo-red">'
    +   '<button class="but" id="bPokaji">ПОКАЖИ ОТГОВОРА</button>'
    +   '<span class="mat izraz" id="otgovorut" hidden></span>'
    + '</div>';
  $('#bPokaji').addEventListener('click', function(){
    const o = $('#otgovorut');
    o.hidden = false;
    o.textContent = (naum || q.promenliva === 'отговорът' ? '= ' : q.promenliva + ' = ')
                  + q.koren;
    uspeh(q);
  });
}

/* ── 6.7 общото ──────────────────────────────────────────────────── */
function kaji(tekst){
  let k = $('#kazano');
  if(!k){
    k = document.createElement('div'); k.id = 'kazano';
    k.style.cssText = 'margin-top:12px;color:var(--cherven);font-weight:700';
    $('#tqlo').appendChild(k);
  }
  k.textContent = tekst;
}
function uspeh(q){
  const parvi = !S.reshene[q.id];
  let nagrada = 10 - (OPIT.ideya ? 4 : 0) - Math.min(6, OPIT.greshki*2);
  nagrada = Math.max(2, nagrada);
  if(parvi){ S.reshene[q.id] = true; S.biti += nagrada; }
  zapazi(); osveji(); zvOk();
  const d = EZERO.deistviq[OPIT.di];
  const sled = d.zadachi.findIndex((x,j)=> j > OPIT.qi && !S.reshene[x.id]);
  $$('#tqlo button').forEach(b => b.disabled = true);
  const bRe = $('#bReshena'); if(bRe) bRe.disabled = true;
  $$('#tqlo input').forEach(b => b.disabled = true);
  $('#zashtoKutiq').innerHTML =
     '<div class="zashto"><div class="nd">ЗАЩО</div>'
   + (q.sled ? '<div class="mat">'+ekraniraj(q.izraz)+' = '+ekraniraj(q.sled)+'</div>' : '')
   + q.zashto.map(r=>'<div class="mat" style="font-weight:400">'+ekraniraj(r)+'</div>').join('')
   + '</div>'
   + '<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
   +   '<b style="color:var(--zlat)">+'+(parvi?nagrada:0)+' точки</b>'
   +   (sled !== -1 ? '<button class="but" id="bSled">СЛЕДВАЩА →</button>' : '')
   +   '<button class="but'+(sled === -1 ? '' : ' tih')+'" id="bNazadAkt">КЪМ ДЕЙСТВИЕ '+d.kod+'</button>'
   + '</div>';
  const bs = $('#bSled');
  if(bs) bs.addEventListener('click', ()=> ekranZadacha(OPIT.di, sled));
  $('#bNazadAkt').addEventListener('click', ()=> ekranAkt(OPIT.di));
  $('#zashtoKutiq').scrollIntoView({behavior:'smooth', block:'nearest'});
}
</script>

<script>
/* =====================================================================
   7. ФУЕТЕТАТА
   ===================================================================== */
let GL = null, GL_TIK = null;
const SEK_NA_RED = 12;
function spriFuete(){ if(GL_TIK){ clearInterval(GL_TIK); GL_TIK = null; } }

function ekranFuete(i){
  spriFuete(); document.body.classList.add('fuete');
  const g = EZERO.fuete[i];
  tonAkt(i);
  GL = {i:i, k:0, toch:[0,0], seriq:0, naiDulga:0, suveti:2, zakl:[false,false],
        pauza:false, ostava:SEK_NA_RED, prikliuchil:false, biti:0, nachalo:S.fuete};
  scena.innerHTML =
   '<div class="panel">'
   + '<div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap">'
   +   '<div><div class="etiket">фуете '+g.kod+'</div><h2>'+ekraniraj(g.ime)+'</h2></div>'
   +   '<div class="muten" style="text-align:right;font-size:13px">сцената показва равенство<br>'
   +   'казвате бързо: вярно или грешно</div></div>'
   + '<div class="stena">'+igrachPanel(0)+'<div id="scenaGl"></div>'+igrachPanel(1)+'</div>'
   + '<div style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">'
   +   '<button class="but tih" id="bSuvet">СЪВЕТ · интервал <span id="brSuveti">2</span></button>'
   +   '<span class="muten" style="font-size:12px">съветът спира лентата за 10 секунди</span></div></div>';
  $('#bSuvet').addEventListener('click', suvet);
  pokajiRed();
}
function igrachPanel(n){
  return '<div class="igrach" id="igr'+n+'"><div class="etiket">танцьор '+(n+1)+'</div>'
    + '<b>'+ekraniraj(S.imena[n])+'</b><div class="toch" id="toch'+n+'">0</div>'
    + '<div class="butoni2">'
    + '<button class="da" data-i="'+n+'" data-v="1"><span class="klav">'+(n?'K':'A')+'</span><br>ВЯРНО</button>'
    + '<button class="ne" data-i="'+n+'" data-v="0"><span class="klav">'+(n?'M':'Z')+'</span><br>ГРЕШНО</button>'
    + '</div></div>';
}
function pokajiRed(){
  const g = EZERO.fuete[GL.i];
  if(GL.k >= g.redove.length) return krajFuete();
  const r = g.redove[GL.k];
  GL.zakl = [false,false]; GL.ostava = SEK_NA_RED; GL.prikliuchil = false; GL.pauza = false;
  $('#igr0').className = 'igrach'; $('#igr1').className = 'igrach';
  $('#scenaGl').innerHTML =
    '<div class="tvurdenie"><div class="etiket">въртене '+(GL.k+1)+' от '+g.redove.length
    + (GL.seriq>1?' · серия '+GL.seriq:'')+'</div>'
    + '<div class="mat" id="redGl">'+ekraniraj(r.red)+'</div>'
    + '<div class="chasovnik"><i id="lenta"></i></div>'
    + '<div class="presuda" id="presuda">&nbsp;</div></div>';
  $$('.butoni2 button').forEach(b => b.onclick = ()=> otgovori(+b.dataset.i, b.dataset.v === '1'));
  GL_TIK = setInterval(tik, 50);
}
function tik(){
  if(GL.pauza || GL.prikliuchil) return;
  GL.ostava -= .05;
  const l = $('#lenta'); if(l) l.style.width = Math.max(0, 100*GL.ostava/SEK_NA_RED)+'%';
  if(GL.ostava <= 2.5 && Math.abs(GL.ostava % 1) < .05) zvTik();
  if(GL.ostava <= 0) razkrii(null);
}
function suvet(){
  if(!GL || GL.suveti <= 0 || GL.prikliuchil) return;
  GL.suveti--; GL.pauza = true; $('#brSuveti').textContent = GL.suveti;
  let ost = 10; $('#presuda').textContent = 'СЪВЕТ · 10';
  const t = setInterval(()=>{
    ost--; const p = $('#presuda'); if(p) p.textContent = 'СЪВЕТ · '+ost;
    if(ost <= 0){ clearInterval(t); GL.pauza = false; const q = $('#presuda'); if(q) q.innerHTML = '&nbsp;'; }
  }, 1000);
}
function otgovori(n, kazva){
  if(!GL || GL.prikliuchil || GL.zakl[n] || GL.pauza) return;
  const r = EZERO.fuete[GL.i].redove[GL.k];
  if(kazva === r.vqrno){
    GL.toch[n] += 2; S.tochki[n] += 2; GL.biti += 2; S.biti += 2;
    GL.seriq++; GL.naiDulga = Math.max(GL.naiDulga, GL.seriq);
    S.naiDulga = Math.max(S.naiDulga, GL.seriq);
    if(GL.seriq >= 3){ GL.biti++; S.biti++; }
    $('#toch'+n).textContent = GL.toch[n];
    $('#igr'+n).classList.add('gori'); zvOk(); razkrii(n);
  }else{
    GL.zakl[n] = true; GL.seriq = 0;
    S.biti = Math.max(0,S.biti-1); GL.biti -= 1;
    $('#igr'+n).classList.add('vun');
    const red = $('#redGl'); red.classList.add('tres');
    setTimeout(()=> red.classList.remove('tres'), 450);
    zvNe();
    if(GL.zakl[0] && GL.zakl[1]) razkrii(null);
  }
  osveji(); zapazi();
}
function razkrii(pobeditel){
  if(GL.prikliuchil) return;
  GL.prikliuchil = true; spriFuete();
  const r = EZERO.fuete[GL.i].redove[GL.k];
  S.fuete = Math.min(32, GL.nachalo + GL.k + 1);
  const p = $('#presuda');
  p.className = 'presuda ' + (r.vqrno ? 'ok' : 'ne');
  p.textContent = (r.vqrno ? 'ВЯРНО' : 'ГРЕШНО')
    + (pobeditel === null ? ' · никой' : ' · ' + S.imena[pobeditel]);
  if(!r.vqrno) $('#redGl').insertAdjacentHTML('afterend',
    '<div class="muten" style="font-size:14px">'+ekraniraj(r.zashto)+'</div>');
  osveji(); zapazi();
  setTimeout(()=>{ GL.k++; pokajiRed(); }, r.vqrno ? 1100 : 2100);
}
function krajFuete(){
  spriFuete(); document.body.classList.remove('fuete');
  const i = GL.i;
  if(S.fueteGotovi.indexOf(i) === -1) S.fueteGotovi.push(i);
  S.fuete = Math.min(32, (i+1)*8);
  zapazi(); osveji();
  scena.innerHTML =
   '<div class="panel" style="text-align:center">' + dekor()
   + '<div class="etiket">фуете '+EZERO.fuete[i].kod+' · край</div>'
   + '<h2>'+(S.fuete >= 32 ? 'Тридесет и двете въртения са готови' : S.fuete + ' въртения дотук')+'</h2>'
   + '<div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:20px 0">'
   +   '<div><div class="etiket">'+ekraniraj(S.imena[0])+'</div><div class="toch">'+GL.toch[0]+'</div></div>'
   +   '<div><div class="etiket">най-дълга серия</div><div class="toch" style="color:var(--zlat)">'
       +GL.naiDulga+'</div></div>'
   +   '<div><div class="etiket">'+ekraniraj(S.imena[1])+'</div><div class="toch">'+GL.toch[1]+'</div></div>'
   + '</div>'
   + '<p class="muten">отборът спечели <b style="color:var(--zlat)">'+Math.max(0,GL.biti)+' точки</b></p>'
   + '<button class="but" id="bNapred">ДЕЙСТВИЕ '+EZERO.deistviq[i+1].kod+' →</button>'
   + ' <button class="but tih" id="bPak">още веднъж</button></div>';
  $('#bNapred').addEventListener('click', ()=> ekranAkt(i+1));
  $('#bPak').addEventListener('click', ()=> ekranFuete(i));
}

/* =====================================================================
   8. МАГИЯТА
   ===================================================================== */
function ekranPosledno(){
  spriFuete(); document.body.classList.remove('fuete'); tonAkt(null);
  /* Нищо не се заключва и нищо не се въвежда: въпросът се мисли на
     дъската, а бутонът показва отговора. */
  scena.innerHTML =
   '<div class="panel">' + dekor()
   + '<div class="etiket" style="color:var(--zlat)">финал</div>'
   + '<h2 style="color:var(--zlat)">Последното число</h2>'
   + '<div class="posledno"><p class="proza">'+ekraniraj(EZERO.posledno.vupros)+'</p>'
   + '<div class="chislo-red" style="justify-content:center">'
   +   '<button class="but" id="bPokajiKraj">ПОКАЖИ ОТГОВОРА</button>'
   +   '<span class="mat izraz" id="otgKraj" style="color:var(--zlat)" hidden></span></div>'
   + '<div id="finalKaz" class="muten" style="min-height:24px"></div>'
   + '<button class="but" id="bNatatuk" hidden>ЗОРАТА ИЗГРЯВА →</button>'
   + '</div></div>';
  $('#bPokajiKraj').addEventListener('click', function(){
    this.disabled = true;
    const o = $('#otgKraj');
    o.hidden = false; o.textContent = EZERO.posledno.otgovor;
    $('#finalKaz').textContent = EZERO.posledno.zashto;
    $('#bNatatuk').hidden = false;
    zvFinal();
  });
  $('#bNatatuk').addEventListener('click', ekranFinal);
}

/* =====================================================================
   9. ПОКЛОНЪТ
   ===================================================================== */
function ekranFinal(){
  spriFuete(); tonAkt(null);
  S.svurshen = true; zapazi(); osveji();
  const sek = minaloto();
  const vsichki = EZERO.deistviq.reduce((n,d)=> n + d.zadachi.length, 0);
  scena.innerHTML =
   '<div class="panel" style="border-color:var(--zlat)">' + dekor()
   + '<div class="etiket" style="color:var(--zlat)">зората</div>'
   + '<h1 style="color:var(--zlat)">Зората изгрява.</h1>'
   + '<p class="proza" style="max-width:62ch">'+ekraniraj(EZERO.posledno.zashto)+'</p>'
   + '<p class="proza" style="max-width:62ch">Четирите формули вече не са четири неща за помнене: '
   +   'кубът се разглобява на осем парчета, знаците се редуват, а сборът и разликата на кубове '
   +   'са огледални — отвън едно, вътре другото.</p>'
   + '<div class="vaucher"><table>'
   +   red2('време на сцената', chasovnik(sek)) + red2('събрани точки', S.biti)
   +   red2('решени задачи', vsichkiReshene()+' от '+vsichki)
   +   red2('фуете', S.fuete + ' от 32')
   +   red2('ФУЕТЕ · '+ekraniraj(S.imena[0]), S.tochki[0])
   +   red2('ФУЕТЕ · '+ekraniraj(S.imena[1]), S.tochki[1])
   +   red2('най-дълга серия', S.naiDulga)
   + '</table></div>'
   + '<h2 style="margin-top:26px">Програмата</h2>'
   + '<p class="muten" id="chiiRed">'+ekraniraj(S.imena[0])+', избери своята роля за поклона.</p>'
   + '<div class="programka" id="menu">'
   + EZERO.programka.map((r,i)=>'<button class="rolq" data-q="'+i+'"><b>'+ekraniraj(r[0])+'</b>'
       + '<span>'+ekraniraj(r[1])+'</span></button>').join('')
   + '</div><div id="poruchka"></div>'
   + '<div class="zashto" style="border-color:var(--zlat);margin-top:26px">'
   +   '<div class="nd">КАКВО ОСТАВА СЛЕД ТАЗИ ВЕЧЕР</div>'
   +   ['(a + b)³ = a³ + 3a²b + 3ab² + b³ — тройките идват от трите еднакви парчета.',
       '(a − b)³ = a³ − 3a²b + 3ab² − b³ — същите числа, редуващи се знаци.',
       'a³ − b³ = (a − b)(a² + ab + b²) — отвън минус, вътре плюс.',
       'a³ + b³ = (a + b)(a² − ab + b²) — отвън плюс, вътре минус.',
       '101³ и 99³ се смятат наум; 12³ − 8³ не се вдига на куб, а се разлага.']
       .map(r=>'<div class="mat" style="font-weight:400">'+r+'</div>').join('')
   + '</div>'
   + '<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">'
   +   '<button class="but" id="bPechat">ПЕЧАТ НА ПРОГРАМАТА</button>'
   +   '<button class="but tih" id="bPakVsichko">ОТНАЧАЛО</button></div></div>';
  $$('#menu .rolq').forEach(b => b.addEventListener('click', ()=>{
    const n = S.roli[0] === null ? 0 : 1;
    S.roli[n] = +b.dataset.q; zapazi(); zvOk();
    $$('#menu .rolq').forEach(x => x.style.borderColor =
      S.roli.indexOf(+x.dataset.q) !== -1 ? 'var(--zlat)' : '');
    if(S.roli[1] === null) $('#chiiRed').textContent = S.imena[1] + ', сега ти.';
    else{
      $('#chiiRed').textContent = 'Поклон.';
      $('#poruchka').innerHTML = '<div class="vaucher"><div class="etiket" style="color:var(--zlat)">'
        + 'програма за поклона</div><table>'
        + red2(ekraniraj(S.imena[0]), ekraniraj(EZERO.programka[S.roli[0]][0]))
        + red2(ekraniraj(S.imena[1]), ekraniraj(EZERO.programka[S.roli[1]][0]))
        + red2('спектакълът трая', chasovnik(sek)) + '</table></div>';
    }
  }));
  $('#bPechat').addEventListener('click', ()=> window.print());
  $('#bPakVsichko').addEventListener('click', ()=> $('#bNulirai').click());
}
function red2(a,b){ return '<tr><td>'+a+'</td><td>'+b+'</td></tr>'; }

/* =====================================================================
   10. КЛАВИАТУРАТА
   ===================================================================== */
document.addEventListener('keydown', function(e){
  if(GL && $('.stena')){
    if(e.code === 'KeyA'){ otgovori(0,true);  e.preventDefault(); return; }
    if(e.code === 'KeyZ'){ otgovori(0,false); e.preventDefault(); return; }
    if(e.code === 'KeyK'){ otgovori(1,true);  e.preventDefault(); return; }
    if(e.code === 'KeyM'){ otgovori(1,false); e.preventDefault(); return; }
    if(e.code === 'Space'){ suvet(); e.preventDefault(); return; }
  }
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  const pool = $('#pool');
  if(pool){
    const n = +(e.key);
    if(n >= 1 && n <= pool.children.length){
      const c = pool.children[n-1];
      if(c && !c.classList.contains('vzet')) c.click();
      e.preventDefault(); return;
    }
    if(e.key === 'Backspace'){
      const r = $('#redica');
      if(r && r.lastElementChild){ r.lastElementChild.click(); e.preventDefault(); }
      return;
    }
  }
  if(e.key === 'Enter'){ const b = $('#bProveri'); if(b && !b.disabled) b.click(); }
});

/* =====================================================================
   11. ЗАВЕСАТА
   ===================================================================== */
vuzstanovi();
osveji();
if(S.zvuk === false){ $('#bZvuk').textContent = '✕'; $('#bZvuk').style.color = '#3c4a6e'; }
window.addEventListener('beforeunload', zapazi);
setInterval(zapazi, 15000);
ekranUvertura();
</script>
</body>
</html>
